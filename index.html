function NewEventModal({onClose,onCreated}) {
  const COLORS=['from-amber-600 to-orange-700','from-violet-700 to-indigo-800','from-teal-700 to-green-900','from-blue-700 to-cyan-800','from-pink-700 to-rose-800','from-slate-700 to-zinc-800'];
  const[form,setForm]=useState({name:'',subtitle:'',startDate:'',endDate:'',venueAddr:'',hotelAddr:'',color:COLORS[0]});
  const set=k=>e=>setForm(p=>({...p,[k]:e.target.value}));
  const inp='w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-zinc-100 text-sm placeholder-zinc-600';

  const fmtDate=s=>{if(!s) return'';const[y,m,d]=s.split('-');return`${d}.${m}.${y}`;};

  const save=()=>{
    if(!form.name.trim()||!form.startDate) return;
    const id='ev'+Date.now();
    const d1=fmtDate(form.startDate),d2=fmtDate(form.endDate||form.startDate);
    const ev={
      id,name:form.name.trim(),subtitle:form.subtitle.trim(),
      startDate:form.startDate,endDate:form.endDate||form.startDate,
      date:form.endDate&&form.endDate!==form.startDate?`${d1}–${d2}`:d1,
      dateShort:d1,color:form.color,
      venueAddr:form.venueAddr,hotelAddr:form.hotelAddr,
      venueLat:null,venueLng:null,hotelLat:null,hotelLng:null,
      artistCount:0,crewCount:0,checkPct:0,
      floors:[],artists:[],pickups:[],contacts:[],info:[],techInfo:[],guestlist:[],friendslist:[],staffSlots:[],
    };
    fbSet(`backstage/events/${id}`,ev);
    onCreated&&onCreated(id);
    onClose();
  };

  return (
    <div className="fixed inset-0 bg-black/75 z-50 flex items-end" onClick={onClose}>
      <div className="w-full bg-zinc-900 rounded-t-3xl p-6 safe-bottom slide-up max-h-[90vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="w-10 h-1 bg-zinc-700 rounded-full mx-auto mb-5"/>
        <div className="text-xl font-bold text-white mb-5">Neues Event</div>
        <div className="mb-3"><div className="text-xs text-zinc-500 mb-1.5">Name *</div><input value={form.name} onChange={set('name')} placeholder="UNREAL" className={inp}/></div>
        <div className="mb-3"><div className="text-xs text-zinc-500 mb-1.5">Untertitel</div><input value={form.subtitle} onChange={set('subtitle')} placeholder="Venue · Stadt" className={inp}/></div>
        <div className="flex gap-3 mb-3">
          <div className="flex-1"><div className="text-xs text-zinc-500 mb-1.5">Start *</div><input type="date" value={form.startDate} onChange={set('startDate')} className={inp}/></div>
          <div className="flex-1"><div className="text-xs text-zinc-500 mb-1.5">Ende</div><input type="date" value={form.endDate} onChange={set('endDate')} className={inp}/></div>
        </div>
        <div className="mb-3"><div className="text-xs text-zinc-500 mb-1.5">Venue Adresse</div><input value={form.venueAddr} onChange={set('venueAddr')} placeholder="Straße, PLZ Ort" className={inp}/></div>
        <div className="mb-4"><div className="text-xs text-zinc-500 mb-1.5">Hotel Adresse</div><input value={form.hotelAddr} onChange={set('hotelAddr')} placeholder="optional" className={inp}/></div>
        <div className="mb-5">
          <div className="text-xs text-zinc-500 mb-2">Farbe</div>
          <div className="flex gap-2 flex-wrap">
            {COLORS.map(c=><button key={c} onClick={()=>setForm(p=>({...p,color:c}))} className={`w-10 h-10 rounded-xl bg-gradient-to-br ${c} border-2 transition-all active:scale-95 ${form.color===c?'border-white scale-105':'border-transparent'}`}/>)}
          </div>
        </div>
        <div className="flex gap-3">
          <button onClick={onClose} className="flex-1 border border-zinc-700 text-zinc-400 font-semibold py-3.5 rounded-2xl text-sm">Abbrechen</button>
          <button onClick={save} className="flex-1 bg-amber-500 text-black font-bold py-3.5 rounded-2xl text-sm active:scale-[.98]">Erstellen</button>
        </div>
      </div>
    </div>
  );
}

/* ── GUEST LIST COMPONENT ── */
const GUEST_CATEGORIES=['VIP','Press','Industry'];
const CAT_STYLE={VIP:'text-amber-400 bg-amber-500/10 border-amber-500/30',Press:'text-blue-400 bg-blue-500/10 border-blue-500/30',Industry:'text-violet-400 bg-violet-500/10 border-violet-500/30'};

function GuestListView({entries,listType,eventId,canEdit}) {
  const [search,setSearch]=useState('');
  const [checkins,setCheckins]=useState({});
  const [extras,setExtras]=useState({});
  const [showAdd,setShowAdd]=useState(false);
  const [newName,setNewName]=useState('');
  const [newPlus,setNewPlus]=useState('0');
  const [newCat,setNewCat]=useState('VIP');
  const [newNote,setNewNote]=useState('');

  const fbChk=`backstage/guestCheckins/${eventId}/${listType}`;
  const fbExt=`backstage/extraGuests/${eventId}/${listType}`;
  useEffect(()=>fbOn(fbChk,v=>setCheckins(v||{})),[fbChk]);
  useEffect(()=>fbOn(fbExt,v=>setExtras(v||{})),[fbExt]);

  const toggle=id=>fbSet(`${fbChk}/${id}`,!checkins[id]);

  const addEntry=()=>{
    if(!newName.trim()) return;
    const id='g'+Date.now();
    const entry={id,name:newName.trim(),plus:parseInt(newPlus)||0,note:newNote.trim(),...(listType==='guestlist'?{category:newCat}:{})};
    // Write ONLY to Firebase — the listener will pick it up and update display
    fbSet(`${fbExt}/${id}`,entry);
    setNewName('');setNewPlus('0');setNewNote('');setShowAdd(false);
  };

  const removeExtra=id=>fbSet(`${fbExt}/${id}`,null);

  // Combine base entries (from event) + dynamically added extras (from Firebase)
  const allEntries=[...entries,...Object.values(extras)];
  const filtered=allEntries.filter(g=>g.name.toLowerCase().includes(search.toLowerCase()));
  const arrived=allEntries.filter(g=>checkins[g.id]).length;
  const total=allEntries.length;
  const totalPax=allEntries.reduce((s,g)=>s+(1+(g.plus||0)),0);
  const arrivedPax=allEntries.filter(g=>checkins[g.id]).reduce((s,g)=>s+(1+(g.plus||0)),0);

  return (
    <div>
      {/* Stats bar */}
      <div className="flex gap-3 mb-3">
        <div className="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2.5 text-center">
          <div className="text-lg font-black text-emerald-400">{arrived}<span className="text-zinc-600 text-sm font-normal">/{total}</span></div>
          <div className="text-[10px] text-zinc-500">Namen</div>
        </div>
        <div className="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2.5 text-center">
          <div className="text-lg font-black text-amber-400">{arrivedPax}<span className="text-zinc-600 text-sm font-normal">/{totalPax}</span></div>
          <div className="text-[10px] text-zinc-500">Personen</div>
        </div>
      </div>

      {/* Search + Add */}
      <div className="flex gap-2 mb-3">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Name suchen…"
          className="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2.5 text-zinc-100 text-sm placeholder-zinc-600"/>
        {canEdit&&<button onClick={()=>setShowAdd(true)} className="bg-amber-500 text-black font-bold text-sm px-4 rounded-xl active:scale-95">+</button>}
      </div>

      {/* Add modal */}
      {showAdd&&(
        <div className="fixed inset-0 bg-black/70 z-50 flex items-end" onClick={()=>setShowAdd(false)}>
          <div className="w-full bg-zinc-900 rounded-t-3xl p-5 safe-bottom slide-up" onClick={e=>e.stopPropagation()}>
            <div className="w-10 h-1 bg-zinc-700 rounded-full mx-auto mb-4"/>
            <div className="text-lg font-bold text-white mb-4">Eintrag hinzufügen</div>
            <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Name"
              className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-zinc-100 text-sm placeholder-zinc-600 mb-3"/>
            <div className="flex gap-2 mb-3">
              <div className="flex-1">
                <div className="text-xs text-zinc-500 mb-1.5">+1 / +2 …</div>
                <input value={newPlus} onChange={e=>setNewPlus(e.target.value)} type="number" min="0" max="5"
                  className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-zinc-100 text-sm"/>
              </div>
              {listType==='guestlist'&&(
                <div className="flex-1">
                  <div className="text-xs text-zinc-500 mb-1.5">Kategorie</div>
                  <select value={newCat} onChange={e=>setNewCat(e.target.value)} className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-3 text-zinc-100 text-sm">
                    {GUEST_CATEGORIES.map(c=><option key={c}>{c}</option>)}
                  </select>
                </div>
              )}
            </div>
            <input value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Notiz (optional)"
              className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-zinc-100 text-sm placeholder-zinc-600 mb-4"/>
            <div className="flex gap-3">
              <button onClick={()=>setShowAdd(false)} className="flex-1 border border-zinc-700 text-zinc-400 font-semibold py-3 rounded-2xl text-sm">Abbrechen</button>
              <button onClick={addEntry} className="flex-1 bg-amber-500 text-black font-bold py-3 rounded-2xl text-sm">Hinzufügen</button>
            </div>
          </div>
        </div>
      )}

      {/* List */}
      <div className="space-y-2">
        {filtered.length===0&&<div className="text-center text-zinc-600 py-8 text-sm">Keine Einträge</div>}
        {filtered.map(g=>{
          const in_=checkins[g.id];
          const isExtra=!!extras[g.id];
          return (
            <div key={g.id} className={`flex items-center gap-2 rounded-2xl border transition-all ${in_?'bg-emerald-500/10 border-emerald-500/30':'bg-zinc-900 border-zinc-800'}`}>
              <button onClick={()=>toggle(g.id)} className="flex items-center gap-3 flex-1 px-4 py-3.5 text-left active:scale-[.99]">
                <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 text-lg ${in_?'bg-emerald-500/20':'bg-zinc-800'}`}>
                  {in_?'✓':'○'}
                </div>
                <div className="flex-1 min-w-0">
                  <div className={`text-sm font-semibold ${in_?'text-emerald-300 line-through decoration-emerald-500/50':'text-zinc-100'}`}>{g.name}</div>
                  <div className="flex items-center gap-2 mt-0.5">
                    {g.plus>0&&<span className="text-xs text-zinc-500">+{g.plus}</span>}
                    {g.category&&<span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded-full border ${CAT_STYLE[g.category]||'text-zinc-400 bg-zinc-800 border-zinc-700'}`}>{g.category}</span>}
                    {g.note&&<span className="text-xs text-zinc-600 truncate">{g.note}</span>}
                  </div>
                </div>
                {in_&&<span className="text-[10px] text-emerald-400 font-semibold flex-shrink-0">Einlass</span>}
              </button>
              {canEdit&&isExtra&&<button onClick={()=>removeExtra(g.id)} className="text-red-500/60 text-sm px-3 py-3 active:text-red-400 flex-shrink-0">🗑</button>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ArtistPickupCard({pickup,eventId,currentUser}){
  const {status,msgs,base}=usePickupData(eventId,pickup.id);
  const phase=status?.phase;
  const [text,setText]=useState('');
  const [drafting,setDrafting]=useState(false);
  const t=useT();
  const phaseStyle={
    accepted:{border:'border-emerald-500/30',label:t('pickup_driver_enroute'),color:'text-emerald-400'},
    delayed:{border:'border-amber-500/30',label:t('pickup_delay'),color:'text-amber-400'},
    done:{border:'border-zinc-700',label:t('pickup_finished'),color:'text-zinc-400'},
  };
  const ps=phase?phaseStyle[phase]:null;
  const send=()=>{
    if(!text.trim()) return;
    fbPush(`${base}/msgs`,{text:text.trim(),sentBy:currentUser?.name||'Artist',sentByRole:'artist',sentAt:Date.now()});
    setText('');setDrafting(false);
  };
  return (
    <div className={`bg-zinc-900 border ${ps?.border||'border-zinc-800'} rounded-2xl p-5`}>
      <div className="text-xs text-zinc-500 mb-1">{t('pickup_label')}</div>
      <div className={`text-2xl font-black mono ${phase?ps.color:'text-emerald-400'}`}>{pickup.time}</div>
      <div className="text-sm text-zinc-300 mt-1">{pickup.from} → {pickup.to}</div>
      {pickup.fromAddr&&<a href={mapsUrl(pickup.fromAddr)} target="_blank" className="text-xs text-blue-400 block mt-1">📍 {pickup.fromAddr} ↗</a>}
      {ps&&<div className={`mt-2 text-xs font-bold ${ps.color}`}>{ps.label}</div>}
      {msgs.length>0&&(
        <div className="mt-3 space-y-1.5">
          <div className="text-[10px] text-zinc-600 uppercase tracking-wider">{t('pickup_messages')}</div>
          {msgs.map(m=>(
            <div key={m.id} className={`rounded-xl px-3 py-2 ${m.sentByRole==='fahrer'?'bg-blue-500/8 border border-blue-500/15':'bg-amber-500/8 border border-amber-500/15'}`}>
              <div className={`text-[10px] font-bold mb-0.5 ${m.sentByRole==='fahrer'?'text-blue-400':'text-amber-400'}`}>{m.sentBy}</div>
              <div className="text-sm leading-relaxed text-zinc-200">{m.text}</div>
              <div className="text-[10px] text-zinc-600 mt-0.5">{m.sentAt?new Date(m.sentAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''}</div>
            </div>
          ))}
        </div>
      )}
      {phase&&phase!=='done'&&currentUser&&(
        <div className="mt-3">
          {drafting?(
            <div className="flex gap-2">
              <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
                placeholder={t('pickup_msg_artist')}
                className="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-zinc-100 placeholder-zinc-600 outline-none focus:border-amber-500/50"/>
              <button onClick={send} className="bg-amber-500 text-black text-xs font-bold px-3 py-2 rounded-xl active:scale-95">→</button>
              <button onClick={()=>{setDrafting(false);setText('');}} className="text-zinc-500 text-xs px-2">✕</button>
            </div>
          ):(
            <button onClick={()=>setDrafting(true)} className="text-xs text-amber-400/70 border border-amber-500/20 px-3 py-1.5 rounded-xl active:bg-amber-500/10">{t('pickup_send_msg')}</button>
          )}
        </div>
      )}
    </div>
  );
}

          <span className={`inline-block text-xs px-2.5 py-1 rounded-lg border mt-2 ${getFC(artist.stage)}`}>{artist.stage}</span>

function ChangeReqModal({artist,event,currentUser,onClose}) {
  const [field,setField]=useState('Pickup-Zeit');
  const [newVal,setNewVal]=useState('');
  const [reason,setReason]=useState('');
  const [sent,setSent]=useState(false);
  const fields=['Pickup-Zeit','Rider','Technik','Hotel','Sonstiges'];
  const submit=()=>{
    if(!newVal.trim()) return;
    const p=(event.pickups||[]).find(px=>px.artist===artist.name);
    fbPush(`backstage/changeRequests/${event.id}`,{
      artistName:artist.name,field,requestedVal:newVal,currentVal:field==='Pickup-Zeit'?(p?.time||'–'):'–',
      reason,requestedBy:currentUser.name,timestamp:Date.now(),status:'pending',eventId:event.id,eventName:event.name
    });
    setSent(true);
  };
  return (
    <div className="fixed inset-0 bg-black/70 z-50 flex items-end" onClick={onClose}>
      <div className="w-full bg-zinc-900 rounded-t-3xl p-6 safe-bottom slide-up" onClick={e=>e.stopPropagation()}>
        <div className="w-10 h-1 bg-zinc-700 rounded-full mx-auto mb-5"/>
        {sent?(
          <div className="text-center py-4">
            <div className="text-3xl mb-3">📨</div>
            <div className="text-lg font-bold text-white">Anfrage gesendet</div>
            <Btn onClick={onClose} className="mt-6 px-10">OK</Btn>
          </div>
        ):(
          <>
            <div className="text-xl font-bold text-white mb-4">Änderung beantragen</div>
            <div className="mb-4">
              <div className="text-xs text-zinc-500 mb-2">Was ändern?</div>
              <div className="flex gap-2 overflow-x-auto pb-1">
                {fields.map(f=><button key={f} onClick={()=>setField(f)} className={`flex-shrink-0 px-3 py-2 rounded-xl border text-xs font-semibold ${field===f?'bg-amber-500/10 border-amber-500/40 text-amber-400':'bg-zinc-800 border-zinc-700 text-zinc-400'}`}>{f}</button>)}
              </div>
            </div>
            <div className="mb-3"><div className="text-xs text-zinc-500 mb-1.5">Neuer Wert</div><input value={newVal} onChange={e=>setNewVal(e.target.value)} className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-zinc-100 text-sm placeholder-zinc-600" placeholder="z.B. 19:00 Uhr"/></div>
            <div className="mb-5"><div className="text-xs text-zinc-500 mb-1.5">Begründung (optional)</div><textarea value={reason} onChange={e=>setReason(e.target.value)} rows={2} className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-zinc-100 text-sm resize-none placeholder-zinc-600" placeholder="…"/></div>
            <div className="flex gap-3">
              <button onClick={onClose} className="flex-1 border border-zinc-700 text-zinc-400 font-semibold py-3.5 rounded-2xl text-sm">Abbrechen</button>
              <Btn onClick={submit} className="flex-1">Senden</Btn>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// Sekundäre Firebase-App: Nutzer anlegen ohne Admin auszuloggen
const getSecondaryAuth=()=>{
  try{return firebase.app('bs_secondary').auth();}
  catch{return firebase.initializeApp(firebase.app().options,'bs_secondary').auth();}
};

function AccountsView({events=EVENTS,currentUser}) {
  const [users,setUsers]=useState([]);
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({name:'',role:'crew',email:'',password:'',artistName:'',artistEventId:''});
  const [msg,setMsg]=useState('');
  const [saving,setSaving]=useState(false);
  const AUTH_ERRORS={'auth/email-already-in-use':'Diese Email ist bereits vergeben.','auth/invalid-email':'Ungültige Email.','auth/weak-password':'Passwort min. 6 Zeichen.'};

  useEffect(()=>fbOn('backstage/appUsers',data=>{
    if(data) setUsers(Object.entries(data).map(([id,u])=>({...u,id})));
    else setUsers([]);
  }),[]);

  const openNew=()=>{setForm({name:'',role:'crew',email:'',password:'',artistName:'',artistEventId:''});setMsg('');setModal({mode:'new'});};
  const openEdit=u=>{setForm({name:u.name,role:u.role,email:u.email||'',password:'',artistName:u.artistName||'',artistEventId:u.artistEventId||''});setMsg('');setModal({mode:'edit',user:u});};

  const save=async()=>{
    if(!form.name.trim()){setMsg('Name eingeben.');return;}
    setSaving(true);setMsg('');
    try{
      if(modal.mode==='new'){
        if(!form.email||!form.password||form.password.length<6){setMsg('Email + Passwort (min. 6 Zeichen) nötig.');setSaving(false);return;}
        const secAuth=getSecondaryAuth();
        const cred=await secAuth.createUserWithEmailAndPassword(form.email.trim(),form.password);
        const uid=cred.user.uid;
        await secAuth.signOut();
        const extra=form.role==='artist'?{artistName:form.artistName||form.name,artistEventId:form.artistEventId||''}:{};
        await fbSet(`backstage/appUsers/${uid}`,{uid,name:form.name.trim(),email:form.email.trim(),role:form.role,createdAt:Date.now(),...extra});
      } else {
        const extra=form.role==='artist'?{artistName:form.artistName||form.name,artistEventId:form.artistEventId||''}:{};
        await fbSet(`backstage/appUsers/${modal.user.id}`,{...modal.user,name:form.name.trim(),role:form.role,...extra});
      }
      setModal(null);
    }catch(e){setMsg(AUTH_ERRORS[e.code]||e.message||'Fehler beim Speichern.');}
    finally{setSaving(false);}
  };

  const deleteUser=u=>{
    if(u.role==='superadmin'){setMsg('Superadmin kann nicht gelöscht werden.');return;}
    fbSet(`backstage/appUsers/${u.id}`,null);
  };

  const byRole={};
  users.forEach(u=>(byRole[u.role]=byRole[u.role]||[]).push(u));

  return (
    <div className="px-4 pb-6 fade-in">
      <div className="flex items-center justify-between pt-2 mb-5">
        <div className="text-2xl font-bold text-white">Accounts</div>
        <button onClick={openNew} className="bg-amber-500 text-black font-bold text-sm px-4 py-2 rounded-xl active:scale-95">+ Neu</button>
      </div>
      {ROLES.map(role=>{
        const ru=byRole[role]||[]; if(!ru.length) return null;
        return (
          <div key={role} className="mb-4">
            <div className={`text-xs font-semibold uppercase tracking-widest mb-2 ${ROLE_COLOR[role].split(' ')[0]}`}>{ROLE_LABEL[role]}</div>
            <div className="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
              {ru.map((u,i)=>(
                <div key={u.id} className={`flex items-center gap-3 px-4 py-3.5 ${i<ru.length-1?'border-b border-zinc-800':''}`}>
                  <Avatar name={u.name} role={u.role}/>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold text-zinc-100">{u.name}</div>
                    <div className="text-xs text-zinc-600 mono">{u.email||'—'}</div>
                  </div>
                  <button onClick={()=>openEdit(u)} className="text-xs text-amber-400 font-semibold px-2 py-1 active:opacity-60">Bearbeiten</button>
                </div>
              ))}
            </div>
          </div>
        );
      })}

      {modal&&(
        <div className="fixed inset-0 bg-black/70 z-50 flex items-end" onClick={()=>setModal(null)}>
          <div className="w-full bg-zinc-900 rounded-t-3xl p-6 safe-bottom slide-up max-h-[90vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
            <div className="w-10 h-1 bg-zinc-700 rounded-full mx-auto mb-5"/>
            <div className="text-xl font-bold text-white mb-5">{modal.mode==='new'?'Neuer Account':'Account bearbeiten'}</div>
            {[['Name','name','text','Max Mustermann']].map(([l,k,t,p])=>(
              <div key={k} className="mb-3">

              <span className="text-lg mt-0.5">{icons[n.type]||'🔔'}</span>

function HomeAbendleitung({onOpenEvent,events,currentUser}) {
  const t=useT();
  const now=useClock();
  const active=events.find(e=>e.status==='active')||events[0];
  const [pickupStatuses,setPickupStatuses]=useState({});
  const [artistStatuses,setArtistStatuses]=useState({});
  useEffect(()=>{
    if(!active?.id) return;
    const u1=fbOn(`backstage/pickupStatus/${active.id}`,d=>setPickupStatuses(d||{}));
    const u2=fbOn(`backstage/artistStatus/${active.id}`,d=>setArtistStatuses(d||{}));
    return()=>{u1();u2();};
  },[active?.id]);

  const artists=active?.artists||[];
  const pickups=active?.pickups||[];
  const nowMins=(now.getHours()<12?now.getHours()+24:now.getHours())*60+now.getMinutes();
  const floors=active?.floors||[...new Set(artists.map(a=>a.stage).filter(Boolean))];

  // Per-floor: who's on now, who's next
  const floorStatus=floors.map(floor=>{
    const fa=[...artists.filter(a=>a.stage===floor)].sort((a,b)=>toMinsSet((a.time||'').split('–')[0])-toMinsSet((b.time||'').split('–')[0]));
    const current=fa.find(a=>{const[s,e]=(a.time||'–').split('–');return nowMins>=toMinsSet(s)&&nowMins<toMinsSet(e);});
    const next=fa.find(a=>toMinsSet((a.time||'').split('–')[0])>nowMins);
    return{floor,current,next};
  });

  const pending=pickups.filter(p=>!p.done&&pickupStatuses[p.id]?.status!=='accepted');
  const accepted=pickups.filter(p=>!p.done&&pickupStatuses[p.id]?.status==='accepted');
  const missingArtists=artists.filter(a=>!artistStatuses[artKey(a.name)]?.im_club);
  const allHere=missingArtists.length===0&&artists.length>0;

  return (
    <div className="pb-6 fade-in">
      {/* Command bar */}
      <div className="px-4 pt-3 pb-4 border-b border-zinc-800/50 flex items-center justify-between">
        <div>
          <div className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Abendleitung · {active?.name}</div>
          <div className="text-sm text-zinc-400 mt-0.5">{active?.subtitle}</div>
        </div>
        <div className="text-right">
          <div className="text-3xl font-black text-amber-400 mono tabular-nums leading-none">{now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div>
          <div className="text-[10px] text-zinc-600 mt-0.5">{now.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}</div>
        </div>
      </div>

      {/* Floors — now on stage */}
      <div className="px-4 mt-4 space-y-2">
        <div className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2">{t('stage')}</div>
        {floorStatus.map(({floor,current,next})=>{
          const acc=FLOOR_ACCENT[floor]||{text:'text-zinc-400',bg:'bg-zinc-600',border:'border-zinc-700'};
          return(
            <div key={floor} className={`rounded-2xl p-3.5 border ${current?'bg-zinc-900 border-zinc-700':'bg-zinc-900/30 border-zinc-800/50'}`}>
              <div className={`text-[10px] font-bold uppercase tracking-widest mb-1.5 ${acc.text}`}>{floor}</div>
              {current
                ?<div className="flex items-start justify-between gap-2">
                    <div>
                      <div className="text-sm font-bold text-white flex items-center gap-1.5">
                        <span className={`w-1.5 h-1.5 rounded-full ${acc.bg} inline-block flex-shrink-0`} style={{animation:'livepulse 1.4s ease infinite'}}/>
                        {current.name}
                      </div>
                      <div className={`text-xs mono mt-0.5 ${acc.text} opacity-70`}>{current.time}</div>
                    </div>
                    {next&&<div className="text-right text-[11px] text-zinc-500 flex-shrink-0">weiter<br/><span className="text-zinc-300 font-semibold">{next.name}</span><br/><span className={`mono ${acc.text} opacity-70`}>{(next.time||'').split('–')[0]}</span></div>}
                  </div>
                :<div className="text-xs text-zinc-600">{next?<>{t('next_up')}: <span className="text-zinc-400 font-semibold">{next.name}</span> <span className={`mono font-bold ml-1 ${acc.text}`}>{(next.time||'').split('–')[0]}</span></>:t('no_act')}</div>
              }
            </div>
          );
        })}
      </div>

      {/* Fahrer Live-Standort */}
      {active&&accepted.length>0&&(
        <div className="px-4 mt-4">
          <div className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2">{t('driver_location')}</div>
          <div className="rounded-2xl overflow-hidden border border-zinc-800" style={{height:180}}>
            <LiveMap event={active} currentUser={currentUser} compact viewOnly/>
          </div>
        </div>
      )}

      {/* Pickup alerts */}
      {(pending.length>0||accepted.length>0)&&(
        <div className="px-4 mt-4 space-y-2">
          <div className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">{t('pickups')}</div>
          {pending.map(p=>(
            <div key={p.id} className="bg-amber-500/5 border border-amber-500/25 rounded-2xl p-3.5 flex items-center gap-3">
              <div className="text-sm font-black text-amber-400 mono w-12 flex-shrink-0">{p.time}</div>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-semibold text-zinc-100">{p.artist}</div>
                <div className="text-xs text-zinc-500 truncate">{p.from} → {p.to}</div>
              </div>
              <span className="text-[10px] text-amber-400/70 font-semibold flex-shrink-0">{t('pickup_no_driver')}</span>
            </div>
          ))}
          {accepted.map(p=>(
            <div key={p.id} className="bg-emerald-500/5 border border-emerald-500/25 rounded-2xl p-3.5 flex items-center gap-3">
              <div className="text-sm font-black text-emerald-400 mono w-12 flex-shrink-0">{p.time}</div>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-semibold text-zinc-100">{p.artist}</div>
                <div className="text-xs text-zinc-400">{pickupStatuses[p.id]?.acceptedBy} {t('pickup_enroute')}</div>
              </div>
              <span className="text-emerald-400 text-base">✓</span>
            </div>
          ))}
        </div>
      )}

      {/* Who's still missing */}
      {!allHere&&artists.length>0&&(
        <div className="px-4 mt-4">
          <div className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2">{t('not_in_club')}</div>
          <div className="flex flex-wrap gap-1.5">
            {missingArtists.map(a=>(
              <span key={a.name} className="bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1 text-xs font-medium text-zinc-400">{a.name}</span>
            ))}
          </div>
        </div>
      )}
      {allHere&&<div className="px-4 mt-4 flex items-center gap-2 text-emerald-400 text-sm font-semibold"><span className="ldot"/>{t('all_in_club')}</div>}

      {/* Artist status cards (scrollable) */}
      <div className="px-4 mt-5">
        <div className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-3">{t('artist_status')}</div>
        {floors.map(floor=>{
          const fa=artists.filter(a=>a.stage===floor); if(!fa.length) return null;
          return <div key={floor} className="mb-3">
            <div className={`text-[10px] font-bold uppercase tracking-widest mb-2 ${getFC(floor).split(' ')[0]}`}>{floor}</div>
            {fa.map(a=><ArtistStatusCard key={a.name} artist={a} eventId={active?.id} editable={true} startDate={active?.startDate}/>)}
          </div>;
        })}
      </div>
      <div className="px-4 mt-2">
        <button onClick={()=>onOpenEvent(active?.id)} className="w-full bg-zinc-900 border border-zinc-800 text-zinc-400 font-semibold py-3 rounded-2xl text-sm active:scale-[.98]">Alle Event-Details →</button>
      </div>
    </div>
  );
}

function HomeFahrer({currentUser,onOpenEvent,events}) {
  const t=useT();
  const active=events.find(e=>e.status==='active')||events[0];
  const pickups=active?.pickups||[];
  const [statuses,setStatuses]=useState({});
  useEffect(()=>{
    if(!active?.id) return;
    return fbOn(`backstage/pickupStatus/${active.id}`,data=>setStatuses(data||{}));
  },[active?.id]);

  const open=pickups.filter(p=>!p.done&&statuses[p.id]?.status!=='accepted');
  const accepted=pickups.filter(p=>!p.done&&statuses[p.id]?.status==='accepted');
  const done=pickups.filter(p=>p.done);

  return (
    <div className="px-4 pb-6 fade-in">
      <div className="pt-2 mb-4">
        <div className="text-xs text-zinc-500 uppercase tracking-widest mb-1">Fahrer</div>
        <div className="text-2xl font-bold text-white">{active?.name||'–'}</div>
      </div>
      {active&&<div className="rounded-2xl overflow-hidden mb-4 border border-zinc-800" style={{height:190}}><LiveMap event={active} currentUser={currentUser} compact/></div>}

      {/* Pending pickups — needs action */}
      {open.length>0&&(
        <>
          <div className="text-xs font-semibold text-amber-400 uppercase tracking-widest mb-2">{t('pickup_pending')}</div>
          {open.map((p,i)=>(
            <div key={i} className="bg-zinc-900 border border-amber-500/20 rounded-2xl px-4 py-3.5 mb-2">
              <div className="flex items-center gap-3">

function MainApp({currentUser,lang,setLang,onLogout,events}) {
  const [tab,setTab]=useState('home');
  const [screen,setScreen]=useState(null);
  const [notifs,setNotifs]=useState([]);
  // Load Firebase change requests as live notifications
  useEffect(()=>{
    if(!events.length) return;
    const unsubs=events.map(ev=>fbOn(`backstage/changeRequests/${ev.id}`,data=>{
      setNotifs(prev=>{
        const filtered=prev.filter(n=>!(n.eventId===ev.id&&n.type==='change_request'));
        if(!data) return filtered;
        const reqs=Object.entries(data)
          .filter(([,r])=>r.status==='pending')
          .map(([id,r])=>({
            id,type:'change_request',
            eventId:ev.id,event:ev.name,
            text:`${r.artistName}: ${r.field} → ${r.requestedVal}`,
            time:r.timestamp?new Date(r.timestamp).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'',
            timestamp:r.timestamp||0,
            read:false,urgent:true,tab:'pickups',
            targetRoles:['superadmin','admin','abendleitung','fahrer'], // fahrer sees pickup change requests
            reqData:{...r,eventId:ev.id,eventName:ev.name}
          }));
        return [...filtered,...reqs].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
      });
    }));
    return()=>unsubs.forEach(u=>u());
  },[events.map(e=>e.id).join(',')]);
  const [demoUser,setDemoUser]=useState(null);
  const [approvalNotif,setApprovalNotif]=useState(null);
  const [showNewEvent,setShowNewEvent]=useState(false);

  // effectiveUser = demo user when in preview mode, otherwise real user
  const effectiveUser=demoUser||currentUser;
  const role=effectiveUser.role;
  const canEditEvents=['superadmin','admin','abendleitung'].includes(role);
  // Filter notifications by role — artists/kasse/techniker shouldn't see management alerts
  // Notifications always based on REAL user role, not demo persona
  const visibleNotifs=useMemo(()=>notifs.filter(n=>!n.targetRoles||n.targetRoles.includes(currentUser.role)),[notifs,currentUser.role]);
  const unread=visibleNotifs.filter(n=>!n.read).length;

  const openNotif=useCallback(n=>{
    setNotifs(prev=>prev.map(x=>x.id===n.id?{...x,read:true}:x));
    if(n.type==='change_request'){setApprovalNotif(n);}
    else{
      if(n.eventId) setScreen({type:'event',eventId:n.eventId,initialTab:n.tab||'overview'});
    }
  },[]);

  const openEvent=useCallback((id,initialTab='overview')=>{
    setScreen({type:'event',eventId:id,initialTab});
  },[]);

  // Event visibility: superadmin + admin see all; everyone else only their assigned event
  const artistEvents=useMemo(()=>{
    if(role==='superadmin'||role==='admin') return events;
    if(effectiveUser.artistEventId) return events.filter(e=>e.id===effectiveUser.artistEventId);
    return role==='artist'?[]:events;
  },[events,role,effectiveUser.artistEventId]);

  useEffect(()=>{
    if(['artist','fahrer','kasse','techniker','abendleitung'].includes(role)&&effectiveUser.artistEventId&&events.length&&!screen){
      openEvent(effectiveUser.artistEventId,'overview');
    }
  },[role,effectiveUser.artistEventId,events.length]);

  const openArtistView=useCallback((event,artistName)=>setScreen({type:'artist',eventId:event.id,artistName}),[]);

  // Total chat unread badge (group + DMs across active event)
  const activeEventId=(events.find(e=>e.status==='active')||events[0])?.id;
  const [chatUnread,setChatUnread]=useState(0);
  useEffect(()=>{
    if(!activeEventId||!currentUser?.id) return;
    let g=0,d=0,dead=false;
    const u1=fbOn(`backstage/groupChat/${activeEventId}/unread/${currentUser.id}`,v=>{g=v||0;if(!dead)setChatUnread(g+d);});
    const u2=fbOn('backstage/dms',data=>{
      d=0;if(data) Object.entries(data).filter(([id])=>id.split('_').includes(currentUser.id)).forEach(([,c])=>{d+=(c.unread?.[currentUser.id]||0);});
      if(!dead)setChatUnread(g+d);
    });
    return ()=>{dead=true;u1();u2();};
  },[activeEventId,currentUser?.id]);

  const t=useT();
  const NAV_DEFS={
    superadmin:[{id:'home',icon:'⌂',label:t('home')},{id:'events',icon:'📅',label:t('events')},{id:'chat',icon:'💬',label:t('chat'),badge:chatUnread},{id:'accounts',icon:'👥',label:t('accounts')},{id:'profile',icon:'👤',label:t('profile')}],
    admin:[{id:'home',icon:'⌂',label:t('home')},{id:'events',icon:'📅',label:t('events')},{id:'chat',icon:'💬',label:t('chat'),badge:chatUnread},{id:'team',icon:'👥',label:'Team'},{id:'profile',icon:'👤',label:t('profile')}],
    abendleitung:[{id:'home',icon:'⌂',label:t('home')},{id:'events',icon:'📅',label:t('events')},{id:'chat',icon:'💬',label:t('chat'),badge:chatUnread},{id:'inbox',icon:'🔔',label:t('inbox'),badge:unread},{id:'profile',icon:'👤',label:t('profile')}],
    artist:[{id:'home',icon:'🎧',label:t('my_set')},{id:'chat',icon:'💬',label:t('chat'),badge:chatUnread},{id:'inbox',icon:'🔔',label:t('inbox'),badge:unread},{id:'profile',icon:'👤',label:t('profile')}],
    fahrer:[{id:'home',icon:'⌂',label:t('home')},{id:'events',icon:'📅',label:t('events')},{id:'chat',icon:'💬',label:t('chat'),badge:chatUnread},{id:'map',icon:'📍',label:t('map')},{id:'profile',icon:'👤',label:t('profile')}],
    kasse:[{id:'home',icon:'🎟',label:t('entry')},{id:'chat',icon:'💬',label:t('chat'),badge:chatUnread},{id:'inbox',icon:'🔔',label:t('inbox'),badge:unread},{id:'profile',icon:'👤',label:t('profile')}],
    techniker:[{id:'home',icon:'🔧',label:t('tech')},{id:'chat',icon:'💬',label:t('chat'),badge:chatUnread},{id:'inbox',icon:'🔔',label:t('inbox'),badge:unread},{id:'profile',icon:'👤',label:t('profile')}],
  };
  const navItems=NAV_DEFS[role]||NAV_DEFS.admin;

  // Live event lookups from prop (always fresh from Firebase)
  if(screen?.type==='event'){
    const ev=events.find(e=>e.id===screen.eventId);
    if(!ev) return null;
    return <EventDetail event={ev} initialTab={screen.initialTab} onBack={()=>setScreen(null)} currentUser={{...effectiveUser,role}} onSaveEvent={saveEvent} onDeleteEvent={deleteEvent}/>;
  }
  if(screen?.type==='artist'){
    const ev=events.find(e=>e.id===screen.eventId);
    return <ArtistSelfView event={ev} artistName={screen.artistName} currentUser={currentUser} onBack={()=>setScreen(null)}/>;
  }

  const active=events.find(e=>e.status==='active')||events[0];

  return (
    <div className="min-h-screen bg-zinc-950 flex flex-col max-w-lg mx-auto">
      <div className="safe-top flex-shrink-0"/>
      {currentUser.role==='superadmin'&&demoUser&&(
        <div className="mx-4 mt-3 mb-1 bg-amber-500/10 border border-amber-500/30 rounded-xl px-3 py-2 flex items-center justify-between">
          <span className="text-xs text-amber-400">🎭 {t('demo_banner')} <strong>{demoUser.name}</strong> · {t('role_'+demoUser.role)||ROLE_LABEL[demoUser.role]}</span>
          <button onClick={()=>{setDemoUser(null);setTab('home');}} className="text-xs text-amber-400 font-semibold">{t('demo_exit')}</button>
        </div>
      )}

      <div className="flex-1 overflow-y-auto">
        {tab==='home'&&(role==='superadmin'||role==='admin')&&<HomeAdmin notifs={visibleNotifs} onOpenNotif={openNotif} onOpenEvent={openEvent} currentUser={effectiveUser} events={events}/>}
        {tab==='home'&&role==='abendleitung'&&<HomeAbendleitung onOpenEvent={openEvent} events={events} currentUser={effectiveUser}/>}
        {tab==='home'&&role==='fahrer'&&<HomeFahrer currentUser={effectiveUser} onOpenEvent={openEvent} events={events}/>}
        {tab==='home'&&role==='kasse'&&<HomeKasse onOpenEvent={openEvent} events={events}/>}
        {tab==='home'&&role==='techniker'&&<HomeTechniker onOpenEvent={openEvent} events={events}/>}
        {tab==='home'&&role==='artist'&&<HomeArtist currentUser={effectiveUser} onOpenArtistView={openArtistView} events={events}/>}
        {tab==='events'&&<EventsView events={artistEvents} onOpen={openEvent} canEdit={canEditEvents} onNew={()=>setShowNewEvent(true)}/>}
        {tab==='chat'&&<ChatTerminal events={artistEvents} currentUser={{...effectiveUser,id:currentUser.id}}/>}
        {tab==='inbox'&&<InboxView notifs={visibleNotifs} onMarkAllRead={()=>setNotifs(n=>n.map(x=>({...x,read:true})))} onOpen={openNotif}/>}
        {tab==='accounts'&&<AccountsView events={events} currentUser={currentUser}/>}
        {tab==='team'&&<AccountsView events={events} currentUser={currentUser}/>}
        {tab==='map'&&active&&<div style={{height:'calc(100vh - 120px)'}}><LiveMap event={active} currentUser={effectiveUser}/></div>}
        {tab==='profile'&&<ProfileView currentUser={currentUser} lang={lang} setLang={setLang} demoUser={demoUser} setDemoUser={u=>{setDemoUser(u);if(u)setTab('home');}} onLogout={onLogout}/>}
      </div>

      <div className="flex-shrink-0 bg-zinc-950/95 border-t border-zinc-800 backdrop-blur-sm safe-bottom">
        <div className="flex">
          {navItems.map(item=>(
            <button key={item.id} onClick={()=>setTab(item.id)}
              className={`flex-1 flex flex-col items-center py-2.5 gap-0.5 relative active:opacity-70 transition-all select-none ${tab===item.id?'text-amber-400':'text-zinc-600'}`}>
              <span className="text-xl leading-none">{item.icon}</span>
              <span className="text-[9px] font-semibold">{item.label}</span>
              {item.badge>0&&<span className="absolute top-1.5 right-[calc(50%-10px)] w-4 h-4 bg-red-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center">{item.badge}</span>}
            </button>
          ))}
        </div>
      </div>
      {approvalNotif&&<ChangeApprovalModal notif={approvalNotif} onClose={()=>setApprovalNotif(null)} onDecision={(id)=>{setNotifs(p=>p.map(n=>n.id===id?{...n,read:true,resolved:true}:n));setTimeout(()=>setApprovalNotif(null),2000);}}/>}
      {showNewEvent&&<NewEventModal onClose={()=>setShowNewEvent(false)} onCreated={id=>{setShowNewEvent(false);setTimeout(()=>{setTab('events');openEvent(id);},300);}}/>}
    </div>
  );
}

/* ════════════════════════════════════════
   ROOT
════════════════════════════════════════ */
function Root() {
  const [user,setUser]=useState(undefined); // undefined=laden
  const [lang,setLang]=useState(()=>localStorage.getItem('bs_lang')||'de');
  const events=useFirebaseEvents();
  const changeLang=l=>{setLang(l);localStorage.setItem('bs_lang',l);};

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async fbUser=>{
      if(fbUser){
        const profile=await fbOnce(`backstage/appUsers/${fbUser.uid}`).catch(()=>null);
        if(profile){
          setUser({...profile,id:fbUser.uid,email:fbUser.email});
        } else {
          // Kein Profil unter UID — alle User laden und nach Email suchen (Migrations-Fallback)
          const allUsers=await fbOnce('backstage/appUsers').catch(()=>null);
          const entries=allUsers?Object.entries(allUsers):[];
          const byEmail=entries.find(([,u])=>u.email===fbUser.email||u.email===fbUser.email.toLowerCase());
          if(byEmail){
            // Alten Eintrag unter neuer UID speichern und alten löschen
            const[oldId,oldProfile]=byEmail;
            const migrated={...oldProfile,uid:fbUser.uid,email:fbUser.email};
            await fbSet(`backstage/appUsers/${fbUser.uid}`,migrated).catch(()=>{});
            if(oldId!==fbUser.uid) await fbSet(`backstage/appUsers/${oldId}`,null).catch(()=>{});
            setUser({...migrated,id:fbUser.uid});
          } else if(entries.length===0||entries.every(([,u])=>!u.uid)){
            // Leer oder nur alte Einträge ohne uid-Feld → Superadmin anlegen
            const name=fbUser.displayName||fbUser.email.split('@')[0];
            const newProfile={uid:fbUser.uid,name,email:fbUser.email,role:'superadmin',createdAt:Date.now()};
            await fbSet(`backstage/appUsers/${fbUser.uid}`,newProfile).catch(()=>{});
            setUser({...newProfile,id:fbUser.uid});
          } else {
            // Kein passender Account gefunden
            await auth.signOut();
            setUser(null);
            alert('Kein App-Account für diese Email gefunden. Bitte wende dich an den Administrator.');
          }
        }
      } else {
        setUser(null);
      }
    });
    return unsub;
  },[]);

  const logout=()=>auth.signOut();

  if(user===undefined) return (
    <div className="min-h-screen bg-zinc-950 flex flex-col items-center justify-center gap-4">
      <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center shadow-lg shadow-amber-500/20">
        <span className="text-2xl">🎛️</span>
      </div>
      <div className="text-zinc-600 text-xs">Laden…</div>
    </div>
  );

  return (
    <LangCtx.Provider value={lang}>
      {user
        ?<MainApp currentUser={user} lang={lang} setLang={changeLang} onLogout={logout} events={events}/>
        :<LoginScreen lang={lang} setLang={changeLang}/>}
    </LangCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
