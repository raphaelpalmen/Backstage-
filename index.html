/* ── FIREBASE-BACKED EVENTS HOOK ── */
function useFirebaseEvents(){
  const[fbEvMap,setFbEvMap]=useState({});
  useEffect(()=>fbOn('backstage/events',d=>setFbEvMap(d||{})),[]);
  return useMemo(()=>{
    const result=EVENTS
      .filter(e=>!fbEvMap[e.id]?._deleted)
      .map(e=>{const ov=fbEvMap[e.id];return ov?withStatus({...e,...ov}):e;});
    Object.entries(fbEvMap).forEach(([id,fe])=>{
      if(!fe._deleted&&!EVENTS.find(e=>e.id===id)) result.push(withStatus(fe));
    });
    return result.sort((a,b)=>new Date(b.startDate)-new Date(a.startDate));
  },[fbEvMap]);
}

  return <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border flex items-center gap-1 ${cfg.cls}`}>{status==='active'&&<span className="ldot"/>}{label}</span>;
};

/* ════════════════════════════════════════
   LOGIN SCREEN
════════════════════════════════════════ */
function LoginScreen({lang='de',setLang}) {
  const t=useT();
  const [hasUsers,setHasUsers]=useState(null); // null=prüfen
  const [mode,setMode]=useState('login'); // 'login'|'register'
  const [form,setForm]=useState({email:'',password:'',name:''});
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');
  const LANGS=[{c:'de',f:'🇩🇪'},{c:'en',f:'🇬🇧'},{c:'es',f:'🇪🇸'},{c:'fr',f:'🇫🇷'}];
  const AUTH_ERRORS={'auth/user-not-found':'Kein Account mit dieser Email.','auth/wrong-password':'Falsches Passwort.','auth/invalid-credential':'Falsche Email oder Passwort.','auth/invalid-email':'Ungültige Email-Adresse.','auth/too-many-requests':'Zu viele Versuche. Bitte warte kurz.','auth/email-already-in-use':'Diese Email ist bereits registriert.','auth/weak-password':'Passwort zu schwach.'};
  const setF=k=>e=>setForm(f=>({...f,[k]:e.target.value}));

  useEffect(()=>{
    fbOnce('backstage/appUsers').then(data=>{
      const count=data?Object.keys(data).length:0;
      setHasUsers(count>0);
      if(count===0) setMode('register');
    }).catch(()=>setHasUsers(true));
  },[]);

  const doLogin=async()=>{
    if(!form.email||!form.password){setErr('Email und Passwort eingeben.');return;}
    setLoading(true);setErr('');
    try{
      await auth.signInWithEmailAndPassword(form.email.trim(),form.password);
    }catch(e){setErr(AUTH_ERRORS[e.code]||'Fehler beim Einloggen.');}
    finally{setLoading(false);}
  };

  const doRegister=async()=>{
    if(!form.name.trim()||!form.email||!form.password){setErr('Alle Felder ausfüllen.');return;}
    if(form.password.length<6){setErr('Passwort mindestens 6 Zeichen.');return;}
    setLoading(true);setErr('');
    try{
      const cred=await auth.createUserWithEmailAndPassword(form.email.trim(),form.password);
      const uid=cred.user.uid;
      await fbSet(`backstage/appUsers/${uid}`,{uid,name:form.name.trim(),email:form.email.trim(),role:'superadmin',createdAt:Date.now()});
      // onAuthStateChanged in Root übernimmt ab hier
    }catch(e){setErr(AUTH_ERRORS[e.code]||'Fehler beim Registrieren.');}
    finally{setLoading(false);}
  };

  if(hasUsers===null) return (
    <div className="min-h-screen bg-zinc-950 flex items-center justify-center">
      <div className="text-zinc-600 text-sm">Laden…</div>
    </div>
  );

  const isReg=mode==='register';
  return (
    <div className="min-h-screen bg-zinc-950 flex flex-col items-center justify-start px-5 safe-top pb-10">
      <div className="mt-10 mb-1 select-none">
        <div className="gothic text-white" style={{fontSize:'64px',lineHeight:1,textShadow:'0 0 40px rgba(255,255,255,.08)'}}>unreal</div>
      </div>
      <div className="text-[10px] font-bold text-zinc-600 tracking-[.25em] uppercase mb-8">Backstage</div>
      {setLang&&(
        <div className="flex gap-2 mb-6">
          {LANGS.map(l=><button key={l.c} onClick={()=>setLang(l.c)} className={`w-9 h-9 rounded-xl text-lg flex items-center justify-center transition-all border ${lang===l.c?'border-amber-500 bg-amber-500/10':'border-zinc-800 bg-zinc-900 opacity-50'}`}>{l.f}</button>)}
        </div>
      )}
      <div className="w-full max-w-sm">
        {/* Tab-Switcher nur wenn keine User existieren (Ersteinrichtung) */}
        {!hasUsers&&(
          <div className="flex bg-zinc-900 border border-zinc-800 rounded-2xl p-1 mb-5">
            <button onClick={()=>setMode('login')} className={`flex-1 py-2.5 rounded-xl text-sm font-semibold transition-all ${!isReg?'bg-amber-500 text-black':'text-zinc-500'}`}>Einloggen</button>
            <button onClick={()=>setMode('register')} className={`flex-1 py-2.5 rounded-xl text-sm font-semibold transition-all ${isReg?'bg-amber-500 text-black':'text-zinc-500'}`}>Registrieren</button>
          </div>
        )}
        <div className="space-y-3">
          {isReg&&(
            <div>
              <div className="text-xs text-zinc-500 mb-1.5">Name</div>
              <input value={form.name} onChange={setF('name')} placeholder="Dein Name" type="text"
                className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3.5 text-zinc-100 text-sm placeholder-zinc-600"/>
            </div>
          )}
          <div>
            <div className="text-xs text-zinc-500 mb-1.5">Email</div>
            <input value={form.email} onChange={setF('email')} placeholder="deine@email.de" type="email" autoCapitalize="none" inputMode="email"
              className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3.5 text-zinc-100 text-sm placeholder-zinc-600"/>
          </div>
          <div>
            <div className="text-xs text-zinc-500 mb-1.5">Passwort</div>
            <input value={form.password} onChange={setF('password')} placeholder={isReg?'Mindestens 6 Zeichen':'••••••••'} type="password"
              className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3.5 text-zinc-100 text-sm placeholder-zinc-600"/>
          </div>
        </div>
        {err&&<div className="mt-3 text-xs text-red-400 text-center">{err}</div>}
        <button onClick={isReg?doRegister:doLogin} disabled={loading}
          className="w-full mt-5 bg-amber-500 text-black font-bold py-4 rounded-2xl text-sm active:scale-[.98] transition-all disabled:opacity-50">
          {loading?'…':isReg?'Account erstellen':'Einloggen'}
        </button>
        {isReg&&<div className="mt-3 text-center text-xs text-zinc-600">Erster Account wird automatisch Superadmin.</div>}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   ARTIST CARD ATOMS + ACard (Unreal-style)

const parseSetBounds=(timeStr,startDate)=>{
  if(!timeStr||!startDate) return null;
  const parts=(timeStr||'').split('–');
  if(parts.length!==2) return null;
  const s=parts[0].trim(),e=parts[1].trim();
  if(!/^\d{2}:\d{2}$/.test(s)||!/^\d{2}:\d{2}$/.test(e)) return null;
  const st=new Date(`${startDate}T${s}:00`);
  const et=new Date(`${startDate}T${e}:00`);
  if(et<=st) et.setDate(et.getDate()+1);
  return{st,et};
};

function Dot({on}){
  return <span className={`inline-block w-2 h-2 rounded-full flex-shrink-0 transition-colors ${on?'bg-emerald-400':'bg-zinc-700'}`}/>;
}

function CheckBtn({label,checked,onChange}){
  return (
    <button onClick={()=>onChange(!checked)}
      className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium transition-all border select-none
        ${checked?'bg-emerald-500/20 border-emerald-500/40 text-emerald-300 line-through decoration-emerald-500':'bg-zinc-800/60 border-zinc-700 text-zinc-400 active:bg-zinc-700'}`}>
      <span className={`w-4 h-4 rounded border flex items-center justify-center flex-shrink-0 transition-all ${checked?'bg-emerald-500 border-emerald-500':'border-zinc-600'}`}>
        {checked&&<span className="text-black text-xs font-black leading-none">✓</span>}
      </span>
      {label}
    </button>
  );
}

/* ACard — matches index.html ACard component */
function ACard({artist,eventId,editable,startDate}){
  const[artistStatus,setArtistStatus]=useState({});
  const now=useClock();
  const key=artKey(artist.name);
  useEffect(()=>fbOn(`backstage/artistStatus/${eventId}/${key}`,v=>setArtistStatus(v||{})),[eventId,key]);
  const toggle=k=>{if(editable) fbSet(`backstage/artistStatus/${eventId}/${key}/${k}`,!artistStatus[k]);};

  const bounds=useMemo(()=>parseSetBounds(artist.time,startDate),[artist.time,startDate]);
  const isLive=bounds&&now>=bounds.st&&now<bounds.et;
  const isPast=bounds&&now>=bounds.et;
  const setProgress=bounds&&isLive?Math.round(((now-bounds.st)/(bounds.et-bounds.st))*100):0;

  const isActive=artistStatus.im_club&&!artistStatus.set_beendet;
  const isDone=artistStatus.set_beendet;
  const acc=FLOOR_ACCENT[artist.stage]||{text:'text-zinc-500'};
  const artistKeys=useMemo(()=>getKeys(artist),[artist.name,artist.transfers,artist.soundcheck]);
  const done=artistKeys.filter(k=>artistStatus[k]).length;
  const pct=artistKeys.length?Math.round(done/artistKeys.length*100):0;

  const parts=(artist.time||'').split('–');
  const setStart=parts[0]?.trim();
  const setEnd=parts[1]?.trim();

  return (
    <div className={`rounded-xl border transition-all
      ${isDone?'border-zinc-800/60 opacity-50'
      :isLive?'border-emerald-600/60 bg-emerald-950/20'
             :'border-zinc-800 bg-zinc-900/60'}`}>

      {/* Header row */}
      <div className="flex items-center gap-3 px-4 py-3">
        <div className="text-center flex-shrink-0 w-14">
          <div className={`font-black text-sm mono ${isLive?'text-emerald-400':isPast?'text-zinc-600':'text-amber-400'}`}>{setStart}</div>
          <div className="text-zinc-600 text-xs mono">–{setEnd}</div>
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-1.5 flex-wrap">
            <Dot on={isLive||isActive}/>
            <span className={`font-bold text-sm ${isPast?'text-zinc-500':'text-zinc-100'}`}>{artist.name}</span>
            {isLive&&<span className="text-[9px] font-black text-emerald-400 bg-emerald-500/15 border border-emerald-500/40 px-1.5 py-0.5 rounded-full flex-shrink-0">LIVE</span>}
            {artist.soundcheck&&<span className="text-xs bg-violet-500/20 text-violet-300 border border-violet-500/30 px-1.5 py-0.5 rounded mono">SC {artist.soundcheck}</span>}
            {artist.tech&&<span className="text-[10px] text-zinc-600 border border-zinc-800 px-1.5 py-0.5 rounded mono">{artist.tech}</span>}
            {artist.notes?.startsWith('⚠️')&&<span className="text-xs bg-red-500/20 text-red-300 border border-red-500/30 px-1.5 py-0.5 rounded">⚠️</span>}
          </div>
          {/* Progress bar */}
          <div className="flex items-center gap-2 mt-1">
            <div className="flex-1 h-1 bg-zinc-800 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-amber-500 to-emerald-500 rounded-full transition-all duration-500" style={{width:pct+'%'}}/>
            </div>
            <span className="text-[10px] text-zinc-600 mono w-6 text-right">{pct}%</span>
          </div>
        </div>
      </div>

      {/* Live set progress bar */}
      {isLive&&setProgress>0&&(
        <div className="h-0.5 bg-zinc-800/80">
          <div className="h-full bg-emerald-500 transition-all" style={{width:setProgress+'%'}}/>
        </div>
      )}

      {/* Notes */}
      {artist.notes&&(
        <div className="px-4 pb-1.5 text-xs text-amber-300/80 mono leading-relaxed">{artist.notes}</div>
      )}

      {/* Checklist */}
      <div className="px-4 pb-3 flex flex-wrap gap-1.5">
        {artistKeys.map(k=>(
          <CheckBtn key={k} label={STATUS_LABELS[k]} checked={!!artistStatus[k]} onChange={v=>toggle(k)}/>
        ))}
      </div>

      {/* Rider (collapsible) */}
      {artist.rider&&(
        <details className="px-4 pb-3 group">
          <summary className="text-xs text-zinc-500 cursor-pointer select-none flex items-center gap-1.5 hover:text-zinc-300 transition-colors">
            <span className="text-zinc-700 group-open:rotate-90 transition-transform inline-block">▶</span>
            🎁 Rider anzeigen
          </summary>
          <div className="mt-2 text-xs text-zinc-400 whitespace-pre-line bg-zinc-800/50 rounded-lg p-3 mono leading-relaxed">
            {artist.rider}
          </div>
        </details>
      )}

      {/* Contacts quick-dial */}
      {artist.contact?.some(c=>c.phone)&&(
        <div className="px-4 pb-3 flex flex-wrap gap-1.5">
          {artist.contact.filter(c=>c.phone).map((c,i)=>(
            <a key={i} href={`tel:${c.phone.replace(/[\s()\-]/g,'')}`}
              className="text-xs bg-zinc-800 border border-zinc-700 text-zinc-400 active:text-amber-400 px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition-colors">
              📞 {c.name}
            </a>
          ))}
        </div>
      )}
    </div>
  );
}

/* Alias for backwards-compat within EventDetail edit mode */
const ArtistStatusCard=ACard;

/* ════════════════════════════════════════
   TIMELINE BAR (thin progress bar per floor)
════════════════════════════════════════ */
function TimelineBar({artists,now,stage}){
  const acc=FLOOR_ACCENT[stage]||{bg:'bg-zinc-500'};
  const sorted=[...artists].sort((a,b)=>toMinsSet((a.time||'').split('–')[0])-toMinsSet((b.time||'').split('–')[0]));
  const nowH=now.getHours();
  const nowM=(nowH<12?nowH+24:nowH)*60+now.getMinutes();
  const allM=sorted.flatMap(a=>[(a.time||'').split('–')[0],(a.time||'').split('–')[1]].map(t=>toMinsSet((t||'').trim())).filter(m=>m<9999));
  if(!allM.length) return null;
  const minT=Math.min(...allM)-15,maxT=Math.max(...allM)+15,span=maxT-minT;
  const pct=m=>((m-minT)/span*100).toFixed(2);
  const showNow=nowM>=minT&&nowM<=maxT;
  return (
    <div className="relative h-1.5 bg-zinc-800 rounded-full mb-4 mt-1">
      {sorted.map((a,i)=>{
        const s=toMinsSet((a.time||'').split('–')[0]?.trim());
        const e=toMinsSet((a.time||'').split('–')[1]?.trim());
        if(s>=9999||e>=9999) return null;
        return <div key={i} className={`absolute h-full rounded-full opacity-70 ${acc.bg}`}
          style={{left:pct(s)+'%',width:Math.max(1,pct(e)-pct(s))+'%'}}/>;
      })}
      {showNow&&(
        <div className="absolute top-1/2 w-0.5 h-4 bg-amber-400 rounded-full z-10"
          style={{left:pct(nowM)+'%',transform:'translateX(-50%) translateY(-50%)'}}>
          <div className="absolute -top-5 left-1/2 -translate-x-1/2 text-[9px] mono text-amber-400 whitespace-nowrap bg-zinc-950 px-1 rounded border border-amber-500/30">
            {now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
          </div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════
   CLUB VIEW (floor tabs + Alle grid + per-floor list)
════════════════════════════════════════ */
function ClubView({event,canEdit,editSection,onOpenItemEdit,onDeleteItem}){
  const [activeFloor,setActiveFloor]=useState('Alle');
  const [now,setNow]=useState(new Date());
  const eventId=event.id;
  const startDate=event.startDate;

  useEffect(()=>{const id=setInterval(()=>setNow(new Date()),60000);return()=>clearInterval(id);},[]);

  const allArtists=event.artists||[];
  // Day tabs
  const days=[...new Set(allArtists.map(a=>a.day).filter(Boolean))];
  const [activeDay,setActiveDay]=useState(days[0]||null);
  const dayArtists=activeDay?allArtists.filter(a=>a.day===activeDay):allArtists;

  const floors=event.floors?.length?event.floors:[...new Set(dayArtists.map(a=>a.stage))];
  const byStage=s=>dayArtists.filter(a=>a.stage===s).sort((a,b)=>toMinsSet((a.time||'').split('–')[0])-toMinsSet((b.time||'').split('–')[0]));

  const nowH=now.getHours();
  const nowM=(nowH<12?nowH+24:nowH)*60+now.getMinutes();

  // Timeline grid
  const PX=1.4,PAD=45;
  const gridArtists=floors.flatMap(f=>byStage(f));
  const allM=gridArtists.flatMap(a=>[(a.time||'').split('–')[0],(a.time||'').split('–')[1]].map(t=>toMinsSet((t||'').trim())).filter(m=>m<9999));
  const gMin=(allM.length?Math.min(Math.min(...allM),nowM):nowM)-PAD;
  const gMax=(allM.length?Math.max(Math.max(...allM),nowM):nowM)+PAD;
  const totalH=(gMax-gMin)*PX;
  const toY=m=>(m-gMin)*PX;

  const timeLabels=[];
  for(let h=Math.floor(gMin/60);h<=Math.ceil(gMax/60);h++){
    const m=h*60;
    if(m>=gMin&&m<=gMax&&h%2===0){
      const dh=h>=24?h-24:h;
      timeLabels.push({m,y:toY(m),label:String(dh).padStart(2,'0')+':00'});
    }
  }
  const showNow=nowM>=gMin&&nowM<=gMax;

  const renderList=arr=>(
    <div className="space-y-2">
      {arr.map((a,i)=>{
        const prev=arr[i-1];
        const prevEnd=toMinsSet((prev?.time||'').split('–')[1]?.trim());
        const aStart=toMinsSet((a.time||'').split('–')[0]?.trim());
        const insertNow=prev&&prevEnd<=nowM&&nowM<aStart;
        return (
          <div key={a.name+i}>
            {insertNow&&(
              <div className="flex items-center gap-2 my-1.5">
                <div className="flex-1 h-px bg-amber-500/40"/>
                <span className="text-[10px] mono text-amber-400 bg-zinc-950 px-2 border border-amber-500/30 rounded">
                  ▶ Jetzt {now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
                </span>
                <div className="flex-1 h-px bg-amber-500/40"/>
              </div>
            )}
            <div className="relative">
              <ACard artist={a} eventId={eventId} editable={canEdit&&editSection!=='artists'} startDate={startDate}/>
              {editSection==='artists'&&(
                <div className="absolute top-2 right-2 flex gap-1 z-10">
                  <button onClick={()=>onOpenItemEdit(a)} className="bg-zinc-800 border border-zinc-700 text-amber-400 text-xs px-2 py-1 rounded-lg active:scale-95">✏</button>
                  <button onClick={()=>onDeleteItem(a)} className="bg-zinc-800 border border-zinc-700 text-red-400 text-xs px-2 py-1 rounded-lg active:scale-95">🗑</button>
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );

  return (
    <div>
      {/* Day tabs (only if artists have day fields) */}
      {days.length>1&&(
        <div className="flex gap-1 mb-3 overflow-x-auto">
          {days.map(d=>(
            <button key={d} onClick={()=>{setActiveDay(d);setActiveFloor('Alle');}}
              className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold border transition-all whitespace-nowrap
                ${activeDay===d?'bg-amber-500/20 border-amber-500/50 text-amber-400':'border-zinc-700 text-zinc-500 active:text-zinc-300'}`}>
              {d}
            </button>
          ))}
        </div>
      )}

      {/* Floor tabs */}
      <div className="flex gap-1 mb-4 bg-zinc-900 rounded-xl p-1 border border-zinc-800 overflow-x-auto">
        {['Alle',...floors].map(f=>{
          const acc=FLOOR_ACCENT[f];
          return (
            <button key={f} onClick={()=>setActiveFloor(f)}
              className={`flex-shrink-0 px-3 py-2 rounded-lg text-xs font-bold transition-all whitespace-nowrap
                ${activeFloor===f?acc?`bg-zinc-800 ${acc.text}`:'bg-zinc-700 text-zinc-100':'text-zinc-500 active:text-zinc-300'}`}>
              {f}
            </button>
          );
        })}
      </div>

      {activeFloor==='Alle'?(
        /* ── TIMELINE GRID ── */
        <div className="relative flex" style={{height:totalH}}>
          {/* Time axis */}
          <div className="flex-shrink-0 w-10 relative">
            {timeLabels.map(({m,y,label})=>(
              <div key={m} className="absolute right-1 text-[9px] mono text-zinc-600 -translate-y-1/2 whitespace-nowrap" style={{top:y}}>
                {label}
              </div>
            ))}
          </div>
          {/* Grid lines + now line */}
          <div className="absolute inset-0 left-10 pointer-events-none">
            {timeLabels.map(({m,y})=>(
              <div key={m} className="absolute left-0 right-0 border-t border-zinc-800/50" style={{top:y}}/>
            ))}
            {showNow&&(
              <div className="absolute left-0 right-0 z-20" style={{top:toY(nowM)}}>
                <div className="absolute left-0 right-0 h-0.5 bg-amber-400"
                  style={{boxShadow:'0 0 6px 1px rgba(251,191,36,0.5)'}}/>
                <div className="absolute -left-0.5 -top-3 flex items-center gap-1 bg-amber-500 text-black text-[9px] font-bold mono px-1.5 py-0.5 rounded-full whitespace-nowrap z-30"
                  style={{boxShadow:'0 0 8px 2px rgba(251,191,36,0.4)'}}>
                  <span className="w-1.5 h-1.5 rounded-full bg-black animate-pulse inline-block"/>
                  {now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
                </div>
              </div>
            )}
          </div>
          {/* Floor columns */}
          {floors.map(stage=>{
            const acc=FLOOR_ACCENT[stage]||{text:'text-zinc-500',bg:'bg-zinc-500',border:'border-zinc-700'};
            const stagePl=byStage(stage);
            return (
              <div key={stage} className="flex-1 relative border-l border-zinc-800 min-w-0 overflow-hidden" style={{height:totalH}}>
                <div className={`sticky top-0 z-10 text-[9px] font-bold tracking-widest uppercase px-1.5 py-1 bg-zinc-950/90 ${acc.text}`}>
                  {stage.replace('Floor ','F')}
                </div>
                {stagePl.map((a,ai)=>{
                  const p=(a.time||'').split('–');
                  const sM=toMinsSet(p[0]?.trim());
                  const eM=toMinsSet(p[1]?.trim());
                  if(sM>=9999||eM>=9999) return null;
                  const top=toY(sM);
                  const height=Math.max(28,(eM-sM)*PX);
                  return (
                    <button key={ai} onClick={()=>setActiveFloor(stage)}
                      className={`absolute left-1 right-1 rounded-lg border overflow-hidden text-left active:opacity-70 transition-opacity ${acc.border} bg-zinc-900`}
                      style={{top,height}}>
                      <div className={`text-[10px] font-bold px-1.5 pt-1 truncate leading-tight ${acc.text}`}>{a.name}</div>
                      <div className="text-[9px] mono text-zinc-600 px-1.5 leading-none">{a.time}</div>
                    </button>
                  );
                })}
              </div>
            );
          })}
        </div>
      ):(
        /* ── SINGLE FLOOR LIST ── */
        <div>
          <TimelineBar artists={byStage(activeFloor)} now={now} stage={activeFloor}/>
          {renderList(byStage(activeFloor))}
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════
   LIVE MAP
════════════════════════════════════════ */
function LiveMap({event,currentUser,compact=false,viewOnly=false}) {
  const mapRef=useRef(null),mapInst=useRef(null),markers=useRef({}),myMark=useRef(null),wid=useRef(null);
  const [sharing,setSharing]=useState(false);
  const [locs,setLocs]=useState({});
  const [acc,setAcc]=useState(null);

  useEffect(()=>{
    if(!mapRef.current||mapInst.current) return;
    const lat=event.venueLat||51.5,lng=event.venueLng||7.4;
    const map=L.map(mapRef.current,{zoomControl:!compact,attributionControl:false}).setView([lat,lng],14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const lbl=(txt,col,textCol='#fff')=>L.divIcon({className:'',html:`<div style="background:${col};color:${textCol};padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5)">${txt}</div>`,iconAnchor:[0,0]});
    if(event.venueLat) L.marker([event.venueLat,event.venueLng],{icon:lbl(event.name,'#f59e0b','#000')}).addTo(map);
    if(event.hotelLat) L.marker([event.hotelLat,event.hotelLng],{icon:lbl('Hotel','#6366f1')}).addTo(map);
    mapInst.current=map;
    const ref=db.ref(`backstage/locations/${event.id}`);
    const COL={'superadmin':'#f59e0b','admin':'#8b5cf6','abendleitung':'#f97316','fahrer':'#10b981','artist':'#ec4899','kasse':'#3b82f6','techniker':'#06b6d4'};
    ref.on('value',snap=>{
      const data=snap.val()||{};setLocs(data);
      Object.entries(data).forEach(([uid,loc])=>{
        if(!loc?.lat) return;
        const col=COL[loc.role]||'#f59e0b';
        const icon=L.divIcon({className:'',html:`<div style="width:34px;height:34px;border-radius:50%;background:${col};border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.5)">${loc.initials||'?'}</div>`,iconSize:[34,34],iconAnchor:[17,17]});
        if(markers.current[uid]) markers.current[uid].setLatLng([loc.lat,loc.lng]);
        else markers.current[uid]=L.marker([loc.lat,loc.lng],{icon}).addTo(map).bindPopup(`<b>${loc.name}</b><br/>${loc.time}`);
      });
    });
    return()=>{ref.off('value');stopInt();try{map.remove();}catch(e){}mapInst.current=null;markers.current={};};
  },[event.id]);

  const stopInt=()=>{if(wid.current){navigator.geolocation.clearWatch(wid.current);wid.current=null;}};
  const startSharing=()=>{
    if(!navigator.geolocation){alert('GPS nicht verfügbar');return;}
    setSharing(true);
    wid.current=navigator.geolocation.watchPosition(pos=>{
      const {latitude:lat,longitude:lng,accuracy:a}=pos.coords;
      setAcc(Math.round(a));
      fbSet(`backstage/locations/${event.id}/${currentUser.id}`,{lat,lng,name:currentUser.name,initials:initials(currentUser.name),role:currentUser.role,time:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});
      if(mapInst.current){
        const ico=L.divIcon({className:'',html:`<div style="width:16px;height:16px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 4px rgba(59,130,246,.3)"/>`,iconSize:[16,16],iconAnchor:[8,8]});
        if(myMark.current) myMark.current.setLatLng([lat,lng]);
        else myMark.current=L.marker([lat,lng],{icon:ico}).addTo(mapInst.current);
        if(!compact) mapInst.current.panTo([lat,lng]);
      }
    },err=>{
      setSharing(false);
      const msg={1:'Berechtigung verweigert – Standort in Browsereinstellungen erlauben.',2:'Standort nicht verfügbar.',3:'Zeitüberschreitung – bitte erneut versuchen.'}[err.code]||'Standort-Fehler.';
      alert('📍 '+msg);
    },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  };
  const stopSharing=()=>{
    stopInt();fbSet(`backstage/locations/${event.id}/${currentUser.id}`,null);
    if(myMark.current){myMark.current.remove();myMark.current=null;}
    setSharing(false);setAcc(null);
  };

  const active=Object.entries(locs).filter(([,l])=>l?.lat);
  return (
    <div className="flex flex-col h-full">
      <div ref={mapRef} style={{flex:1,minHeight:compact?180:300}}/>
      {!viewOnly&&(
        <div className="bg-zinc-900 border-t border-zinc-800 p-3 flex-shrink-0">
          <div className="flex items-center gap-3">
            <div className="flex-1">
              <div className="text-sm font-semibold text-zinc-100">Live Standort</div>
              <div className="text-xs text-zinc-500">{active.length} aktiv{acc?` · ±${acc}m`:''}</div>
            </div>
            {sharing
              ?<button onClick={stopSharing} className="bg-red-500/20 border border-red-500/40 text-red-400 text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-1.5 active:scale-95">
                <span className="ldot" style={{background:'#ef4444'}}/> Stoppen
               </button>
              :<button onClick={startSharing} className="bg-emerald-500 text-black font-bold text-xs px-4 py-2 rounded-xl active:scale-95">📍 Teilen</button>
            }
          </div>
          {active.length>0&&(
            <div className="flex gap-2 mt-2 flex-wrap">
              {active.map(([uid,l])=>(
                <div key={uid} className="flex items-center gap-1 text-xs px-2 py-1 rounded-full bg-zinc-800 border border-zinc-700">
                  <span className="ldot"/><span className="text-zinc-300">{l.name?.split(' ')[0]}</span><span className="text-zinc-600">{l.time}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ChangeApprovalModal({notif,onClose,onDecision}) {
  const r=notif.reqData||{};
  const [rejectMode,setRejectMode]=useState(false);
  const [reason,setReason]=useState('');
  const [done,setDone]=useState(null);

  const decide=approved=>{
    if(!approved&&!rejectMode){setRejectMode(true);return;}
    setDone(approved?'approved':'rejected');
    // Update Firebase status → triggers inbox listener to remove it
    fbSet(`backstage/changeRequests/${notif.eventId}/${notif.id}`,{...r,status:approved?'approved':'rejected',reason,decidedAt:Date.now()});
    fbPush(`backstage/changeDecisions/${notif.eventId}`,{...r,approved,reason,decidedAt:Date.now()});
    onDecision(notif.id,approved);
  };

  return (
    <div className="fixed inset-0 bg-black/70 z-50 flex items-end" onClick={onClose}>
      <div className="w-full bg-zinc-900 rounded-t-3xl p-6 safe-bottom slide-up" onClick={e=>e.stopPropagation()}>
        <div className="w-10 h-1 bg-zinc-700 rounded-full mx-auto mb-5"/>
        {done?(
          <div className="text-center py-4">
            <div className="text-4xl mb-3">{done==='approved'?'✅':'❌'}</div>
            <div className="text-lg font-bold text-white">{done==='approved'?'Bestätigt':'Abgelehnt'}</div>
            <div className="text-sm text-zinc-500 mt-1">{r.artistName} · {r.field}</div>
            <Btn onClick={onClose} className="mt-6 px-10">Fertig</Btn>
          </div>
        ):(
          <>
            <div className="text-xs text-zinc-500 uppercase tracking-widest mb-1">Änderungsantrag</div>
            <div className="text-xl font-bold text-white mb-4">{r.artistName}</div>
            <div className="bg-zinc-800 rounded-2xl p-4 mb-4 space-y-2.5">
              <div className="flex justify-between"><span className="text-xs text-zinc-500">Feld</span><span className="text-sm font-semibold text-zinc-200">{r.field}</span></div>
              <div className="flex justify-between"><span className="text-xs text-zinc-500">Aktuell</span><span className="text-sm text-zinc-400 mono">{r.currentVal}</span></div>
              <div className="flex justify-between"><span className="text-xs text-zinc-500">Neu</span><span className="text-sm font-bold text-amber-400 mono">{r.requestedVal}</span></div>
              {r.reason&&<div className="pt-2 border-t border-zinc-700 text-xs text-zinc-400">„{r.reason}"</div>}
            </div>
            {rejectMode&&(
              <div className="mb-4">
                <div className="text-xs text-zinc-500 mb-1.5">Begründung (optional)</div>
                <textarea value={reason} onChange={e=>setReason(e.target.value)} rows={2} className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-zinc-100 text-sm resize-none placeholder-zinc-600" placeholder="Warum abgelehnt?"/>
              </div>
            )}
            <div className="flex gap-3">
              <button onClick={()=>decide(false)} className={`flex-1 font-bold py-4 rounded-2xl text-sm border active:scale-[.98] transition-all ${rejectMode?'bg-red-500 text-white border-red-500':'border-red-500/40 text-red-400'}`}>
                {rejectMode?'Ablehnen':'✗ Ablehnen'}
              </button>
              <button onClick={()=>decide(true)} className="flex-1 bg-emerald-500 text-black font-bold py-4 rounded-2xl text-sm active:scale-[.98] transition-all">
                ✓ Bestätigen
              </button>
            </div>
            {rejectMode&&<button onClick={()=>setRejectMode(false)} className="w-full mt-2 text-xs text-zinc-500 py-2">Abbrechen</button>}
          </>
        )}
      </div>
    </div>
  );
}

/* ── PICKUP THREAD (shared artist+fahrer+admin) ─────────────────────────────
   Firebase:
     backstage/pickups/${eventId}/${pickupId}/status  → {phase,by,at}
     backstage/pickups/${eventId}/${pickupId}/msgs    → list of {text,sentBy,sentByRole,sentAt}
   Phases: null → 'accepted' → 'delayed'? → 'done' | reset to null
──────────────────────────────────────────────────────────────────────────── */
function usePickupData(eventId,pickupId){
  const base=`backstage/pickups/${eventId}/${pickupId}`;
  const [status,setStatus]=useState(null);
  const [msgs,setMsgs]=useState([]);
  useEffect(()=>fbOn(`${base}/status`,v=>setStatus(v)),[base]);
  useEffect(()=>fbOn(`${base}/msgs`,data=>{
    if(!data){setMsgs([]);return;}
    setMsgs(Object.entries(data).map(([id,m])=>({...m,id})).sort((a,b)=>a.sentAt-b.sentAt));
  }),[base]);
  return {status,msgs,base};
}

function PickupMessageRow({pickup,eventId,currentUser,canSend}){
  const {status,msgs,base}=usePickupData(eventId,pickup.id);
  const [text,setText]=useState('');
  const [drafting,setDrafting]=useState(false);
  const t=useT();
  const isFahrer=currentUser.role==='fahrer';
  const isAdmin=['superadmin','admin','abendleitung'].includes(currentUser.role);
  const phase=status?.phase;

  const pushMsg=(txt,role)=>fbPush(`${base}/msgs`,{text:txt,sentBy:currentUser.name,sentByRole:role||currentUser.role,sentAt:Date.now()});

  const accept=()=>{
    const ts=Date.now();
    fbSet(`${base}/status`,{phase:'accepted',by:currentUser.name,at:ts});
    pushMsg('✅ '+t('pickup_driver_enroute').replace('✅ ',''),'fahrer');
    if(pickup.statusKey) fbSet(`backstage/artistStatus/${eventId}/${pickup.statusKey}`,true);
  };
  const markDone=()=>{
    fbSet(`${base}/status`,{...status,phase:'done',doneAt:Date.now()});
    pushMsg(t('pickup_finished'),'fahrer');
  };
  const reset=()=>{
    fbSet(`${base}/status`,null);
    fbSet(`${base}/msgs`,null);
    if(pickup.statusKey) fbSet(`backstage/artistStatus/${eventId}/${pickup.statusKey}`,null);
  };
  const send=()=>{
    if(!text.trim()) return;
    pushMsg(text.trim());
    if(isFahrer&&(text.includes('später')||text.includes('verspät')||text.includes('delay')||text.includes('tarde')||text.includes('retard')))
      fbSet(`${base}/status`,{...status,phase:'delayed'});
    setText('');setDrafting(false);
  };

  const phaseStyle={
    accepted:{bg:'bg-emerald-500/10 border-emerald-500/20',text:'text-emerald-400',label:t('pickup_driver_enroute')},
    delayed:{bg:'bg-amber-500/10 border-amber-500/20',text:'text-amber-400',label:t('pickup_delay')},
    done:{bg:'bg-zinc-800 border-zinc-700',text:'text-zinc-400',label:t('pickup_finished')},
  };
  const ps=phaseStyle[phase]||null;

  return (
    <div className="mt-2 space-y-1.5">
      {/* Status-Banner */}
      {ps&&(
        <div className={`flex items-center justify-between ${ps.bg} border rounded-xl px-3 py-2`}>
          <div>
            <div className={`text-xs font-bold ${ps.text}`}>{ps.label}</div>
            <div className="text-[10px] text-zinc-600">{status.by} · {status.at?new Date(status.at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''}</div>
          </div>
          {(isAdmin||isFahrer)&&(
            <button onClick={reset} className="text-[10px] text-zinc-500 border border-zinc-700 px-2 py-1 rounded-lg active:bg-zinc-800">{t('pickup_reset')}</button>
          )}
        </div>
      )}
      {/* Message Thread */}
      {msgs.length>0&&(
        <div className="space-y-1 pl-1">
          {msgs.map(m=>(
            <div key={m.id} className={`rounded-xl px-3 py-2 text-xs ${m.sentByRole==='fahrer'?'bg-blue-500/8 border border-blue-500/15':'bg-amber-500/8 border border-amber-500/15'}`}>
              <div className={`text-[10px] font-bold mb-0.5 ${m.sentByRole==='fahrer'?'text-blue-400':'text-amber-400'}`}>{m.sentBy}</div>
              <div className="text-zinc-200 leading-relaxed">{m.text}</div>
              <div className="text-zinc-600 text-[9px] mt-0.5">{m.sentAt?new Date(m.sentAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''}</div>
            </div>
          ))}
        </div>
      )}
      {/* Fahrer-Aktionen */}
      {isFahrer&&(
        <div className="flex gap-2">
          {!phase&&<button onClick={accept} className="flex-1 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold py-2.5 rounded-xl active:scale-95 transition-all">{t('pickup_accept')}</button>}
          {phase==='accepted'&&<button onClick={markDone} className="flex-1 bg-zinc-800 border border-zinc-700 text-zinc-300 text-xs font-bold py-2.5 rounded-xl active:scale-95">{t('pickup_mark_done')}</button>}
        </div>
      )}
      {/* Nachricht senden */}
      {canSend&&phase!=='done'&&(
        drafting?(
          <div className="flex gap-2">
            <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
              placeholder={t('pickup_msg_driver')}
              className="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-zinc-100 placeholder-zinc-600"/>
            <button onClick={send} className="bg-amber-500 text-black font-bold text-xs px-3 rounded-xl">→</button>
            <button onClick={()=>{setDrafting(false);setText('');}} className="text-zinc-600 text-xs px-2">✕</button>
          </div>
        ):(
          <button onClick={()=>setDrafting(true)} className="text-[11px] text-zinc-600 active:text-zinc-400 transition-all">+ {t('pickup_send_msg').replace('✏ ','')}</button>
        )
      )}
    </div>
  );
}

/* ════════════════════════════════════════
   OVERVIEW ARTISTS (Überblick tab artist list)

function OverviewArtists({event,canEdit}){
  const allArtists=event.artists||[];
  const days=[...new Set(allArtists.map(a=>a.day).filter(Boolean))];
  // Default: null = show ALL in continuous chronological order (handles midnight crossing)
  const [activeDay,setActiveDay]=useState(null);
  const filtered=activeDay?allArtists.filter(a=>a.day===activeDay):allArtists;
  const sorted=[...filtered].sort((a,b)=>toMinsSet((a.time||'').split('–')[0])-toMinsSet((b.time||'').split('–')[0]));
  return (
    <div className="mt-1">
      <div className="text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-3">Artists</div>
      {days.length>1&&(
        <div className="flex gap-1 mb-3 overflow-x-auto">
          <button onClick={()=>setActiveDay(null)}
            className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold border transition-all whitespace-nowrap
              ${activeDay===null?'bg-amber-500/20 border-amber-500/50 text-amber-400':'border-zinc-700 text-zinc-500 active:text-zinc-300'}`}>
            Alle
          </button>
          {days.map(d=>(
            <button key={d} onClick={()=>setActiveDay(d)}
              className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold border transition-all whitespace-nowrap
                ${activeDay===d?'bg-amber-500/20 border-amber-500/50 text-amber-400':'border-zinc-700 text-zinc-500 active:text-zinc-300'}`}>
              {d}
            </button>
          ))}
        </div>
      )}
      <div className="space-y-2">
        {sorted.map((a,i)=>(
          <ACard key={a.name+i} artist={a} eventId={event.id} editable={canEdit} startDate={event.startDate}/>
        ))}
      </div>
    </div>
  );
}

const DM_ALLOWED_MAP={
  superadmin:['superadmin','admin','abendleitung','artist','fahrer','kasse','techniker'],
  admin:     ['superadmin','admin','abendleitung','artist','fahrer','kasse','techniker'],
  abendleitung:['superadmin','admin','abendleitung','artist','fahrer','kasse','techniker'],
  artist:    ['fahrer','abendleitung','admin','superadmin'],
  fahrer:    ['abendleitung','admin','superadmin','artist'],
  kasse:     ['abendleitung','admin','superadmin'],
  techniker: ['abendleitung','admin','superadmin'],
};

function GroupChatThread({eventId,eventName,currentUser,onOpenDrawer,dmUnread}){
  const t=useT();
  const [messages,setMessages]=useState([]);
  const [text,setText]=useState('');
  const bottomRef=useRef(null);
  const path=`backstage/groupChat/${eventId}/messages`;

  useEffect(()=>{
    fbSet(`backstage/groupChat/${eventId}/unread/${currentUser.id}`,0);
    return fbOn(path,data=>{
      if(!data){setMessages([]);return;}
      setMessages(Object.entries(data).map(([id,m])=>({...m,id})).sort((a,b)=>a.timestamp-b.timestamp));
    });
  },[eventId]);

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'});},[messages]);

  const send=()=>{
    if(!text.trim()) return;
    const msg={text:text.trim(),senderId:currentUser.id,senderName:currentUser.name,senderRole:currentUser.role,timestamp:Date.now()};
    fbPush(path,msg);
    fbSet(`backstage/groupChat/${eventId}/lastMessage`,msg);
    // Increment unread badge for all other users
    fbOnce('backstage/appUsers').then(data=>{
      if(!data) return;
      Object.keys(data).forEach(uid=>{
        if(uid!==currentUser.id)
          fbOnce(`backstage/groupChat/${eventId}/unread/${uid}`).then(v=>
            fbSet(`backstage/groupChat/${eventId}/unread/${uid}`,(v||0)+1));
      });
    });
    setText('');
  };

  const isMine=m=>m.senderId===currentUser.id;

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-3 px-4 py-3 border-b border-zinc-800 flex-shrink-0 bg-zinc-950">
        <button onClick={onOpenDrawer} className="relative text-zinc-400 text-2xl leading-none active:text-zinc-100 w-8 flex-shrink-0">
          ☰
          {dmUnread>0&&<span className="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center">{dmUnread}</span>}
        </button>
        <div className="flex-1 min-w-0">
          <div className="text-sm font-bold text-zinc-100 truncate">{eventName}</div>
          <div className="text-[10px] text-zinc-500">Gruppen-Chat · alle Rollen</div>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto px-4 py-3 space-y-2">
        {messages.length===0&&<div className="text-center text-zinc-700 text-xs py-16">Noch keine Nachrichten. Los gehts! 🎉</div>}
        {messages.map(m=>(
          <div key={m.id} className={`flex ${isMine(m)?'justify-end':'justify-start'}`}>
            <div className={`max-w-[78%] px-3.5 py-2.5 rounded-2xl text-sm leading-relaxed ${isMine(m)?'bg-amber-500 text-black rounded-br-sm':'bg-zinc-800 text-zinc-100 rounded-bl-sm'}`}>
              {!isMine(m)&&<div className={`text-[10px] font-bold mb-1 ${ROLE_COLOR[m.senderRole]?.split(' ')[0]||'text-zinc-500'}`}>{m.senderName}</div>}
              {m.text}
              <div className={`text-[10px] mt-1 ${isMine(m)?'text-black/40':'text-zinc-600'}`}>
                {new Date(m.timestamp).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
              </div>
            </div>
          </div>
        ))}
        <div ref={bottomRef}/>
      </div>
      <div className="flex gap-2 px-4 py-3 border-t border-zinc-800 safe-bottom flex-shrink-0 bg-zinc-950">
        <input value={text} onChange={e=>setText(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&send()}
          placeholder={t('msg_placeholder')}
          className="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-600"/>
        <button onClick={send} disabled={!text.trim()}
          className="bg-amber-500 text-black font-bold px-4 rounded-xl disabled:opacity-30 active:scale-95 text-sm flex-shrink-0">→</button>
      </div>
    </div>
  );
}

const STAFF_ROLES=['superadmin','admin','abendleitung','fahrer','kasse','techniker'];

function ChatTerminal({events,currentUser}){
  const t=useT();
  const isStaff=STAFF_ROLES.includes(currentUser.role);
  const activeEvent=events.find(e=>e.status==='active')||events[0];
  // Artists go straight to DM list, staff get group chat by default
  const [activeConvo,setActiveConvo]=useState(isStaff?{type:'group'}:{type:'dms'});
  const [drawerOpen,setDrawerOpen]=useState(false);
  const [dmConvos,setDmConvos]=useState([]);
  const [allUsers,setAllUsers]=useState([]);
  const [showPicker,setShowPicker]=useState(false);
  const [groupUnread,setGroupUnread]=useState(0);

  const allowedRoles=DM_ALLOWED_MAP[currentUser.role]||[];

  useEffect(()=>fbOn('backstage/appUsers',data=>{
    if(data) setAllUsers(Object.values(data).filter(u=>u.id!==currentUser.id&&allowedRoles.includes(u.role)));
  }),[]);

  const eventId=activeEvent?.id;

  useEffect(()=>{
    return fbOn('backstage/dms',data=>{
      if(!data){setDmConvos([]);return;}
      const mine=Object.entries(data)
        .filter(([id])=>id.split('_').includes(currentUser.id))
        .map(([id,c])=>({...c,id}))
        .sort((a,b)=>(b.lastMessage?.timestamp||0)-(a.lastMessage?.timestamp||0));
      setDmConvos(mine);
    });
  },[currentUser.id]);

  useEffect(()=>{
    if(!eventId) return;
    return fbOn(`backstage/groupChat/${eventId}/unread/${currentUser.id}`,v=>setGroupUnread(v||0));
  },[eventId,currentUser.id]);

  if(!activeEvent) return <div className="p-8 text-center text-zinc-600 text-sm">{t('no_event')}</div>;

  const totalDmUnread=dmConvos.reduce((s,c)=>s+(c.unread?.[currentUser.id]||0),0);

  const startDM=user=>{
    const dmId=[currentUser.id,user.id].sort().join('_');
    const base=`backstage/dms/${dmId}`;
    fbSet(`${base}/participants/${currentUser.id}`,{name:currentUser.name,role:currentUser.role});
    fbSet(`${base}/participants/${user.id}`,{name:user.name,role:user.role});
    setShowPicker(false);
    setActiveConvo({type:'dm',dmId,otherUser:user});
    setDrawerOpen(false);
  };

  return (
    <div className="flex flex-col relative" style={{height:'calc(100vh - 56px)'}}>
      {/* Slide-out drawer */}
      <div className={`fixed inset-0 z-40 flex transition-all duration-300 ${drawerOpen?'':'pointer-events-none'}`}>
        <div className={`absolute inset-0 bg-black/60 transition-opacity duration-300 ${drawerOpen?'opacity-100':'opacity-0'}`} onClick={()=>setDrawerOpen(false)}/>
        <div className={`relative w-72 max-w-[82vw] h-full bg-zinc-900 border-r border-zinc-800 flex flex-col transition-transform duration-300 safe-top ${drawerOpen?'translate-x-0':'-translate-x-full'}`}>
          <div className="flex items-center justify-between px-4 pt-4 pb-3 border-b border-zinc-800">
            <span className="text-xs font-bold text-zinc-400 uppercase tracking-widest">Chats</span>
            <button onClick={()=>setDrawerOpen(false)} className="text-zinc-500 text-xl leading-none active:text-zinc-100 p-1">✕</button>
          </div>
          <div className="flex-1 overflow-y-auto py-1">
            {/* Group chat — staff only */}
            {isStaff&&(
            <button onClick={()=>{setActiveConvo({type:'group'});setDrawerOpen(false);fbSet(`backstage/groupChat/${eventId}/unread/${currentUser.id}`,0);setGroupUnread(0);}}
              className={`w-full flex items-center gap-3 px-4 py-3 text-left transition-all ${activeConvo.type==='group'?'bg-amber-500/10':''} active:bg-zinc-800/50`}>
              <div className="w-10 h-10 rounded-full bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-lg flex-shrink-0">💬</div>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-semibold text-zinc-100 truncate">{activeEvent.name}</div>
                <div className="text-xs text-zinc-500">Gruppen-Chat</div>
              </div>
              {groupUnread>0&&<span className="text-[10px] bg-amber-500 text-black font-black px-1.5 py-0.5 rounded-full flex-shrink-0">{groupUnread}</span>}
            </button>
            )}

            {/* DM section */}
            <div className="flex items-center justify-between px-4 py-2 mt-1">
              <span className="text-[10px] font-bold text-zinc-600 uppercase tracking-wider">{t('direct')}</span>
              <button onClick={()=>setShowPicker(true)} className="text-amber-400 text-xs font-bold active:opacity-70">{t('new_dm')}</button>
            </div>

            {dmConvos.length===0&&<div className="px-4 pb-3 text-xs text-zinc-600">{t('no_dms')}</div>}
            {dmConvos.map(c=>{
              const otherId=Object.keys(c.participants||{}).find(id=>id!==currentUser.id);
              const other=c.participants?.[otherId]||{};
              const unread=c.unread?.[currentUser.id]||0;
              const isActive=activeConvo.type==='dm'&&activeConvo.dmId===c.id;
              return (
                <button key={c.id} onClick={()=>{setActiveConvo({type:'dm',dmId:c.id,otherUser:{id:otherId,...other}});setDrawerOpen(false);}}
                  className={`w-full flex items-center gap-3 px-4 py-3 text-left transition-all ${isActive?'bg-amber-500/10':''} active:bg-zinc-800/50`}>
                  <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0 text-white ${ROLE_BG_COLOR[other.role]||'bg-zinc-700'}`}>
                    {initials(other.name||'?')}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between">
                      <span className="text-sm font-semibold text-zinc-100 truncate">{other.name||'Unbekannt'}</span>
                      {unread>0&&<span className="text-[10px] bg-amber-500 text-black font-black px-1.5 py-0.5 rounded-full flex-shrink-0 ml-2">{unread}</span>}
                    </div>
                    <div className="text-xs text-zinc-500 truncate">{c.lastMessage?.text||'…'}</div>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      </div>

      {/* New DM picker */}
      {showPicker&&(
        <div className="fixed inset-0 bg-black/75 z-50 flex items-end" onClick={()=>setShowPicker(false)}>
          <div className="w-full bg-zinc-900 rounded-t-3xl p-5 safe-bottom slide-up max-h-[75vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
            <div className="w-10 h-1 bg-zinc-700 rounded-full mx-auto mb-4"/>
            <div className="text-sm font-bold text-zinc-100 mb-3">Nachricht an…</div>
            {allUsers.length===0&&<div className="text-xs text-zinc-600 py-4 text-center">Keine Kontakte verfügbar</div>}
            {allUsers.map(u=>(
              <button key={u.id} onClick={()=>startDM(u)}
                className="w-full flex items-center gap-3 py-3 border-b border-zinc-800 last:border-0 active:bg-zinc-800/50 transition-all">
                <div className={`w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0 text-white ${ROLE_BG_COLOR[u.role]||'bg-zinc-700'}`}>
                  {initials(u.name||'?')}
                </div>
                <div className="text-left">
                  <div className="text-sm font-semibold text-zinc-100">{u.name}</div>
                  <div className="text-xs text-zinc-500">{ROLE_LABEL[u.role]||u.role}</div>
                </div>
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Main area */}
      {activeConvo.type==='group'&&(
        <GroupChatThread eventId={eventId} eventName={activeEvent.name} currentUser={currentUser}
          onOpenDrawer={()=>setDrawerOpen(true)} dmUnread={totalDmUnread}/>
      )}
      {activeConvo.type==='dm'&&(
        <DMThread currentUser={currentUser}
          dmId={activeConvo.dmId} otherUser={activeConvo.otherUser}
          onBack={()=>setActiveConvo({type:'dms'})}/>
      )}
      {activeConvo.type==='dms'&&(
        <div className="flex flex-col h-full">
          <div className="flex items-center justify-between px-4 pt-4 pb-3 border-b border-zinc-800">
            <span className="text-sm font-bold text-zinc-100">Direktnachrichten</span>
            <button onClick={()=>setShowPicker(true)} className="text-amber-400 text-xs font-bold bg-amber-500/10 px-3 py-1.5 rounded-full active:opacity-70">+ Neu</button>
          </div>
          <div className="flex-1 overflow-y-auto py-1">
            {dmConvos.length===0&&(
              <div className="flex flex-col items-center justify-center h-full text-zinc-600 gap-2 pb-8">
                <div className="text-4xl">💬</div>
                <div className="text-sm">Noch keine Nachrichten</div>
                <button onClick={()=>setShowPicker(true)} className="mt-2 text-xs text-amber-400 font-bold border border-amber-500/30 px-4 py-2 rounded-full active:opacity-70">Neue Nachricht starten</button>
              </div>
            )}
            {dmConvos.map(c=>{
              const otherId=Object.keys(c.participants||{}).find(id=>id!==currentUser.id);
              const other=c.participants?.[otherId]||{};
              const unread=c.unread?.[currentUser.id]||0;
              return (
                <button key={c.id} onClick={()=>setActiveConvo({type:'dm',dmId:c.id,otherUser:{id:otherId,...other}})}
                  className="w-full flex items-center gap-3 px-4 py-3 border-b border-zinc-800/50 text-left active:bg-zinc-800/50 transition-all">
                  <div className={`w-11 h-11 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0 text-white ${ROLE_BG_COLOR[other.role]||'bg-zinc-700'}`}>
                    {initials(other.name||'?')}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between mb-0.5">
                      <span className="text-sm font-semibold text-zinc-100 truncate">{other.name||'Unbekannt'}</span>
                      {unread>0&&<span className="text-[10px] bg-amber-500 text-black font-black px-1.5 py-0.5 rounded-full flex-shrink-0 ml-2">{unread}</span>}
                    </div>
                    <div className="text-xs text-zinc-500 truncate">{c.lastMessage?.text||'…'}</div>
                  </div>
                  <div className="text-zinc-600 text-lg">›</div>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function DMThread({currentUser,dmId,otherUser,onBack}){
  const [messages,setMessages]=useState([]);
  const [text,setText]=useState('');
  const bottomRef=useRef(null);
  const path=`backstage/dms/${dmId}/messages`;

  useEffect(()=>{
    fbSet(`backstage/dms/${dmId}/unread/${currentUser.id}`,0);
    return fbOn(path,data=>{
      if(!data){setMessages([]);return;}
      setMessages(Object.entries(data).map(([id,m])=>({...m,id})).sort((a,b)=>a.timestamp-b.timestamp));
    });
  },[dmId]);

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'});},[messages]);

  const send=()=>{
    if(!text.trim()) return;
    const msg={text:text.trim(),senderId:currentUser.id,senderName:currentUser.name,senderRole:currentUser.role,timestamp:Date.now()};
    fbPush(path,msg);
    fbSet(`backstage/dms/${dmId}/lastMessage`,msg);
    // Increment unread for other user
    fbOnce(`backstage/dms/${dmId}/unread/${otherUser.id}`).then(v=>
      fbSet(`backstage/dms/${dmId}/unread/${otherUser.id}`,(v||0)+1)
    );
    setText('');
  };

  const isMine=m=>m.senderId===currentUser.id;

  return (
    <div className="flex flex-col" style={{height:'calc(100vh - 180px)'}}>
      {/* Thread header */}
      <div className="flex items-center gap-3 px-4 py-3 border-b border-zinc-800 flex-shrink-0">
        <button onClick={onBack} className="text-zinc-400 text-2xl leading-none active:text-zinc-100 mr-1">‹</button>
        <div className={`w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0 text-white ${ROLE_BG_COLOR[otherUser.role]||'bg-zinc-700'}`}>
          {initials(otherUser.name||'?')}
        </div>
        <div>
          <div className="text-sm font-bold text-zinc-100">{otherUser.name}</div>
          <div className="text-xs text-zinc-500">{ROLE_LABEL[otherUser.role]||otherUser.role}</div>
        </div>
      </div>
      {/* Messages */}
      <div className="flex-1 overflow-y-auto px-4 py-3 space-y-2">
        {messages.length===0&&<div className="text-center text-zinc-700 text-xs py-8">Noch keine Nachrichten</div>}
        {messages.map(m=>(
          <div key={m.id} className={`flex ${isMine(m)?'justify-end':'justify-start'}`}>
            <div className={`max-w-[78%] px-3.5 py-2.5 rounded-2xl text-sm leading-relaxed
              ${isMine(m)?'bg-amber-500 text-black rounded-br-sm':'bg-zinc-800 text-zinc-100 rounded-bl-sm'}`}>
              {!isMine(m)&&<div className={`text-[10px] font-bold mb-1 ${ROLE_COLOR[m.senderRole]?.split(' ')[0]||'text-zinc-500'}`}>{m.senderName}</div>}
              {m.text}
              <div className={`text-[10px] mt-1 ${isMine(m)?'text-black/40':'text-zinc-600'}`}>
                {new Date(m.timestamp).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
              </div>
            </div>
          </div>
        ))}
        <div ref={bottomRef}/>
      </div>
      {/* Input */}
      <div className="flex gap-2 px-4 py-3 border-t border-zinc-800 safe-bottom flex-shrink-0">
        <input value={text} onChange={e=>setText(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&send()}
          placeholder="Nachricht…"
          className="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-600"/>
        <button onClick={send} disabled={!text.trim()}
          className="bg-amber-500 text-black font-bold px-4 rounded-xl disabled:opacity-30 active:scale-95 text-sm flex-shrink-0">→</button>
      </div>
    </div>
  );
}

function EventDetail({event,initialTab,onBack,currentUser,onSaveEvent,onDeleteEvent}) {
  const role=currentUser.role;
  const [tab,setTab]=useState(initialTab||'overview');
  const [editSection,setEditSection]=useState(null);
  const [editItem,setEditItem]=useState(null);
  const [confirmDelete,setConfirmDelete]=useState(false);
  const canEdit=['superadmin','admin','abendleitung'].includes(role);
  const canDelete=['superadmin','admin'].includes(role);

  const now=useClock();
  const timeStr=now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const dateStr=now.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'short'});

  const tx=useRef(0);
  useEffect(()=>{
    const ts=e=>{tx.current=e.touches[0].clientX;};
    const te=e=>{if(e.changedTouches[0].clientX-tx.current>80&&tx.current<60)onBack();};
    document.addEventListener('touchstart',ts,{passive:true});
    document.addEventListener('touchend',te,{passive:true});
    return()=>{document.removeEventListener('touchstart',ts);document.removeEventListener('touchend',te);};
  },[onBack]);

  const artists=event.artists||[];
  const pickups=event.pickups||[];
  const contacts=event.contacts||[];
  const info=event.info||[];
  const techInfo=event.techInfo||[];
  const staffSlots=event.staffSlots||[];
  const floors=event.floors?.length?event.floors:[...new Set(artists.map(a=>a.stage))];

  // Edit helpers
  const toggleEdit=sec=>setEditSection(editSection===sec?null:sec);
  const openItemEdit=(section,index,data)=>setEditItem({section,index,data:{...data}});
  const handleSaveItem=data=>{
    if(!editItem) return;
    const{section,index}=editItem;
    let updatedEvent={...event};

    if(section==='artists'){
      // Build clean artist object, extracting embedded pickup/contact fields
      const{pickup_time,pickup_from,pickup_fromAddr,pickup_to,pickup_toAddr,contact_phone,...artistCore}=data;
      // Attach contact inline on artist
      if(contact_phone) artistCore.contact=[{name:artistCore.name,phone:contact_phone}];
      const arr=[...(event.artists||[])];
      if(index===-1) arr.push({...artistCore,id:artistCore.id||('a'+Date.now())});
      else arr[index]={...arr[index],...artistCore};
      updatedEvent.artists=arr;
      // Also create/update a pickup entry if pickup_time provided
      if(pickup_time){
        const pickups=[...(event.pickups||[])];
        const pickupId='p_'+artistCore.name.replace(/\s+/g,'_').toLowerCase();
        const existing=pickups.findIndex(p=>p.id===pickupId||(p.artist===artistCore.name));
        const pickup={id:pickupId,time:pickup_time,artist:artistCore.name,label:'Pickup',
          from:pickup_from||'',fromAddr:pickup_fromAddr||'',to:pickup_to||'',toAddr:pickup_toAddr||'',done:false,
          statusKey:'pickup_erledigt'};
        if(existing>=0) pickups[existing]={...pickups[existing],...pickup};
        else pickups.push(pickup);
        updatedEvent.pickups=pickups;
      }
      // Also update event.contacts if contact_phone
      if(contact_phone){
        const contacts=[...(event.contacts||[])];
        const ci=contacts.findIndex(c=>c.name===artistCore.name||c.role===artistCore.name);
        const cEntry={name:artistCore.name,role:'Artist',phone:contact_phone};
        if(ci>=0) contacts[ci]={...contacts[ci],...cEntry};
        else contacts.push(cEntry);
        updatedEvent.contacts=contacts;
      }
    } else {
      const arr=[...(event[section]||[])];
      if(index===-1) arr.push({...data,id:data.id||('i'+Date.now())});
      else arr[index]={...arr[index],...data};
      updatedEvent[section]=arr;
    }
    onSaveEvent(updatedEvent);
    setEditItem(null);
  };
  const handleDeleteItem=(section,index)=>{
    const arr=[...(event[section]||[])];
    arr.splice(index,1);
    onSaveEvent({...event,[section]:arr});
  };

  const EditToggle=({sec})=>canEdit?(
    <button onClick={()=>toggleEdit(sec)}
      className={`text-xs font-semibold px-2.5 py-1.5 rounded-xl border transition-all ${editSection===sec?'bg-amber-500/10 border-amber-500/40 text-amber-400':'border-zinc-700/60 text-zinc-600'}`}>
      {editSection===sec?'✓ Fertig':'✏ Edit'}
    </button>
  ):null;

  const allTabs=[
    {id:'overview',label:'Überblick',icon:'◎',roles:['superadmin','admin','abendleitung','kasse','techniker']},
    {id:'lineup',label:'Lineup',icon:'🎧',roles:['superadmin','admin','abendleitung','techniker']},
    {id:'pickups',label:'Fahrer',icon:'🚗',roles:['superadmin','admin','abendleitung','fahrer']},
    {id:'map',label:'Karte',icon:'📍',roles:['superadmin','admin','abendleitung','fahrer']},
    {id:'contacts',label:'Kontakte',icon:'📞',roles:['superadmin','admin','abendleitung','kasse','techniker','fahrer']},
    {id:'info',label:'Info',icon:'📋',roles:['superadmin','admin','abendleitung','kasse','fahrer','techniker']},
    {id:'tech',label:'Technik',icon:'🔧',roles:['superadmin','admin','abendleitung','techniker']},
    {id:'einlass',label:'Einlass',icon:'🎟',roles:['superadmin','admin','abendleitung','kasse']},
    {id:'staff',label:'Personal',icon:'👥',roles:['superadmin','admin','abendleitung']},
  ];
  const tabs=allTabs.filter(t=>t.roles.includes(role));

  return (
    <div className="min-h-screen bg-zinc-950 flex flex-col slide-in">
      <div className={`bg-gradient-to-br ${event.color} safe-top pt-3 pb-4 px-4 relative overflow-hidden flex-shrink-0`}>
        <div className="absolute inset-0 bg-black/25"/>
        <div className="relative">
          <div className="flex items-center justify-between mb-2">
            <button onClick={onBack} className="flex items-center gap-1 text-white/80 text-sm active:text-white">
              <span className="text-xl">‹</span> Zurück
            </button>
            {canDelete&&(
              <button onClick={()=>setConfirmDelete(true)}
                className="text-xs text-red-300/80 bg-red-500/15 border border-red-500/30 px-3 py-1.5 rounded-xl font-semibold active:scale-95">
                🗑 Löschen
              </button>
            )}
          </div>
          <div className="flex items-center gap-2 mb-0.5"><StatusBadge status={event.status}/></div>
          <div className="text-2xl font-black text-white tracking-tight">{event.name}</div>
          <div className="text-white/70 text-xs">{event.subtitle} · {event.date}</div>
          {event.status==='active'&&(
            <div className="flex items-center gap-2 mt-2 bg-black/20 rounded-xl px-3 py-1.5">
              <span className="ldot"/><span className="text-white/90 mono text-sm font-bold">{timeStr}</span>
              <span className="text-white/50 text-xs">{dateStr}</span>
            </div>
          )}
        </div>
      </div>

      <div className="flex overflow-x-auto bg-zinc-900 border-b border-zinc-800 flex-shrink-0">
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>{setTab(t.id);setEditSection(null);}}
            className={`flex-shrink-0 px-3 py-3 text-[11px] font-semibold border-b-2 whitespace-nowrap transition-all relative ${tab===t.id?'border-amber-500 text-amber-400':'border-transparent text-zinc-500'}`}>
            {t.icon} {t.label}
          </button>
        ))}
      </div>

      <div className="flex-1 overflow-y-auto">

        {/* OVERVIEW */}
        {tab==='overview'&&(
          <div className="px-4 py-4 space-y-3 fade-in">
            <div className="grid grid-cols-3 gap-2">
              {[{l:'Artists',v:event.artistCount||artists.length,c:'text-amber-400'},{l:'Crew',v:event.crewCount||0,c:'text-violet-400'},{l:'Done',v:(event.checkPct||0)+'%',c:'text-emerald-400'}].map(s=>(
                <div key={s.l} className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-center">
                  <div className={`text-2xl font-black ${s.c}`}>{s.v}</div>
                  <div className="text-xs text-zinc-500 mt-0.5">{s.l}</div>
                </div>
              ))}
            </div>
            {floors.length>0&&(
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4">
                <div className="text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-2">Floors</div>

            <div className="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">

                    <button onClick={()=>openItemEdit('staff',i,s)} className="text-amber-400 text-sm bg-zinc-800 px-2 py-1 rounded-lg active:scale-95">✏</button>
                    <button onClick={()=>handleDeleteItem('staff',i)} className="text-red-400 text-sm bg-zinc-800 px-2 py-1 rounded-lg active:scale-95">🗑</button>
                  </div>
                ):(
                  s.assignee
                    ?<span className="text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-2.5 py-1 rounded-full">{s.assignee}</span>
                    :<span className="text-xs font-semibold text-red-400 bg-red-500/10 border border-red-500/30 px-2.5 py-1 rounded-full">Unbesetzt</span>
                )}

              <button onClick={()=>openItemEdit('staff',-1,{role:'',shifts:'',assignee:''})} className="w-full border border-dashed border-zinc-700 text-zinc-500 py-3 rounded-2xl text-sm active:scale-[.98]">+ Slot hinzufügen</button>
            )}

        )}

      </div>

      {editItem&&(
        <ItemEditModal section={editItem.section} item={editItem.data} onSave={handleSaveItem} onClose={()=>setEditItem(null)}/>
      )}

      {confirmDelete&&(
        <div className="fixed inset-0 bg-black/80 z-50 flex items-end" onClick={()=>setConfirmDelete(false)}>
          <div className="w-full bg-zinc-900 rounded-t-3xl p-6 safe-bottom slide-up" onClick={e=>e.stopPropagation()}>
            <div className="w-10 h-1 bg-zinc-700 rounded-full mx-auto mb-5"/>
            <div className="text-center mb-5">
              <div className="text-3xl mb-2">🗑</div>
              <div className="text-lg font-bold text-white">Event löschen?</div>
              <div className="text-sm text-zinc-400 mt-1">„{event.name}" wird unwiderruflich entfernt.</div>
            </div>
            <div className="flex gap-3">
              <button onClick={()=>setConfirmDelete(false)}
                className="flex-1 border border-zinc-700 text-zinc-400 font-semibold py-4 rounded-2xl text-sm active:scale-[.98]">
                Abbrechen
              </button>
              <button onClick={()=>{onDeleteEvent(event);onBack();}}
                className="flex-1 bg-red-500 text-white font-bold py-4 rounded-2xl text-sm active:scale-[.98]">
                Ja, löschen
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

  const FIELDS={
    contacts:[{k:'name',l:'Name',p:'Max Mustermann'},{k:'role',l:'Rolle / Funktion',p:'Artist / Fahrer …'},{k:'phone',l:'Telefon / Email',p:'+49 …'}],
    info:[{k:'title',l:'Titel',p:'Venue'},{k:'content',l:'Inhalt',p:'Junkyard Dortmund'},{k:'address',l:'Adresse (optional)',p:'Straße, PLZ Ort'}],
    tech:[{k:'floor',l:'Floor / Stage',p:'Mainstage'},{k:'equipment',l:'Equipment (mit · trennen)',p:'Pioneer DJM-A9 · 4× CDJ-3000',ml:true},{k:'notes',l:'Notizen / Line Check',p:'Line Check 13:00'}],
    staff:[{k:'role',l:'Position',p:'Abendleitung'},{k:'shifts',l:'Schicht',p:'20:00–06:00'},{k:'assignee',l:'Person',p:'Name'},{k:'phone',l:'Telefon *',p:'+49 ...'}],
    pickups:[{k:'time',l:'Uhrzeit',p:'16:00'},{k:'artist',l:'Artist',p:'Aerea'},{k:'label',l:'Label',p:'Pickup'},{k:'from',l:'Von (Name)',p:'NH Hotel'},{k:'fromAddr',l:'Von (Adresse)',p:'Heiliger Weg 66, Dortmund'},{k:'to',l:'Zu (Name)',p:'Junkyard'},{k:'toAddr',l:'Zu (Adresse)',p:'Schlägelstraße 57, Dortmund'}],
    artists:[
      {k:'name',l:'Artist Name *',p:'Name'},
      {k:'day',l:'Tag (Datum)',p:'Sa 18.07'},
      {k:'stage',l:'Floor / Stage',p:'Floor I Outdoor'},
      {k:'time',l:'Setzeit (HH:MM–HH:MM)',p:'22:00–00:00'},
      {k:'soundcheck',l:'Soundcheck (optional)',p:'13:00'},
      {k:'contact_phone',l:'Telefon Artist / Management',p:'+49 ...'},
      {k:'pickup_time',l:'Pickup Uhrzeit (opt.)',p:'18:00'},
      {k:'pickup_from',l:'Pickup Von (Ort)',p:'Hauptbahnhof'},
      {k:'pickup_fromAddr',l:'Pickup Von (Adresse)',p:'Str. 1, 44137 Dortmund'},
      {k:'pickup_to',l:'Pickup Zu (Ort)',p:'Junkyard'},
      {k:'pickup_toAddr',l:'Pickup Zu (Adresse)',p:'Schlägelstraße 57, Dortmund'},
      {k:'tech',l:'Technik',p:'A&H 96 · 4× CDJ-3000'},
      {k:'notes',l:'Notizen / Hinweise',p:'Hinweise für die Abendleitung'},
      {k:'rider',l:'Rider',p:'2x Wasser still\nRed Bull\n...',ml:true},
    ],
  };
  const fields=FIELDS[section]||[];
  const[form,setForm]=useState({...item});

  return (

        <div className="text-xl font-bold text-white mb-4">{item&&item[fields[0]?.k]?'Bearbeiten':'Hinzufügen'}</div>
        {fields.map(f=>(
          <div key={f.k} className="mb-3">
            <div className="text-xs text-zinc-500 mb-1.5">{f.l}</div>
            {f.ml
              ?<textarea value={form[f.k]||''} onChange={upd(f.k)} placeholder={f.p} rows={2} className={inp+' resize-none'}/>
              :<input value={form[f.k]||''} onChange={upd(f.k)} placeholder={f.p} className={inp}/>
            }
          </div>
        ))}
        <div className="flex gap-3 mt-2">
          <button onClick={onClose} className="flex-1 border border-zinc-700 text-zinc-400 font-semibold py-3.5 rounded-2xl text-sm">Abbrechen</button>
          <button onClick={()=>onSave(form)} className="flex-1 bg-amber-500 text-black font-bold py-3.5 rounded-2xl text-sm active:scale-[.98]">Speichern</button>
        </div>
      </div>
    </div>
  );
}
