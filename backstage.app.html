/* ══ TRAVEL · AN- & ABREISE ══════════════════════════════════════════ */
const MODES=['Royal Transfer','Eigener Fahrer','Zu Fuß','Taxi','Eigene Anreise (Auto)','Eigene Abreise (Auto)','Flug','Bahn','offen'];
/* Wer fährt? Entscheidet, ob die Fahrt bei unseren Fahrern auftaucht. */
const BY={
  own:   {l:'Über uns',    ic:'🚐', c:'#3b82f6', hint:'Steht in der Fahrtenliste unserer Fahrer'},
  extern:{l:'Extern',      ic:'🚕', c:'#f59e0b', hint:'Taxi, Uber, Fahrservice — wir fahren nicht'},
  self:  {l:'Reist selbst',ic:'🚶', c:'#71717a', hint:'Zu Fuß, eigenes Auto, Bahn — nichts zu tun'},
};
const MODE_OPTS={
  own:   ['Eigener Fahrer','Shuttle','offen'],
  extern:['Royal Transfer','Taxi','Uber','Fahrservice','Hotel-Shuttle','offen'],
  self:  ['Zu Fuß','Eigenes Auto','Bahn','Flug','offen'],
};
/* Altbestand ohne Feld „by" sinnvoll einordnen */
const byFromMode=m=>/eigener fahrer|shuttle/i.test(m||'')?'own'
  :/royal|taxi|uber|fahrservice|transfer/i.test(m||'')?'extern':'self';
const travelBy=t=>t?.by||byFromMode(t?.mode);
function Travel({ev,base,editable}){
  const [dir,setDir]=useState('in');
  const [day,setDay]=useState('ALL');
  const [edit,setEdit]=useState(null);
  const all=obj2arr(ev.travel);
  const rows=all.filter(t=>t.dir===dir)
    .filter(t=>day==='ALL'||t.day===day)
    .sort((a,b)=>(a.day||'').localeCompare(b.day||'')||toMins(a.time)-toMins(b.time)||(a.artist||'').localeCompare(b.artist||''));
  const dayChips=[...new Set(all.filter(t=>t.dir===dir).map(t=>t.day))].sort();
  const needsDriver=all.filter(t=>t.dir===dir&&travelBy(t)==='own').length;
  const openN=rows.filter(t=>!t.done).length;
  const upd=(id,p)=>fbUpd(`${base}/travel/${id}`,p);
  useEffect(()=>setDay('ALL'),[dir]);

  return(
    <div className="pb-24 pt-4">
      <div className="px-4 flex gap-2 mb-3">
        {[{id:'in',l:'ANREISE',ic:'↓'},{id:'out',l:'ABREISE',ic:'↑'}].map(d=>(
          <button key={d.id} onClick={()=>setDir(d.id)}
            className={`flex-1 py-2.5 rounded-lg mono text-xs font-bold border transition-all active:scale-[.98]
              ${dir===d.id?'bg-amber-500/10 border-amber-500/40 text-amber-400':'bg-zinc-900 border-zinc-800 text-zinc-500'}`}>
            {d.ic} {d.l}</button>))}
      </div>
      {dayChips.length>1&&(
        <div className="px-4 flex gap-1.5 mb-3 overflow-x-auto">
          <button onClick={()=>setDay('ALL')}
            className={`flex-shrink-0 px-3 py-1.5 rounded-lg mono text-[11px] font-bold border ${day==='ALL'?'text-zinc-100 border-zinc-500 bg-zinc-800':'text-zinc-600 border-zinc-800 bg-zinc-900'}`}>Alle</button>
          {dayChips.map(d=>(
            <button key={d} onClick={()=>setDay(d)}
              className={`flex-shrink-0 px-3 py-1.5 rounded-lg mono text-[11px] font-bold border ${day===d?'text-amber-400 border-amber-500/40 bg-amber-500/10':'text-zinc-600 border-zinc-800 bg-zinc-900'}`}>{d}</button>))}
        </div>
      )}
      <div className="px-4">
        <SectionLabel right={<span className="mono text-[10px] text-zinc-600">{openN} offen · 🚐 {needsDriver} über uns</span>}>
          {rows.length} {dir==='in'?'Ankünfte':'Abfahrten'}</SectionLabel>
        <div className="space-y-2">
          {rows.length===0&&(
            <Empty>Noch keine {dir==='in'?'Anreisen':'Abreisen'} eingetragen.
              {editable&&'\nMit + unten hinzufügen.'}</Empty>)}
          {rows.map(t=>{
            const by=travelBy(t), B=BY[by];
            const drive=by==='own';
            return(
              <div key={t.id} className={`rounded-xl border transition-all
                ${t.done?'border-zinc-800/40 bg-zinc-900/25 opacity-45':drive?'border-blue-500/25 bg-blue-950/15':'border-zinc-800 bg-zinc-900/55'}`}>
                <div className="flex gap-3 px-3.5 py-3">
                  <Check checked={!!t.done} onToggle={()=>upd(t.id,{done:!t.done,doneAt:!t.done?Date.now():null})}/>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className={`mono text-sm font-bold truncate ${t.done?'text-zinc-600 line-through':'text-zinc-100'}`}>{t.artist}</span>
                      <span className="mono text-[9px] px-1.5 py-0.5 rounded border"
                        style={{color:B.c,borderColor:B.c+'55',background:B.c+'14'}}>{B.ic} {B.l}</span>
                      {t.mode&&<span className="mono text-[9px] text-zinc-500">{t.mode}</span>}
                      <span className="mono text-[10px] text-zinc-600">{t.day}</span>
                      {editable&&<button onClick={()=>setEdit(t)} className="ml-auto text-zinc-600 text-xs px-1 active:text-amber-400">✎</button>}
                    </div>
                    {/* Route */}
                    <div className="flex items-center gap-1.5 mt-2 mono text-[11px]">
                      <span className="text-zinc-400 truncate">{t.from||'—'}</span>
                      <span className="text-amber-500 flex-shrink-0">→</span>
                      <span className="text-zinc-100 font-semibold truncate">{t.to||'—'}</span>
                      <span className="flex-shrink-0 ml-auto">

/* ══ ABENDKASSE ══════════════════════════════════════════════════════ */
const eur=n=>(Number(n)||0).toFixed(2).replace('.',',')+' €';
/* Klicker nur für Abendkasse. Friendslist wird über die Namensliste abgerechnet. */
const CNT=[
  {k:'ecNorm', l:'EC',  pay:'ec',  c:'#60a5fa'},
  {k:'barNorm',l:'Bar', pay:'bar', c:'#34d399'},
];
const blockSum=b=>{
  const c=b.counts||{};
  const p=Number(b.price)||0;
  const ec=(Number(c.ecNorm)||0)*p;
  const bar=(Number(c.barNorm)||0)*p;
  const people=(Number(c.ecNorm)||0)+(Number(c.barNorm)||0);
  return{ec,bar,total:ec+bar,people};
};
/* Einnahmen aus der Friendslist — aus den abgehakten Einträgen */
const friendsTotals=ev=>{
  let ec=0,bar=0,people=0,free=0,count=0;
  obj2arr(ev.friendslist).forEach(g=>{
    if(!g.checkedIn)return;
    const qty=Number(g.qty)||1;
    people+=qty;count++;
    if(g.pay==='ec')ec+=Number(g.amount)||0;
    else if(g.pay==='bar')bar+=Number(g.amount)||0;
    else free+=qty;
  });
  return{ec,bar,total:ec+bar,people,free,count};
};
const kasseTotals=ev=>{
  const blocks=obj2arr(ev.kasse?.blocks);
  let ec=0,bar=0,people=0;
  blocks.forEach(b=>{const s=blockSum(b);ec+=s.ec;bar+=s.bar;people+=s.people;});
  const fr=friendsTotals(ev);
  const payouts=obj2arr(ev.kasse?.payouts);
  const out=payouts.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const tEc=ec+fr.ec, tBar=bar+fr.bar, total=tEc+tBar;
  return{blocks,payouts,fr,kasseEc:ec,kasseBar:bar,kassePeople:people,
    ec:tEc,bar:tBar,total,people:people+fr.people,out,cash:tBar-out,net:total-out};
};

                <button onClick={()=>fbInc(`${base}/kasse/blocks/${active.id}/counts/${x.k}`,1)}

                  style={{background:x.c}}>+</button>

            </div>);

      </div>

      {/* Friendslist läuft über die Namensliste */}
      <div className="rounded-xl border border-violet-500/30 bg-violet-500/[.06] px-4 py-3 mb-4">

function ClosedBlocks({blocks,base,hasActive}){

  return(
    <div>
      <SectionLabel right={<span className="mono text-[9px] text-zinc-700">antippen zum Korrigieren</span>}>
        Abgeschlossene Preisblöcke</SectionLabel>
      <div className="space-y-2">
        {done.map(b=>{const s=blockSum(b);
          return(
            <button key={b.id} onClick={()=>setEdit(b)}
              className="w-full text-left rounded-xl border border-zinc-800 bg-zinc-900/40 px-3.5 py-2.5 active:bg-zinc-900">
              <div className="flex items-center gap-2">

                <div className="mono text-sm font-bold text-zinc-200">{eur(s.total)}</div>
                <span className="text-zinc-700 text-xs">✎</span>

}
/* Nachträglich korrigieren: Preis, Bezeichnung, Zählerstände */
function BlockEdit({b,base,hasActive,onClose}){
  const [f,setF]=useState({});
  useEffect(()=>{ if(b)setF({label:b.label||'',price:String(b.price??''),friendsPrice:String(b.friendsPrice??''),
    ecNorm:String(b.counts?.ecNorm??0),barNorm:String(b.counts?.barNorm??0)}); },[b]);
  if(!b)return null;
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const preview=blockSum({price:Number(f.price)||0,counts:{ecNorm:Number(f.ecNorm)||0,barNorm:Number(f.barNorm)||0}});
  const save=()=>{
    fbUpd(`${base}/kasse/blocks/${b.id}`,{
      label:f.label.trim()||b.label,
      price:Number(f.price)||0,
      friendsPrice:Number(f.friendsPrice)||0,
      counts:{ecNorm:Math.max(0,Number(f.ecNorm)||0),barNorm:Math.max(0,Number(f.barNorm)||0)},
      editedAt:Date.now()});
    onClose();
  };
  const Stepper=({label,k,color})=>(
    <div className="rounded-xl border bg-zinc-900/70 p-2.5 min-w-0" style={{borderColor:color+'44'}}>
      <div className="mono text-[11px] font-bold mb-2" style={{color}}>{label}</div>
      <input value={f[k]} onChange={e=>set(k,e.target.value.replace(/\D/g,''))} inputMode="numeric"
        className="w-full bg-zinc-800 border border-zinc-700 text-white bebas text-3xl text-center py-1.5 rounded-lg mb-2"/>
      <div className="flex gap-2">
        <button onClick={()=>set(k,String(Math.max(0,(Number(f[k])||0)-1)))}
          className="flex-1 h-10 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-300 text-xl leading-none active:bg-zinc-700">−</button>
        <button onClick={()=>set(k,String((Number(f[k])||0)+1))}
          className="flex-1 h-10 rounded-lg text-black text-xl leading-none font-bold active:scale-95"
          style={{background:color}}>+</button>
      </div>
    </div>);
  return(
    <Sheet open={!!b} onClose={onClose} title="Preisblock korrigieren"
      onDelete={()=>{if(confirm(`Block „${b.label}" mit allen Zählerständen löschen?`)){fbDel(`${base}/kasse/blocks/${b.id}`);onClose();}}}>
      <div className="space-y-3">
        <div className="mono text-[10px] text-zinc-500 leading-relaxed">
          {new Date(b.startedAt).toLocaleString('de-DE')} – {new Date(b.closedAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr
          {b.editedAt&&<span className="block text-amber-500/70">zuletzt korrigiert {new Date(b.editedAt).toLocaleString('de-DE')}</span>}
        </div>
        <Field label="Bezeichnung" value={f.label} onChange={v=>set('label',v)}/>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Eintritt normal" value={f.price} onChange={v=>set('price',v)} type="number"/>
          <Field label="Friendslist" value={f.friendsPrice} onChange={v=>set('friendsPrice',v)} type="number"/>
        </div>
        <div className="mono text-[10px] text-zinc-500 uppercase tracking-wider pt-1">Zählerstände</div>
        <div className="grid grid-cols-2 gap-2.5">
          <Stepper label="EC" k="ecNorm" color="#60a5fa"/>
          <Stepper label="Bar" k="barNorm" color="#34d399"/>
        </div>
        <div className="rounded-xl border border-zinc-800 bg-zinc-900/70 px-4 py-3 flex justify-between items-baseline">
          <span className="mono text-[11px] text-zinc-400">neue Summe · {preview.people} Gäste</span>
          <span className="bebas text-2xl text-emerald-400">{eur(preview.total)}</span>
        </div>
        <button onClick={save}
          className="w-full bg-amber-500 text-black bebas text-xl py-3 rounded-xl tracking-widest active:scale-[.98]">SPEICHERN</button>
        {!hasActive&&(
          <button onClick={()=>{fbUpd(`${base}/kasse/blocks/${b.id}`,{closedAt:null});onClose();}}
            className="w-full border border-zinc-700 text-zinc-400 mono text-xs py-2.5 rounded-xl active:bg-zinc-900">
            Block wieder öffnen und weiterzählen</button>)}
        <div className="mono text-[9px] text-zinc-600 leading-relaxed">
          Die Friendslist wird nicht über diese Zähler abgerechnet — dort korrigierst du direkt beim Gast im Tab GÄSTE.
        </div>
      </div>
    </Sheet>
  );
}

  const list=obj2arr(ev.kasse?.payouts).sort((a,b)=>(b.at||0)-(a.at||0));
  const sum=list.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const add=()=>{
    if(!f.label.trim()||!(Number(f.amount)>0))return;
    fbPush(`${base}/kasse/payouts`,{label:f.label.trim(),amount:Number(f.amount),
      note:f.note.trim(),by:me?.name||me?.email||'Einlass',at:Date.now()});
    setF({label:'',amount:'',note:''});
  };
  return(
    <div className="px-4 pt-4 pb-24">
      <div className="rounded-xl border border-red-500/25 bg-red-500/[.06] px-4 py-3 mb-4 flex items-center">
        <div className="flex-1">
          <div className="mono text-[9px] text-red-400/80 uppercase tracking-[.18em]">Aus der Kasse gezahlt</div>
          <div className="mono text-[10px] text-zinc-600 mt-0.5">{list.length} Belege</div>
        </div>
        <div className="bebas text-3xl text-red-400 leading-none">−{eur(sum)}</div>
      </div>

      <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-3 mb-4 space-y-2">
        <div className="mono text-[10px] text-zinc-500 uppercase tracking-wider">Neue Auszahlung</div>
        <div className="flex gap-2">
          <input value={f.label} onChange={e=>setF(p=>({...p,label:e.target.value}))} placeholder="Wofür? z. B. Security"
            className="flex-1 bg-zinc-800 border border-zinc-700 text-white mono text-sm px-3 py-2.5 rounded-lg focus:border-amber-500 placeholder-zinc-600"/>
          <input value={f.amount} onChange={e=>setF(p=>({...p,amount:e.target.value}))} placeholder="0,00" type="number" inputMode="decimal"
            className="w-24 bg-zinc-800 border border-zinc-700 text-white mono text-sm px-3 py-2.5 rounded-lg focus:border-amber-500 placeholder-zinc-600 text-right"/>
        </div>
        <div className="flex gap-2">
          <input value={f.note} onChange={e=>setF(p=>({...p,note:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&add()}
            placeholder="Belegnummer / Notiz (optional)"
            className="flex-1 bg-zinc-800 border border-zinc-700 text-white mono text-xs px-3 py-2.5 rounded-lg focus:border-amber-500 placeholder-zinc-600"/>
          <button onClick={add} className="bg-amber-500 text-black mono text-xs font-bold px-5 rounded-lg active:scale-95">+</button>
        </div>
      </div>

      <SectionLabel>Belege</SectionLabel>
      <div className="space-y-2">
        {list.length===0&&<Empty>Noch keine Auszahlungen.</Empty>}
        {list.map(p=>(
          <div key={p.id} className="rounded-xl border border-zinc-800 bg-zinc-900/60 px-3.5 py-3 flex items-start gap-3">
            <div className="flex-1 min-w-0">
              <div className="mono text-[13px] font-bold text-zinc-100 truncate">{p.label}</div>
              {p.note&&<div className="mono text-[10px] text-zinc-500 truncate">{p.note}</div>}
              <div className="mono text-[9px] text-zinc-600 mt-0.5">
                {p.by} · {p.at?new Date(p.at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''} Uhr</div>
            </div>
            <div className="mono text-sm font-bold text-red-400 flex-shrink-0">−{eur(p.amount)}</div>
            <button onClick={()=>{if(confirm(`"${p.label}" löschen?`))fbDel(`${base}/kasse/payouts/${p.id}`);}}
              className="text-zinc-700 mono text-xs active:text-red-400 flex-shrink-0">✕</button>
          </div>))}
      </div>
    </div>
  );
}

/* ══ ABRECHNUNG ══════════════════════════════════════════════════════ */
function Abrechnung({ev,base,me,role}){
  const meta=ev.meta||{};
  const t=kasseTotals(ev);
  const canConfirm=role==='leitung'||role==='superadmin';
  const guests=obj2arr(ev.guestlist).filter(g=>g.checkedIn).length;
  const friends=obj2arr(ev.friendslist).filter(g=>g.checkedIn).length;

  /* Versandhistorie — jeder Versand bleibt erhalten */
  const sent=obj2arr(ev.kasse?.settlements).sort((a,b)=>(a.confirmedAt||0)-(b.confirmedAt||0));
  const legacy=ev.kasse?.settlement;
  const history=sent.length?sent:(legacy?[{id:'alt',...legacy,no:1}]:[]);
  const last=history.length?history[history.length-1]:null;

  /* Hat sich seit dem letzten Versand etwas geändert? */
  const FIELDS=[['total','Einnahmen'],['ec','EC'],['bar','Bar'],['out','Auszahlungen'],
                ['cash','Bargeld'],['people','Gäste']];
  const diffs=last?FIELDS.map(([k,l])=>({k,l,alt:Number(last[k])||0,neu:Number(t[k])||0}))
    .filter(d=>Math.abs(d.alt-d.neu)>0.001):[];
  const changed=diffs.length>0;

  const nextNo=history.length+1;
  const text=useMemo(()=>{
    const L=[];
    L.push(`ABRECHNUNG — ${meta.name||'Event'}`);
    L.push(`${meta.date||''} · ${meta.city||''}`);
    if(last){
      L.push('');
      L.push(`*** KORRIGIERTE FASSUNG Nr. ${nextNo} ***`);
      L.push(`Ersetzt die Abrechnung vom ${new Date(last.confirmedAt).toLocaleString('de-DE')}.`);
      if(diffs.length){
        L.push('Geändert hat sich:');
        diffs.forEach(d=>L.push(`  ${d.l}: ${d.k==='people'?d.alt:eur(d.alt)} → ${d.k==='people'?d.neu:eur(d.neu)}`));
      }
    }
    L.push('');
    L.push('ABENDKASSE (Klicker)');
    t.blocks.forEach(b=>{const s=blockSum(b);const cc=b.counts||{};
      L.push(`  ${b.label} — ${eur(b.price)} p. P.`);
      L.push(`    EC  ${cc.ecNorm||0} × = ${eur(s.ec)}`);
      L.push(`    Bar ${cc.barNorm||0} × = ${eur(s.bar)}`);
      L.push(`    Summe ${eur(s.total)} · ${s.people} Gäste`);});
    L.push(`  Abendkasse gesamt  ${eur(t.kasseEc+t.kasseBar)} · ${t.kassePeople} Gäste`);
    L.push('');
    L.push('FRIENDSLIST (Namensliste)');
    L.push(`  EC   ${eur(t.fr.ec)}`);
    L.push(`  Bar  ${eur(t.fr.bar)}`);
    L.push(`  Summe ${eur(t.fr.total)} · ${t.fr.people} Personen auf ${t.fr.count} Einträgen`);
    if(t.fr.free)L.push(`  davon frei: ${t.fr.free} Personen`);
    L.push('');
    L.push(`EINNAHMEN EC    ${eur(t.ec)}`);
    L.push(`EINNAHMEN BAR   ${eur(t.bar)}`);
    L.push(`GESAMT          ${eur(t.total)}`);
    L.push(`Zahlende Gäste  ${t.people}`);
    L.push('');
    L.push('AUSZAHLUNGEN');
    if(!t.payouts.length)L.push('  keine');
    t.payouts.forEach(p=>L.push(`  ${p.label}${p.note?' ('+p.note+')':''}  −${eur(p.amount)}  [${p.by}]`));
    L.push(`  Summe        −${eur(t.out)}`);
    L.push('');
    L.push(`BARGELD ZUR ÜBERGABE  ${eur(t.cash)}`);
    L.push(`NETTO GESAMT          ${eur(t.net)}`);
    L.push('');
    L.push(`Eingecheckt: Gästeliste ${guests} · Friendslist ${friends}`);
    L.push('');
    L.push(`Bestätigt von ${me?.name||me?.email||''} am ${new Date().toLocaleString('de-DE')}`);
    if(last)L.push(`Fassung Nr. ${nextNo}`);
    return L.join('\n');
  },[JSON.stringify([ev.kasse,meta,guests,friends,last?.confirmedAt])]);

  const confirmSend=()=>{
    const to=(meta.settleEmail||'').trim();
    if(!to){alert('Es ist keine Empfängeradresse hinterlegt.\n\nDie Leitung trägt sie unter EVENT → Abrechnung ein.');return;}
    const now=Date.now();
    fbSet(`${base}/kasse/settlements/s${now}`,{no:nextNo,confirmedBy:me?.name||me?.email||'',
      confirmedAt:now,sentTo:to,ec:t.ec,bar:t.bar,total:t.total,out:t.out,cash:t.cash,
      net:t.net,people:t.people,text,
      corrects:last?(last.no||1):null});
    const subj=`${last?`Abrechnung KORRIGIERT (Nr. ${nextNo})`:'Abrechnung'} ${meta.name||'Event'} — ${meta.date||''}`;
    window.location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(text)}`;
  };

  const Row=({l,v,strong,neg})=>(
    <div className={`flex justify-between items-baseline ${strong?'border-t border-zinc-800 pt-2 mt-2':''}`}>
      <span className={`mono ${strong?'text-[12px] text-zinc-200':'text-[11px] text-zinc-500'}`}>{l}</span>
      <span className={strong?`bebas text-2xl ${neg?'text-red-400':'text-emerald-400'}`:`mono text-[12px] ${neg?'text-red-400':'text-zinc-300'}`}>
        {neg?'−':''}{eur(v)}</span>
    </div>);

  return(
    <div className="px-4 pt-4 pb-24">
      {last&&!changed&&(
        <div className="rounded-xl border border-emerald-500/40 bg-emerald-500/10 px-4 py-3 mb-4">
          <div className="mono text-[11px] text-emerald-200 leading-relaxed">
            ✓ Abrechnung verschickt{history.length>1?` (Fassung ${last.no||history.length})`:''}<br/>
            <span className="text-emerald-200/70">{last.confirmedBy} · {new Date(last.confirmedAt).toLocaleString('de-DE')} · an {last.sentTo}</span><br/>
            <span className="text-emerald-200/70">Stimmt mit den aktuellen Zahlen überein.</span></div>
        </div>)}

      {last&&changed&&(
        <div className="rounded-xl border border-amber-500/50 bg-amber-500/10 px-4 py-3 mb-4">
          <div className="mono text-[12px] text-amber-200 font-bold mb-1.5">
            ⚠️ Zahlen haben sich seit dem Versand geändert</div>
          <div className="mono text-[10px] text-zinc-400 mb-2">
            Verschickt {new Date(last.confirmedAt).toLocaleString('de-DE')} von {last.confirmedBy}.
            Die Empfängerin hat noch die alten Zahlen.</div>
          <div className="space-y-0.5">
            {diffs.map(d=>(
              <div key={d.k} className="flex justify-between mono text-[11px]">
                <span className="text-zinc-400">{d.l}</span>
                <span>
                  <span className="text-zinc-600 line-through">{d.k==='people'?d.alt:eur(d.alt)}</span>
                  <span className="text-amber-300 font-bold"> → {d.k==='people'?d.neu:eur(d.neu)}</span>
                </span>
              </div>))}
          </div>
          <div className="mono text-[10px] text-amber-300/80 mt-2 leading-relaxed">
            Schick die Abrechnung nochmal — sie geht als korrigierte Fassung Nr. {nextNo} raus,
            mit einer Auflistung, was sich geändert hat.</div>
        </div>)}

      <SectionLabel>Abendkasse</SectionLabel>
      <div className="rounded-xl border border-zinc-800 bg-zinc-900/60 px-4 py-3 mb-3">
        <Row l="EC" v={t.kasseEc}/>
        <Row l="Bar" v={t.kasseBar}/>
        <div className="mono text-[10px] text-zinc-600 mt-1">
          {t.kassePeople} Gäste in {t.blocks.length} Preisblock{t.blocks.length===1?'':'en'}</div>
      </div>

      <SectionLabel>Friendslist</SectionLabel>
      <div className="rounded-xl border border-violet-500/25 bg-violet-500/[.05] px-4 py-3 mb-3">
        <Row l="EC" v={t.fr.ec}/>
        <Row l="Bar" v={t.fr.bar}/>
        <div className="mono text-[10px] text-zinc-600 mt-1">
          {t.fr.people} Personen auf {t.fr.count} Einträgen{t.fr.free?` · ${t.fr.free} frei`:''}</div>
      </div>

      <SectionLabel>Einnahmen gesamt</SectionLabel>
      <div className="rounded-xl border border-zinc-800 bg-zinc-900/60 px-4 py-3 mb-4">
        <Row l="EC-Zahlungen" v={t.ec}/>
        <Row l="Barzahlungen" v={t.bar}/>
        <div className="mono text-[10px] text-zinc-600 mt-1">{t.people} zahlende Gäste</div>
        <Row l="Einnahmen gesamt" v={t.total} strong/>
      </div>

      <SectionLabel>Auszahlungen</SectionLabel>
      <div className="rounded-xl border border-zinc-800 bg-zinc-900/60 px-4 py-3 mb-4">
        {t.payouts.length===0&&<div className="mono text-[11px] text-zinc-600">keine</div>}
        {t.payouts.map(p=>(
          <div key={p.id} className="flex justify-between mono text-[11px] mb-1">
            <span className="text-zinc-500 truncate pr-2">{p.label}</span>
            <span className="text-red-400 flex-shrink-0">−{eur(p.amount)}</span></div>))}
        <Row l="Auszahlungen gesamt" v={t.out} strong neg/>
      </div>

      <SectionLabel>Ergebnis</SectionLabel>
      <div className="rounded-xl border border-amber-500/30 bg-amber-500/[.07] px-4 py-3.5 mb-4">
        <div className="flex justify-between items-baseline mb-2">
          <span className="mono text-[12px] text-zinc-200">Bargeld zur Übergabe</span>
          <span className="bebas text-3xl text-amber-400">{eur(t.cash)}</span></div>
        <div className="mono text-[10px] text-zinc-500 leading-relaxed mb-2">
          Barzahlungen minus Auszahlungen — dieser Betrag muss in der Kasse liegen.</div>
        <div className="flex justify-between items-baseline border-t border-amber-500/20 pt-2">
          <span className="mono text-[11px] text-zinc-400">Netto gesamt (EC + Bar − Auszahlungen)</span>
          <span className="mono text-sm font-bold text-zinc-100">{eur(t.net)}</span></div>
      </div>

      <details className="mb-4">
        <summary className="mono text-[11px] text-zinc-500 py-2 cursor-pointer">Vollständige Abrechnung ansehen</summary>
        <pre className="bg-zinc-900 border border-zinc-800 rounded-xl p-3 mono text-[10px] text-zinc-300 overflow-x-auto whitespace-pre-wrap leading-relaxed mt-1">{text}</pre>
      </details>

      {canConfirm?(
        <div className="space-y-2">
          <div className="mono text-[10px] text-zinc-500 leading-relaxed">
            Empfänger: <span className="text-zinc-300">{meta.settleEmail||'— noch keiner hinterlegt —'}</span>
          </div>
          <button onClick={confirmSend}
            className={`w-full bebas text-xl py-3.5 rounded-xl tracking-widest active:scale-[.98]
              ${changed?'bg-amber-500 text-black':'bg-emerald-500 text-black'}`}>
            {!last?'BESTÄTIGEN & SENDEN'
              :changed?`KORRIGIERTE FASSUNG ${nextNo} SENDEN`
              :'NOCHMAL SENDEN'}</button>
          <button onClick={()=>navigator.clipboard?.writeText(text)}
            className="w-full border border-zinc-700 text-zinc-400 mono text-xs py-2.5 rounded-xl active:bg-zinc-900">
            Abrechnung kopieren</button>
          <div className="mono text-[10px] text-zinc-600 leading-relaxed pt-1">
            Beim Bestätigen wird die Abrechnung gespeichert und dein Mailprogramm mit fertiger Nachricht geöffnet — du musst dort nur noch auf Senden tippen.
            Jeder Versand bleibt gespeichert, du kannst also jederzeit korrigieren und neu schicken.</div>

          {history.length>0&&(
            <details className="pt-2">
              <summary className="mono text-[11px] text-zinc-500 py-1.5 cursor-pointer">
                Versandverlauf ({history.length})</summary>
              <div className="space-y-1.5 mt-1.5">
                {[...history].reverse().map((h,i)=>(
                  <div key={h.id} className="rounded-lg border border-zinc-800 bg-zinc-900/50 px-3 py-2">
                    <div className="flex justify-between items-baseline">
                      <span className="mono text-[11px] text-zinc-300">
                        Fassung {h.no||history.length-i}{h.corrects?` (Korrektur von ${h.corrects})`:''}</span>
                      <span className="mono text-[11px] text-zinc-400">{eur(h.total)}</span>
                    </div>
                    <div className="mono text-[9px] text-zinc-600">
                      {h.confirmedBy} · {new Date(h.confirmedAt).toLocaleString('de-DE')}</div>
                  </div>))}
              </div>
            </details>)}
        </div>
      ):(
        <div className="rounded-xl border border-zinc-800 bg-zinc-900/40 px-4 py-3 mono text-[11px] text-zinc-500 leading-relaxed">
          {changed
            ?<>Du hast nach dem Versand noch etwas korrigiert. Sag der Abendleitung Bescheid, damit sie die Abrechnung nochmal schickt.</>
            :<>Die Abendleitung bestätigt und verschickt die Abrechnung. Zähl in Ruhe fertig — hier siehst du jederzeit den Stand.</>}
        </div>)}
    </div>
  );
}

/* ══ KONTAKTE · als Kontaktkarte (.vcf) speicherbar ══════════════════ */
const telClean=p=>String(p||'').replace(/[^\d+]/g,'');
const vcard=(c,evName)=>{
  const parts=String(c.name||'').trim().split(/\s+/);
  const last=parts.length>1?parts.pop():'';
  const first=parts.join(' ');
  return['BEGIN:VCARD','VERSION:3.0',
    `N:${last};${first};;;`,
    `FN:${(c.name||'').replace(/[,;]/g,' ')}`,
    c.org?`ORG:${c.org.replace(/[,;]/g,' ')}`:'',
    c.title?`TITLE:${c.title.replace(/[,;]/g,' ')}`:'',
    c.phone?`TEL;TYPE=CELL:${telClean(c.phone)}`:'',
    c.email?`EMAIL:${c.email}`:'',
    `NOTE:${[evName,c.note].filter(Boolean).join(' · ').replace(/[,;]/g,' ')}`,
    'END:VCARD'].filter(Boolean).join('\r\n');
};
const dlFile=(text,filename,mime)=>{
  try{
    const blob=new Blob([text],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
  }catch(e){ console.error(e); alert('Download nicht möglich: '+(e.message||e)); }
};

function Contacts({ev,base,editable}){
  const meta=ev.meta||{};
  const [q,setQ]=useState('');
  const [add,setAdd]=useState(false);
  const [nf,setNf]=useState({name:'',phone:'',org:'',note:''});

  const people=useMemo(()=>{
    const out=[];const seen=new Map();
    const push=c=>{
      if(!c.name&&!c.phone)return;
      const key=telClean(c.phone)||('n:'+(c.name||'').toLowerCase());
      if(seen.has(key)){
        const ex=seen.get(key);
        if(c.title&&!ex.tags.includes(c.title))ex.tags.push(c.title);
        return;
      }
      const rec={...c,tags:c.title?[c.title]:[]};
      seen.set(key,rec);out.push(rec);
    };
    obj2arr(ev.artists).forEach(a=>{
      if(a.contactPhone||a.contactName)
        push({name:a.contactName||a.name,phone:a.contactPhone,org:meta.name||'',
          title:`Artist ${a.name}`,note:`${a.day} · ${a.setStart}–${a.setEnd} · ${a.floor}`,kind:'artist'});
    });
    obj2arr(ev.travel).forEach(t=>{
      if(t.phone||t.contact)
        push({name:t.contact||t.artist,phone:t.phone,org:meta.name||'',
          title:`${t.dir==='in'?'Anreise':'Abreise'} ${t.artist}`,
          note:`${t.day} ${t.time||''} · ${t.from} → ${t.to}`,kind:'travel'});
      if(t.driver&&/\+?\d[\d\s\/-]{6,}/.test(t.driver)){
        const ph=(t.driver.match(/\+?\d[\d\s\/-]{6,}/)||[])[0];
        const nm=t.driver.split('·').map(s=>s.trim()).filter(s=>!/\d{5}/.test(s)).join(' · ');
        push({name:nm||'Fahrdienst',phone:ph,org:meta.name||'',title:'Fahrdienst',kind:'driver'});
      }
    });
    obj2arr(ev.drivers).forEach(d=>{ if(d.name)push({name:d.name,phone:d.phone||'',org:meta.name||'',title:'Fahrer',kind:'driver'}); });
    obj2arr(ev.contacts).forEach(c=>push({...c,kind:'custom',id:c.id}));
    return out;
  },[JSON.stringify([ev.artists,ev.travel,ev.contacts,ev.drivers,meta.name])]);

  const rows=people.filter(c=>{
    const s=(c.name+' '+(c.phone||'')+' '+c.tags.join(' ')).toLowerCase();
    return s.includes(q.toLowerCase());
  });
  const KIND={artist:{ic:'🎧',c:'#fbbf24'},travel:{ic:'✈️',c:'#34d399'},driver:{ic:'🚐',c:'#60a5fa'},custom:{ic:'👤',c:'#a1a1aa'}};

  const dlOne=c=>dlFile(vcard(c,meta.name),`${(c.name||'kontakt').replace(/[^\w\säöüÄÖÜß-]/g,'')}.vcf`,'text/vcard;charset=utf-8');
  const dlAll=()=>dlFile(rows.map(c=>vcard(c,meta.name)).join('\r\n'),
    `${(meta.name||'event').replace(/[^\w-]/g,'')}-kontakte.vcf`,'text/vcard;charset=utf-8');

  return(
    <div className="pb-24 pt-4 px-4">
      <div className="flex gap-2 mb-3">
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Name oder Nummer suchen…"
          className="flex-1 bg-zinc-900 border border-zinc-800 text-zinc-100 mono text-sm px-3 py-2.5 rounded-xl focus:border-amber-500 placeholder-zinc-700"/>
        {editable&&<button onClick={()=>setAdd(!add)}
          className={`px-4 rounded-xl mono text-lg font-bold ${add?'bg-zinc-700 text-zinc-300':'bg-zinc-800 border border-zinc-700 text-zinc-300'}`}>{add?'✕':'+'}</button>}
      </div>

      {add&&editable&&(
        <div className="bg-zinc-900 border border-amber-500/30 rounded-xl p-3 mb-3 space-y-2 slide">
          <input autoFocus value={nf.name} onChange={e=>setNf(p=>({...p,name:e.target.value}))} placeholder="Name"
            className="w-full bg-zinc-800 border border-zinc-700 text-white mono text-sm px-3 py-2 rounded-lg focus:border-amber-500 placeholder-zinc-600"/>
          <input value={nf.phone} onChange={e=>setNf(p=>({...p,phone:e.target.value}))} placeholder="Telefon" inputMode="tel"
            className="w-full bg-zinc-800 border border-zinc-700 text-white mono text-sm px-3 py-2 rounded-lg focus:border-amber-500 placeholder-zinc-600"/>
          <div className="flex gap-2">
            <input value={nf.note} onChange={e=>setNf(p=>({...p,note:e.target.value}))} placeholder="Funktion (z. B. Security)"
              className="flex-1 bg-zinc-800 border border-zinc-700 text-white mono text-sm px-3 py-2 rounded-lg focus:border-amber-500 placeholder-zinc-600"/>
            <button onClick={()=>{if(nf.name.trim()){fbPush(`${base}/contacts`,{name:nf.name.trim(),phone:nf.phone.trim(),title:nf.note.trim()||'Crew',note:''});setNf({name:'',phone:'',org:'',note:''});}}}
              className="bg-amber-500 text-black mono text-xs font-bold px-4 rounded-lg">OK</button>
          </div>
        </div>)}

      <SectionLabel right={
        <button onClick={dlAll} disabled={!rows.length}
          className={`mono text-[10px] px-2.5 py-1 rounded-lg border ${rows.length?'text-amber-400 border-amber-500/40 bg-amber-500/10 active:bg-amber-500/20':'text-zinc-700 border-zinc-800'}`}>
          ⤓ alle {rows.length}</button>}>
        Kontakte</SectionLabel>

      <div className="space-y-2">
        {rows.length===0&&<Empty>{q?'Nichts gefunden.':'Noch keine Kontakte hinterlegt.'}</Empty>}
        {rows.map((c,i)=>{
          const k=KIND[c.kind]||KIND.custom;
          return(
            <div key={i} className="rounded-xl border border-zinc-800 bg-zinc-900/60 px-3.5 py-3">
              <div className="flex items-start gap-3">
                <span className="w-9 h-9 rounded-full flex items-center justify-center text-sm flex-shrink-0"
                  style={{background:k.c+'1f',border:'1px solid '+k.c+'55'}}>{k.ic}</span>
                <div className="flex-1 min-w-0">
                  <div className="mono text-sm font-bold text-zinc-100 truncate">{c.name}</div>

/* ══ ADRESSE → KOORDINATEN (OpenStreetMap) ═══════════════════════════ */
const nomi=async q=>{
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=de,at,ch,nl,be&q='+encodeURIComponent(q);
  const r=await fetch(url,{headers:{Accept:'application/json'}});
  if(!r.ok)throw new Error('Suchdienst antwortet nicht ('+r.status+')');
  const j=await r.json();
  return j.length?{lat:parseFloat(j[0].lat),lng:parseFloat(j[0].lon),name:j[0].display_name}:null;
};
/* Mehrere Schreibweisen nacheinander probieren — Adresse allein trifft am besten,
   der Ortsname als Zusatz lässt die Suche dagegen oft ins Leere laufen. */
async function geocode(addr,name){
  const a=(addr||'').trim(), n=(name||'').trim();
  const noHnr=a.replace(/(\d+)[a-zA-Z](?![\wäöüß])/,'$1');   // "2A" → "2", lässt "50679 Köln" in Ruhe
  const noStreetNr=a.replace(/\s+\d+[a-zA-Z]?(?=\s*,)/,'');  // Hausnummer weg, PLZ bleibt
  const tries=[a, noHnr, n&&a?`${n}, ${a}`:'', n, noStreetNr]
    .map(s=>(s||'').trim()).filter((s,i,arr)=>s&&arr.indexOf(s)===i);
  let lastErr=null;
  for(const q of tries){
    try{ const r=await nomi(q); if(r)return{...r,used:q}; }
    catch(e){ lastErr=e; }
    await new Promise(r=>setTimeout(r,350));                  // freundlich zum Dienst
  }
  if(lastErr)throw lastErr;
  throw new Error('Adresse nicht gefunden');
}
/* Ein Ort: Name, Adresse, Koordinaten – mit automatischer Suche */
function LocationBlock({icon,title,name,addr,lat,lng,onSet}){
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState(null);
  const ok=Number.isFinite(+lat)&&Number.isFinite(+lng);
  const find=async()=>{
    if(!(addr||'').trim()&&!(name||'').trim()){setMsg({t:'err',m:'Trag zuerst die Adresse ein.'});return;}
    setBusy(true);setMsg(null);
    try{
      const r=await geocode(addr,name);
      onSet({lat:r.lat,lng:r.lng});
      setMsg({t:'ok',m:'Gefunden: '+r.name});
    }catch(e){
      setMsg({t:'err',m:(e.message||String(e))+
        ' — prüf die Schreibweise, oder trag die Zahlen unten von Hand ein.'});
    }
    finally{ setBusy(false); }
  };
  return(
    <div className="space-y-3">
      <Field label="Name" value={name} onChange={v=>onSet({name:v})}/>
      <Field label="Adresse" value={addr} onChange={v=>onSet({addr:v})} placeholder="Straße Hausnummer, PLZ Ort"/>
      <button onClick={find} disabled={busy}
        className={`w-full mono text-xs py-2.5 rounded-xl border transition-all
          ${busy?'border-zinc-800 text-zinc-600':'border-amber-500/40 bg-amber-500/10 text-amber-400 active:bg-amber-500/20'}`}>
        {busy?'suche…':'📍 Koordinaten aus Adresse holen'}</button>
      {msg&&(
        <div className={`mono text-[10px] leading-relaxed ${msg.t==='ok'?'text-emerald-400':'text-amber-300'}`}>{msg.m}</div>)}
      <div className="flex items-center gap-2">
        <span className={`w-2 h-2 rounded-full flex-shrink-0 ${ok?'bg-emerald-500':'bg-red-500'}`}/>
        <span className="mono text-[10px] text-zinc-500 flex-1">
          {ok?`${(+lat).toFixed(5)}, ${(+lng).toFixed(5)} — erscheint auf der Karte`:'Noch kein Standort — dieser Punkt fehlt auf der Karte'}</span>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Lat (manuell)" value={lat} onChange={v=>onSet({lat:v===''?null:parseFloat(v)})} placeholder="51.5145"/>
        <Field label="Lng (manuell)" value={lng} onChange={v=>onSet({lng:v===''?null:parseFloat(v)})} placeholder="7.4610"/>
      </div>
      <div className="mono text-[9px] text-zinc-600 leading-relaxed">
        Klappt die Suche nicht: in Google Maps lange auf den Ort drücken, die beiden Zahlen erscheinen oben — hier eintragen.
      </div>
    </div>
  );
}

/* ══ IMPORT / EXPORT ═════════════════════════════════════════════════ */
const IMPORTABLE=[
  ['artists','Artists'],['pickups','Pickups'],['travel','An-/Abreisen'],
  ['notes','Notizen'],['contacts','Kontakte'],['guestlist','Gästeliste'],['friendslist','Friendslist'],
];
function ImportExport({ev,base}){
  const [open,setOpen]=useState(false);
  const [txt,setTxt]=useState('');
  const [prev,setPrev]=useState(null);
  const [err,setErr]=useState('');
  const [mode,setMode]=useState('merge');

  const exportJson=()=>{
    const out={meta:ev.meta||{}};
    IMPORTABLE.forEach(([k])=>{ if(ev[k])out[k]=ev[k]; });
    const s=JSON.stringify(out,null,2);
    dlFile(s,`${(ev.meta?.name||'event').replace(/[^\w-]/g,'')}-daten.json`,'application/json');
  };
  const check=()=>{
    setErr('');setPrev(null);
    try{
      const j=JSON.parse(txt);
      if(typeof j!=='object'||!j)throw new Error('Kein gültiges Objekt');
      const counts={};
      IMPORTABLE.forEach(([k,l])=>{
        const v=j[k];
        if(!v)return;
        const n=Array.isArray(v)?v.length:Object.keys(v).length;
        if(n)counts[k]={label:l,n};
      });
      if(j.meta)counts.meta={label:'Eventdaten (Name, Tage, Floors, Orte)',n:Object.keys(j.meta).length};
      if(!Object.keys(counts).length)throw new Error('Keine bekannten Abschnitte gefunden');
      setPrev({j,counts});
    }catch(e){ setErr('Konnte nicht gelesen werden: '+(e.message||e)); }
  };
  const apply=()=>{
    const {j}=prev;
    if(j.meta)fbUpd(`${base}/meta`,j.meta);
    IMPORTABLE.forEach(([k])=>{
      const v=j[k];
      if(!v)return;
      const asObj=Array.isArray(v)
        ? Object.fromEntries(v.map((x,i)=>[x.id||`${k[0]}${Date.now().toString(36)}${i}`,(({id,...r})=>r)(x)]))
        : v;
      if(mode==='replace')fbSet(`${base}/${k}`,asObj);
      else Object.entries(asObj).forEach(([id,val])=>fbSet(`${base}/${k}/${id}`,val));
    });
    setTxt('');setPrev(null);setOpen(false);
    alert('Daten übernommen.');
  };

  return(
    <div>
      <SectionLabel>Daten ein- und ausspielen</SectionLabel>
      <div className="space-y-2">
        <button onClick={exportJson}
          className="w-full border border-zinc-700 text-zinc-300 mono text-xs py-2.5 rounded-xl active:bg-zinc-900">
          ⤓ Event als JSON sichern</button>
        <button onClick={()=>setOpen(true)}
          className="w-full border border-dashed border-zinc-700 text-zinc-400 mono text-xs py-2.5 rounded-xl active:bg-zinc-900">
          ⤒ Daten einspielen (Line-up, Pickups, Reisen …)</button>
        <div className="mono text-[9px] text-zinc-600 leading-relaxed">
          Praktisch, um ein komplettes Line-up auf einmal zu übernehmen, statt jeden Artist einzeln anzulegen.
        </div>
      </div>

      <Sheet open={open} onClose={()=>{setOpen(false);setPrev(null);setErr('');}} title="Daten einspielen">
        <div className="space-y-3">
          <div className="mono text-[11px] text-zinc-400 leading-relaxed">
            JSON hier einfügen. Erkannt werden: <span className="text-zinc-200">meta, artists, pickups,
            travel, notes, contacts, guestlist, friendslist</span> — jeweils als Objekt oder Liste.
          </div>
          <textarea value={txt} onChange={e=>{setTxt(e.target.value);setPrev(null);setErr('');}} rows={8}
            placeholder={'{\n  "artists": [\n    { "name": "…", "day": "Fr 17.07", "floor": "Floor I",\n      "setStart": "22:00", "setEnd": "00:00" }\n  ]\n}'}
            className="w-full bg-zinc-900 border border-zinc-700 text-zinc-100 mono text-[11px] px-3 py-2.5 rounded-lg focus:border-amber-500 placeholder-zinc-700 resize-none leading-relaxed"/>
          <div className="flex gap-2">
            <button onClick={()=>setMode('merge')}
              className={`flex-1 py-2 rounded-lg mono text-[10px] border ${mode==='merge'?'bg-amber-500/15 border-amber-500/40 text-amber-300':'bg-zinc-900 border-zinc-700 text-zinc-500'}`}>
              ergänzen</button>
            <button onClick={()=>setMode('replace')}
              className={`flex-1 py-2 rounded-lg mono text-[10px] border ${mode==='replace'?'bg-red-500/15 border-red-500/40 text-red-300':'bg-zinc-900 border-zinc-700 text-zinc-500'}`}>
              ersetzen</button>
          </div>
          <div className="mono text-[9px] text-zinc-600 leading-relaxed">
            {mode==='merge'
              ?'Bestehendes bleibt, Neues kommt dazu. Gleiche IDs werden überschrieben.'
              :'⚠️ Der jeweilige Abschnitt wird komplett ersetzt — alles Bisherige darin ist weg.'}
          </div>
          {err&&<div className="mono text-[11px] text-red-400 leading-relaxed">{err}</div>}
          {!prev
            ?<button onClick={check} disabled={!txt.trim()}
               className={`w-full bebas text-lg py-2.5 rounded-xl tracking-widest ${txt.trim()?'bg-zinc-700 text-zinc-100 active:scale-[.98]':'bg-zinc-900 text-zinc-700'}`}>
               PRÜFEN</button>
            :<>
              <div className="rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-3.5 py-3 space-y-1">
                <div className="mono text-[11px] text-emerald-200 font-bold">Wird übernommen:</div>
                {Object.entries(prev.counts).map(([k,v])=>(
                  <div key={k} className="flex justify-between mono text-[11px] text-zinc-300">
                    <span>{v.label}</span><span className="text-emerald-300">{v.n}</span></div>))}
              </div>
              <button onClick={apply}
                className="w-full bg-emerald-500 text-black bebas text-lg py-3 rounded-xl tracking-widest active:scale-[.98]">
                ÜBERNEHMEN</button>
            </>}
        </div>
      </Sheet>
    </div>
  );
}

function EventShell({eventId,role,roles=[],viewAs,setViewAs,onBack,onLogout,driverId,me}){
  const base=`${ROOT}/events/${eventId}`;
  const [ev,setEv]=useState(null);
  const [tab,setTab]=useState('lineup');
  useEffect(()=>fbOn(base,d=>setEv(d||{})),[eventId]);
  useEffect(()=>{
    if(viewAs==='einlass')setTab('guests');
    else if(viewAs==='fahrer')setTab('fahrer');
    else if(viewAs==='artistcare')setTab('lineup');
    else if(viewAs==='admin')setTab('settings');
    else setTab('lineup');
  },[viewAs]);
  if(!ev)return <div className="min-h-screen flex items-center justify-center text-zinc-700 mono text-sm">Lade Event…</div>;
  const meta=ev.meta||{};
  const isSuper=role==='superadmin';

    ? ['leitung','admin','events'].includes(viewAs)

  const drivers=obj2arr(ev.drivers);

    {id:'contacts',label:'KONTAKTE'},
    {id:'notes',  label:'NOTES'},
    {id:'settings',label:'EVENT'},
  ];
  /* Welche Rolle schaltet was frei */
  const TABS_BY_ROLE={
    leitung:['grid','run','lineup','pickups','travel','shop','map','guests','kasse','payouts','settle','contacts','notes','settings'],
    einlass:['guests','kasse','payouts','settle','grid'],
    fahrer:['fahrer','grid','contacts','map'],
    artistcare:['lineup','grid','run','shop','pickups','travel','map','contacts','notes'],
  };
  /* Bei Mehrfachrollen alle Ansichten zusammenführen */
  const activeRoles=isSuper
    ? [ ['admin','events','leitung'].includes(viewAs) ? 'leitung' : viewAs ]
    : roles;
  const allowed=new Set(activeRoles.flatMap(r=>TABS_BY_ROLE[r]||[]));
  if(!editable)allowed.delete('settings');
  const tabs=ALL_TABS.filter(t=>allowed.has(t.id));
  const valid=tabs.some(t=>t.id===tab)?tab:tabs[0]?.id;
  const accent=ROLES[eff]?.color||'#fafafa';

  return(
    <div className="min-h-screen flex flex-col">
      <TopBar title={meta.name||'Event'} sub={`${meta.date||''} · ${meta.city||''}`} onBack={onBack} accent={accent}
        right={<div className="flex items-center gap-1.5">
          <span className="mono text-[9px] px-2 py-1 rounded-md border" style={{color:accent,borderColor:accent+'55',background:accent+'14'}}>
            {(ROLES[eff]?.label)||'ADMIN'}</span>
          <button onClick={onLogout} className="text-zinc-500 mono text-[10px] px-2 py-1.5 border border-zinc-700 rounded-lg active:bg-zinc-800">Exit</button>
        </div>}/>
      {isSuper&&<SuperBar onSwitchRole={setViewAs} active={viewAs==='admin'?'admin':viewAs}/>}
      <Tabs tabs={tabs} active={valid} onChange={setTab}/>
      <div className={`flex-1 ${valid==='map'||valid==='grid'?'flex flex-col min-h-0':'overflow-y-auto'}`}>
        {valid==='grid'    &&<Grid ev={ev} base={base}/>}
        {valid==='run'     &&<Runsheet ev={ev} base={base}/>}
        {valid==='shop'    &&<Shopping ev={ev} base={base}/>}
        {valid==='lineup'  &&<Lineup ev={ev} base={base} editable={editable}/>}
        {valid==='pickups' &&<Pickups ev={ev} base={base} editable={editable} role={eff}/>}
        {valid==='travel'  &&<Travel ev={ev} base={base} editable={editable||eff==='fahrer'}/>}
        {valid==='map'     &&<DriverPanel meta={meta} drivers={drivers}/>}
        {valid==='guests'  &&<Guests ev={ev} base={base}/>}
        {valid==='kasse'   &&<Kasse ev={ev} base={base} role={eff}/>}
        {valid==='payouts' &&<Payouts ev={ev} base={base} me={me}/>}
        {valid==='settle'  &&<Abrechnung ev={ev} base={base} me={me} role={eff}/>}
        {valid==='contacts'&&<Contacts ev={ev} base={base} editable={editable}/>}
        {valid==='fahrer'  &&<FahrerPanel ev={ev} base={base} driverId={driverId} account={me}/>}
        {valid==='notes'   &&<Notes ev={ev} base={base} editable={editable}/>}
        {valid==='settings'&&<Settings ev={ev} base={base} eventId={eventId} onDeleted={onBack}/>}
      </div>
    </div>
  );
}

/* ══ NEW EVENT ═══════════════════════════════════════════════════════ */
function NewEvent({onCancel,onCreated}){
  const [f,setF]=useState({name:'',date:'',city:'',days:'Fr,Sa',floors:'Floor I,Floor II',
    hotelName:'',hotelAddr:'',venueName:'',venueAddr:''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const create=async(withSeed)=>{
    if(withSeed){
      const id='ev'+uid();await fbSet(`${ROOT}/events/${id}`,buildSeed());onCreated(id);return;
    }
    if(!f.name.trim())return;
    const id='ev'+uid();
    await fbSet(`${ROOT}/events/${id}`,{meta:{
      name:f.name.trim(),date:f.date.trim(),city:f.city.trim(),
      days:f.days.split(',').map(s=>s.trim()).filter(Boolean),
      floors:f.floors.split(',').map(s=>s.trim()).filter(Boolean),
      hotelName:f.hotelName.trim(),hotelAddr:f.hotelAddr.trim(),hotelLat:null,hotelLng:null,
      venueName:f.venueName.trim(),venueAddr:f.venueAddr.trim(),venueLat:null,venueLng:null,
      archived:false,createdAt:Date.now()}});
    onCreated(id);
  };
  return(
    <div className="min-h-screen flex flex-col">
      <TopBar title="NEUES EVENT" onBack={onCancel}/>
      <div className="flex-1 overflow-y-auto px-4 pt-4 pb-8 safe-bot space-y-3">
        <Field label="Eventname *" value={f.name} onChange={v=>set('name',v)} placeholder="UNREAL"/>
        <Field label="Datum" value={f.date} onChange={v=>set('date',v)} placeholder="17.–18.07.2026"/>
        <Field label="Ort"   value={f.city} onChange={v=>set('city',v)} placeholder="Dortmund · Junkyard"/>
        <Field label="Tage (Komma-getrennt)"   value={f.days}   onChange={v=>set('days',v)}   placeholder="Fr 17.07, Sa 18.07"/>
        <Field label="Floors (Komma-getrennt)" value={f.floors} onChange={v=>set('floors',v)} placeholder="Floor I Outdoor, Floor II Indoor"/>
        <div className="pt-2"><SectionLabel>Hotel</SectionLabel>
          <div className="space-y-3">
            <Field label="Name" value={f.hotelName} onChange={v=>set('hotelName',v)} placeholder="Hotel"/>
            <Field label="Adresse" value={f.hotelAddr} onChange={v=>set('hotelAddr',v)} placeholder="Straße, PLZ Ort"/></div></div>
        <div className="pt-2"><SectionLabel>Venue</SectionLabel>
          <div className="space-y-3">
            <Field label="Name" value={f.venueName} onChange={v=>set('venueName',v)} placeholder="Club"/>
            <Field label="Adresse" value={f.venueAddr} onChange={v=>set('venueAddr',v)} placeholder="Straße, PLZ Ort"/></div></div>
        <button onClick={()=>create(false)} disabled={!f.name.trim()}
          className={`w-full bebas text-xl py-3.5 rounded-xl tracking-widest mt-4 transition-all
            ${f.name.trim()?'bg-amber-500 text-black active:scale-[.98]':'bg-zinc-800 text-zinc-600'}`}>
          EVENT ANLEGEN</button>
        <button onClick={()=>create(true)}
          className="w-full border border-dashed border-zinc-700 text-zinc-500 mono text-xs py-3 rounded-xl active:bg-zinc-900">
          Stattdessen Dortmund-Vorlage laden (komplettes Line-up)</button>
        <div className="mono text-[10px] text-zinc-700 leading-relaxed pt-2">
          Line-up, Pickups, Gästeliste und Notizen trägst du danach direkt im Event ein — alles jederzeit änderbar.</div>
      </div>
    </div>
  );
}

/* ══ TEAM · Rollen vergeben ══════════════════════════════════════════ */
function Team({me,onBack,events}){
  const [users,setUsers]=useState({});
  const [adding,setAdding]=useState(false);
  const [f,setF]=useState({name:'',email:'',password:'',role:'leitung',evAll:true,evIds:{}});
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState(null);
  useEffect(()=>fbOn(USERS,d=>setUsers(d||{})),[]);
  const all=obj2arr(users).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const pending=all.filter(u=>u.pending);
  const list=all.filter(u=>!u.pending);
  const OPTS=[['superadmin','Superadmin'],['leitung','Leitung'],['einlass','Einlass'],
              ['fahrer','Fahrer'],['artistcare','Artist Care'],['','kein Zugang']];
  const evList=obj2arr(events).map(e=>({id:e.id,name:e.meta?.name||'Ohne Titel',date:e.meta?.date||''}))
    .filter(e=>!(events[e.id]?.meta?.archived));
  const approve=(u,role)=>fbUpd(`${USERS}/${u.id}`,{role,pending:null,wish:null,active:true});
  const set=(k,v)=>{setF(p=>({...p,[k]:v}));setMsg(null);};
  const genPw=()=>set('password',Math.random().toString(36).slice(2,6)+'-'+Math.random().toString(36).slice(2,6));

  const create=async()=>{
    if(!f.name.trim()||!f.email.trim()){setMsg({t:'err',m:'Name und E-Mail ausfüllen.'});return;}
    if((f.password||'').length<6){setMsg({t:'err',m:'Passwort mindestens 6 Zeichen.'});return;}
    setBusy(true);setMsg(null);
    const email=f.email.trim(), name=f.name.trim(), tmp=f.password;
    try{
      const wa=workerAuth();
      const cred=await wa.createUserWithEmailAndPassword(email,tmp);
      try{ await cred.user.updateProfile({displayName:name}); }catch(e){}  // füllt %FIRST_NAME% in den Mails
      await db.ref(`${USERS}/${cred.user.uid}`).set({uid:cred.user.uid,name,email,role:f.role,
        active:true,mustSetPassword:true,createdAt:Date.now(),createdBy:me.name||me.email||'',
        allEvents:f.evAll?true:false, events:f.evAll?null:(Object.keys(f.evIds).length?f.evIds:null)});
      await wa.signOut();
      let mailed=false;
      try{ await fbAuth.sendPasswordResetEmail(email); mailed=true; }catch(e){ console.warn('Mail',e); }
      setMsg({t:'ok',name,email,tmp,mailed});
      setF(p=>({...p,name:'',email:'',password:''}));
    }catch(e){
      setMsg({t:'err',m:AUTH_ERRORS[e.code]||('Konnte nicht anlegen: '+(e.code||e.message))});
    }finally{ setBusy(false); }
  };
  const resend=async(email)=>{
    try{ await fbAuth.sendPasswordResetEmail(email);
      alert('E-Mail an '+email+' verschickt.\n\nHinweis: Landet oft im Spam-Ordner — dort nachsehen und als „Kein Spam" markieren.'); }
    catch(e){ alert(AUTH_ERRORS[e.code]||('Konnte keine E-Mail senden: '+(e.code||e.message))); }
  };
  /* Einladung ohne E-Mail weitergeben — per WhatsApp, Signal, SMS … */
  const shareInvite=async(name,email,tmp)=>{
    const txt=`Hey ${name||''}, hier ist dein Zugang zu backstage.app:\n\n`+
      `${location.href}\n\nE-Mail: ${email}\nStartpasswort: ${tmp||'(per Mail gesetzt)'}\n\n`+
      `Beim ersten Öffnen legst du dein eigenes Passwort fest.`;
    try{
      if(navigator.share) await navigator.share({title:'backstage.app',text:txt});
      else { await navigator.clipboard.writeText(txt); alert('Einladungstext kopiert — jetzt einfügen und verschicken.'); }
    }catch(e){ if(e.name!=='AbortError'){ try{await navigator.clipboard.writeText(txt);alert('Einladungstext kopiert.');}catch(_){} } }
  };

  return(
    <div className="min-h-screen flex flex-col">
      <TopBar title="TEAM" sub={`${list.length} Konten`} onBack={onBack}
        right={<button onClick={()=>{setAdding(!adding);setMsg(null);}}
          className={`mono text-[11px] px-3 py-1.5 rounded-lg border transition-all
            ${adding?'bg-zinc-800 border-zinc-600 text-zinc-300':'bg-amber-500 border-amber-500 text-black font-bold'}`}>
          {adding?'✕':'+ Person'}</button>}/>
      <div className="flex-1 overflow-y-auto px-4 pt-4 safe-bot">

        {adding&&(
          <div className="bg-zinc-900 border border-amber-500/30 rounded-xl p-3.5 mb-4 space-y-2.5 slide">
            <div className="mono text-[10px] text-amber-400 uppercase tracking-wider">Neues Konto anlegen</div>
            <input value={f.name} onChange={e=>set('name',e.target.value)} placeholder="Name"
              className="w-full bg-zinc-800 border border-zinc-700 text-white mono text-sm px-3 py-2.5 rounded-lg focus:border-amber-500 placeholder-zinc-600"/>
            <input value={f.email} onChange={e=>set('email',e.target.value)} placeholder="E-Mail" type="email" autoCapitalize="off"
              className="w-full bg-zinc-800 border border-zinc-700 text-white mono text-sm px-3 py-2.5 rounded-lg focus:border-amber-500 placeholder-zinc-600"/>
            <div className="flex gap-2">
              <input value={f.password} onChange={e=>set('password',e.target.value)} placeholder="Startpasswort"
                className="flex-1 bg-zinc-800 border border-zinc-700 text-white mono text-sm px-3 py-2.5 rounded-lg focus:border-amber-500 placeholder-zinc-600"/>
              <button onClick={genPw} className="border border-zinc-700 text-zinc-400 mono text-[11px] px-3 rounded-lg active:bg-zinc-800">würfeln</button>
            </div>
            <div>
              <div className="mono text-[9px] text-zinc-600 uppercase tracking-wider mb-1.5">Rolle</div>
              <div className="flex gap-1.5 flex-wrap">
                {OPTS.filter(o=>o[0]).map(([val,lab])=>(
                  <button key={val} onClick={()=>set('role',val)}
                    className={`px-2.5 py-1.5 rounded-md mono text-[10px] border transition-all
                      ${f.role===val?'bg-amber-500/15 border-amber-500/40 text-amber-300':'bg-zinc-800 border-zinc-700 text-zinc-500'}`}>
                    {lab}</button>))}
              </div>
            </div>
            {f.role!=='superadmin'&&evList.length>0&&(
              <div>
                <div className="mono text-[9px] text-zinc-600 uppercase tracking-wider mb-1.5">Sichtbare Events</div>
                <div className="flex gap-1.5 flex-wrap">
                  <button onClick={()=>setF(p=>({...p,evAll:true,evIds:{}}))}
                    className={`px-2 py-1 rounded-md mono text-[10px] border ${f.evAll?'bg-emerald-500/15 border-emerald-500/40 text-emerald-300':'bg-zinc-800 border-zinc-700 text-zinc-500'}`}>
                    alle</button>
                  {evList.map(e=>{
                    const on=!f.evAll&&!!f.evIds[e.id];
                    return <button key={e.id} onClick={()=>setF(p=>{
                        const ids={...(p.evAll?{}:p.evIds)};
                        on?delete ids[e.id]:ids[e.id]=true;
                        return{...p,evAll:false,evIds:ids};})}
                      className={`px-2 py-1 rounded-md mono text-[10px] border max-w-[140px] truncate ${on?'bg-amber-500/15 border-amber-500/40 text-amber-300':'bg-zinc-800 border-zinc-700 text-zinc-500'}`}>
                      {e.name}</button>;})}
                </div>
              </div>)}
            <button onClick={create} disabled={busy}
              className={`w-full bebas text-lg py-2.5 rounded-lg tracking-widest ${busy?'bg-zinc-800 text-zinc-600':'bg-amber-500 text-black active:scale-[.98]'}`}>
              {busy?'MOMENT…':'ANLEGEN & EINLADEN'}</button>

            {msg&&msg.t==='err'&&(
              <div className="mono text-[11px] leading-relaxed rounded-lg px-3 py-2.5 border bg-red-500/10 border-red-500/30 text-red-300">{msg.m}</div>)}
            {msg&&msg.t==='ok'&&(
              <div className="rounded-lg px-3 py-3 border bg-emerald-500/10 border-emerald-500/30 space-y-2">
                <div className="mono text-[12px] text-emerald-200 font-bold">{msg.name} ist angelegt.</div>
                <div className="mono text-[11px] text-zinc-300 leading-relaxed">
                  Schick ihr jetzt die Zugangsdaten — das ist der sichere Weg:</div>
                <button onClick={()=>shareInvite(msg.name,msg.email,msg.tmp)}
                  className="w-full bg-emerald-500 text-black bebas text-lg py-3 rounded-lg tracking-wide active:scale-[.98]">
                  ↗ EINLADUNG SENDEN</button>
                <div className="mono text-[10px] text-zinc-400 bg-zinc-950/60 rounded px-2.5 py-2 leading-relaxed">
                  E-Mail: <span className="text-zinc-200">{msg.email}</span><br/>
                  Startpasswort: <span className="text-zinc-200">{msg.tmp}</span><br/>
                  Beim ersten Öffnen verlangt die App ein eigenes Passwort.</div>
                <div className="flex gap-2">
                  <button onClick={()=>navigator.clipboard?.writeText(`backstage.app\n${location.href}\nE-Mail: ${msg.email}\nStartpasswort: ${msg.tmp}`)}
                    className="flex-1 border border-zinc-600 text-zinc-300 mono text-[10px] py-1.5 rounded">Daten kopieren</button>
                  <button onClick={()=>resend(msg.email)}
                    className="flex-1 border border-zinc-600 text-zinc-300 mono text-[10px] py-1.5 rounded">Mail schicken</button>
                </div>
                <div className="mono text-[10px] text-zinc-500 leading-relaxed">
                  {msg.mailed
                    ?'Zusätzlich ist eine Firebase-Mail unterwegs — die landet oft im Spam, verlass dich nicht darauf.'
                    :'Die Firebase-Mail konnte nicht verschickt werden — nimm den Weg oben.'}</div>
              </div>)}
          </div>)}

        {pending.length>0&&(
          <div className="mb-5">
            <SectionLabel right={<span className="mono text-[10px] bg-amber-500 text-black font-bold px-2 py-0.5 rounded-full">{pending.length}</span>}>
              Offene Zugangsanfragen</SectionLabel>
            <div className="space-y-2">
              {pending.map(u=>(
                <div key={u.id} className="rounded-xl border border-amber-500/40 bg-amber-500/[.07] px-4 py-3">
                  <div className="mono text-sm font-bold text-zinc-100 truncate">{u.name||'Ohne Namen'}</div>
                  <div className="mono text-[10px] text-zinc-400 truncate">{u.email}</div>
                  <div className="mono text-[10px] text-zinc-500 mt-0.5">
                    angefragt {u.createdAt?new Date(u.createdAt).toLocaleDateString('de-DE'):''}
                    {u.wish&&<> · möchte <span className="text-amber-300">{ROLES[u.wish]?.label||u.wish}</span></>}</div>
                  <div className="mono text-[9px] text-zinc-600 uppercase tracking-wider mt-2.5 mb-1.5">Freigeben als</div>
                  <div className="flex gap-1.5 flex-wrap">
                    {OPTS.filter(o=>o[0]).map(([val,lab])=>(
                      <button key={val} onClick={()=>approve(u,val)}
                        className={`px-2.5 py-1.5 rounded-md mono text-[10px] border transition-all active:scale-95
                          ${u.wish===val?'bg-emerald-500 border-emerald-500 text-black font-bold':'bg-zinc-900 border-zinc-600 text-zinc-300 active:bg-zinc-800'}`}>
                        {lab}</button>))}
                    <button onClick={()=>{if(confirm(`Anfrage von ${u.name||u.email} ablehnen?`))fbDel(`${USERS}/${u.id}`);}}
                      className="ml-auto mono text-[10px] text-zinc-500 border border-zinc-700 px-2.5 py-1.5 rounded-md active:text-red-400">
                      ablehnen</button>
                  </div>
                </div>))}
            </div>
          </div>)}

        {pending.length>0&&<SectionLabel>Team</SectionLabel>}
        <div className="space-y-2">
          {list.map(u=>{
            const urs=userRoles(u);
            const eff=urs[0]||'';
            const isMe=u.uid===me.uid;
            return(
              <div key={u.id} className={`rounded-xl border px-4 py-3 ${u.active===false?'border-zinc-800/50 bg-zinc-900/25 opacity-50':'border-zinc-800 bg-zinc-900/60'}`}>
                <div className="flex items-center gap-2">
                  <div className="flex-1 min-w-0">
                    <div className="mono text-sm font-bold text-zinc-100 truncate">
                      <TextEdit value={u.name||''} onSave={v=>fbUpd(`${USERS}/${u.id}`,{name:v})}
                        cls="text-sm font-bold text-zinc-100" placeholder="Ohne Namen"/>
                      {isMe&&<span className="text-amber-500 text-[10px] ml-1.5">(du)</span>}</div>
                    <div className="mono text-[10px] text-zinc-500 truncate">{u.email}</div>
                  </div>
                  <div className="flex gap-1 flex-wrap justify-end flex-shrink-0 max-w-[45%]">
                    {urs.map(r=>(
                      <span key={r} className="mono text-[9px] px-1.5 py-1 rounded border"
                        style={{color:ROLES[r]?.color,borderColor:(ROLES[r]?.color||'#666')+'55',background:(ROLES[r]?.color||'#666')+'14'}}>
                        {ROLES[r]?.label}</span>))}
                  </div>
                </div>
                <div className="flex gap-1.5 mt-2.5 flex-wrap items-center">
                  {OPTS.map(([val,lab])=>{
                    const has=userRoles(u).includes(val);
                    const none=val==='';
                    const active=none?userRoles(u).length===0:has;
                    return(
                    <button key={val||'none'} disabled={isMe&&val!=='superadmin'}
                      onClick={()=>{
                        if(none){ fbUpd(`${USERS}/${u.id}`,{roles:null,role:null,active:true}); return; }
                        const cur=new Set(userRoles(u));
                        cur.has(val)?cur.delete(val):cur.add(val);
                        const arr=ROLE_ORDER.filter(r=>cur.has(r));
                        fbUpd(`${USERS}/${u.id}`,{
                          roles:arr.length?Object.fromEntries(arr.map(r=>[r,true])):null,
                          role:arr[0]||null,active:true});
                      }}
                      className={`px-2 py-1 rounded-md mono text-[10px] border transition-all
                        ${active
                          ?'bg-amber-500/15 border-amber-500/40 text-amber-300'
                          :isMe&&val!=='superadmin'?'border-zinc-900 text-zinc-800'
                          :'bg-zinc-900 border-zinc-700/70 text-zinc-500 active:bg-zinc-800'}`}>
                      {active&&!none?'✓ ':''}{lab}</button>);})}
                  <button onClick={()=>shareInvite(u.name,u.email,null)} title="Einladung teilen"
                    className="ml-auto text-zinc-500 mono text-[10px] px-2 py-1 border border-zinc-700 rounded-md active:bg-zinc-800">↗ teilen</button>
                  <button onClick={()=>resend(u.email)} title="Passwort-Link per E-Mail"
                    className="text-zinc-500 mono text-[10px] px-2 py-1 border border-zinc-700 rounded-md active:bg-zinc-800">📧 Link</button>
                  {!isMe&&(
                    <button onClick={()=>{if(confirm(`${u.name||u.email} aus der Liste entfernen?\n\nDas Firebase-Konto bleibt bestehen — die Person hat aber keinen Zugang mehr.`))fbDel(`${USERS}/${u.id}`);}}
                      className="text-zinc-700 mono text-[11px] px-1.5 active:text-red-400">✕</button>)}
                </div>
                {/* Welche Events darf die Person sehen? */}
                {eff&&eff!=='superadmin'&&evList.length>0&&(
                  <div className="mt-2.5 pt-2.5 border-t border-zinc-800/70">
                    <div className="mono text-[9px] text-zinc-600 uppercase tracking-wider mb-1.5">Sichtbare Events</div>
                    <div className="flex gap-1.5 flex-wrap">
                      <button onClick={()=>fbUpd(`${USERS}/${u.id}`,{allEvents:true,events:null})}
                        className={`px-2 py-1 rounded-md mono text-[10px] border transition-all
                          ${u.allEvents!==false?'bg-emerald-500/15 border-emerald-500/40 text-emerald-300':'bg-zinc-900 border-zinc-700/70 text-zinc-500'}`}>
                        alle</button>
                      {evList.map(e=>{
                        const on=u.allEvents===false&&!!(u.events||{})[e.id];
                        return(
                          <button key={e.id} onClick={()=>{
                              const cur={...(u.events||{})};
                              if(u.allEvents!==false){ fbUpd(`${USERS}/${u.id}`,{allEvents:false,events:{[e.id]:true}}); return; }
                              on?delete cur[e.id]:cur[e.id]=true;
                              fbUpd(`${USERS}/${u.id}`,{allEvents:false,events:Object.keys(cur).length?cur:null});
                            }}
                            className={`px-2 py-1 rounded-md mono text-[10px] border transition-all max-w-[140px] truncate
                              ${on?'bg-amber-500/15 border-amber-500/40 text-amber-300':'bg-zinc-900 border-zinc-700/70 text-zinc-500 active:bg-zinc-800'}`}>
                            {e.name}</button>);
                      })}
                    </div>
                    {u.allEvents===false&&!Object.keys(u.events||{}).length&&(
                      <div className="mono text-[9px] text-red-400/80 mt-1.5">Kein Event ausgewählt — sieht momentan nichts.</div>)}
                  </div>)}
              </div>);
          })}
          {list.length===0&&<Empty>Noch keine Konten.</Empty>}
        </div>

        <div className="mono text-[10px] text-zinc-500 leading-relaxed mt-6 border-t border-zinc-900 pt-4 space-y-2">
          <div className="text-zinc-400 uppercase tracking-wider text-[9px]">Drei Wege, jemanden aufzunehmen</div>
          <div><span className="text-zinc-300">1 · Du legst an</span> — „+ Person". Die Person bekommt automatisch eine E-Mail von Firebase, setzt darüber ihr eigenes Passwort und ist drin. Du siehst zusätzlich ein Startpasswort als Rückfallweg.</div>
          <div><span className="text-zinc-300">2 · Selbst registrieren</span> — „Neu hier? → Konto erstellen", eigene E-Mail und eigenes Passwort, dazu ein Einladungscode:</div>
          <div className="pl-3 text-zinc-400">
            LEITUNG → Leitung · DOOR → Einlass<br/>
            FAHRER → Fahrer · CARE → Artist Care</div>
          <div><span className="text-zinc-300">3 · Zugang anfragen</span> — ohne Code registrieren; die Anfrage erscheint hier oben und du gibst die Rolle frei.</div>
          <div className="pt-1">Mit <span className="text-zinc-300">📧 Link</span> schickst du jederzeit eine neue Passwort-Mail, etwa wenn jemand sein Passwort vergessen hat.</div>
          <div><span className="text-zinc-300">Sichtbare Events</span> stehen unter jeder Person — dort legst du fest, welche Events sie sieht.</div>
        </div>
      </div>
    </div>
  );
}

/* ══ VERBINDUNGS-DIAGNOSE ════════════════════════════════════════════ */
const RULES=`{
  "rules": {
    "backstage": {
      ".read": true,
      ".write": true
    }
  }
}`;
function Connecting(){
  return(
    <div className="min-h-screen flex flex-col items-center justify-center gap-4 px-8 text-center">
      <div className="bebas text-4xl text-zinc-700 tracking-wide">backstage<span className="text-zinc-600">.app</span></div>
      <div className="flex gap-1.5">
        {[0,1,2].map(i=><span key={i} className="w-2 h-2 rounded-full bg-zinc-600"
          style={{animation:`fd .6s ${i*.15}s infinite alternate`}}/>)}</div>
      <div className="mono text-xs text-zinc-600">Verbinde…</div>
    </div>
  );
}
/* Hinweis, wenn bewusst ohne Anmeldung getestet wird */
function OfflineBanner({onExit}){
  return(
    <div onClick={onExit}
      className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[150] bg-amber-500 text-black mono text-[10px] font-bold px-3 py-1.5 rounded-full shadow-lg active:scale-95 transition-transform cursor-pointer">
      ⚡ Testmodus · nur dieses Gerät · tippen zum Beenden
    </div>
  );
}

/* ══ ROOT ════════════════════════════════════════════════════════════ */
function App(){
  const [auth,setAuth]=useState({state:'boot',user:null});   // Firebase-Konto
  const [viewAs,setViewAs]=useState(()=>localStorage.getItem('uo-viewas')||'leitung');
  const [events,setEvents]=useState(null);
  /* Zuletzt geöffnetes Event ist beim nächsten Start der Landeplatz */
  const [openId,setOpenId]=useState(()=>localStorage.getItem('uo-event')||null);
  const [installHint,setInstallHint]=useState(()=>!isStandalone()&&!localStorage.getItem('uo-install-seen'));
  const [creating,setCreating]=useState(false);
  const [showTeam,setShowTeam]=useState(false);
  const [offline,setOffline]=useState(false);
  const driverId=useRef(localStorage.getItem('uo-driverid')||(()=>{const i='d'+uid();localStorage.setItem('uo-driverid',i);return i;})()).current;
  const [gen,setGen]=useState(0);
  const seeded=useRef(false);

  /* Anmeldestatus beobachten und Profil laden */
  useEffect(()=>{
    if(offline)return;
    let offUser=()=>{};
    const unsub=fbAuth.onAuthStateChanged(u=>{
      offUser();
      if(!u){ setAuth({state:'out',user:null}); setEvents(null); return; }
      offUser=fbOn(`${USERS}/${u.uid}`,prof=>{
        setAuth({state:'in',user:{uid:u.uid,email:u.email,...(prof||{})}});
      },()=>setAuth({state:'in',user:{uid:u.uid,email:u.email}}));
    });
    return()=>{unsub();offUser();};
  },[offline]);

  const roles=offline?['superadmin']:userRoles(auth.user);
  const role=roles[0]||'';                     // Hauptrolle für Anzeige und Rechte

  /* Daten erst laden, wenn jemand angemeldet ist */
  useEffect(()=>{
    if(!role)return;
    setGen(g=>g+1);
    return fbOn(`${ROOT}/events`,d=>{
      setEvents(d||{});
      if(!d&&!seeded.current){seeded.current=true;fbSet(`${ROOT}/events/ev_dortmund`,buildSeed());}
    },()=>setEvents({}));
  },[role,offline]);

  /* Nur die Events, die diesem Konto zugewiesen sind */
  const visible=useMemo(()=>{
    if(!events)return {};
    const u=auth.user||{};
    if(offline||role==='superadmin'||u.allEvents!==false)return events;
    const okIds=u.events||{};
    return Object.fromEntries(Object.entries(events).filter(([id])=>okIds[id]));
  },[events,auth.user,role,offline]);

  /* Anzahl offener Zugangsanfragen — nur für Superadmin */
  const [pendingCount,setPendingCount]=useState(0);
  useEffect(()=>{
    if(role!=='superadmin'||offline){setPendingCount(0);return;}
    return fbOn(USERS,d=>setPendingCount(obj2arr(d).filter(u=>u.pending).length),()=>setPendingCount(0));
  },[role,offline]);

  const goOffline=useCallback(()=>{ MODE='local';seeded.current=false;setOffline(true);setEvents(null); },[]);
  const logout=()=>{
    ['uo-event'].forEach(k=>localStorage.removeItem(k));
    setOpenId(null);setEvents(null);
    if(offline){MODE='fb';setOffline(false);} else fbAuth.signOut();
  };
  const open=id=>{localStorage.setItem('uo-event',id);setOpenId(id);};
  const back=()=>{localStorage.removeItem('uo-event');setOpenId(null);setShowTeam(false);};
  /* Gemerktes Event vergessen, wenn es weg ist oder nicht mehr zugewiesen */
  useEffect(()=>{
    if(openId&&events&&!visible[openId]){localStorage.removeItem('uo-event');setOpenId(null);}
  },[openId,events,visible]);
  const switchRole=v=>{
    if(v==='team'){setShowTeam(true);return;}
    setShowTeam(false);
    if(v==='events'){back();return;}
    setViewAs(v);localStorage.setItem('uo-viewas',v);
    if(!openId){const first=Object.keys(events||{})[0];if(first)open(first);}
  };

  let body;
  if(!offline&&auth.state==='boot') body=<Connecting/>;
  else if(!offline&&auth.state==='out') body=<LoginScreen onOffline={goOffline} onInstall={()=>setInstallHint(true)}/>;
  else if(!role) body=<NoAccess user={auth.user||{}} onLogout={logout}/>;
  else if(!offline&&auth.user?.mustSetPassword)
    body=<SetPassword user={auth.user} onLogout={logout} onDone={()=>{}}/>;
  else if(showTeam) body=<Team me={auth.user||{}} events={events||{}} onBack={()=>setShowTeam(false)}/>;
  else if(events===null) body=<Connecting/>;
  else if(creating) body=<NewEvent onCancel={()=>setCreating(false)} onCreated={id=>{setCreating(false);open(id);}}/>;
  else if(openId&&visible[openId])
    body=<EventShell eventId={openId} role={role} roles={roles} viewAs={viewAs} setViewAs={switchRole}
      onBack={back} onLogout={logout} driverId={driverId} me={auth.user}/>;
  else body=<EventList events={visible} role={role} onOpen={open} onLogout={logout}
    canManage={role==='superadmin'||role==='leitung'} onCreate={()=>setCreating(true)}
    onSwitchRole={switchRole} onTeam={role==='superadmin'?()=>setShowTeam(true):null}
    me={auth.user} pendingCount={pendingCount} restricted={auth.user?.allEvents===false}/>;
  return(
    <React.Fragment key={gen}>
      <Toast/>
      {offline&&role&&<OfflineBanner onExit={logout}/>}
      {body}
      {installHint&&<InstallHint onClose={()=>{localStorage.setItem('uo-install-seen','1');setInstallHint(false);}}/>}
    </React.Fragment>);
}
/* ══ FEHLERFÄNGER ════════════════════════════════════════════════════
   Fängt jede Ausnahme ab, damit statt eines schwarzen Bildschirms
   immer die Ursache lesbar auf dem Handy steht.                      */
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null,info:null};}
  static getDerivedStateFromError(err){return{err};}
  componentDidCatch(err,info){console.error('[Absturz]',err,info);this.setState({info});}
  render(){
    if(!this.state.err)return this.props.children;
    const e=this.state.err;
    const txt=`${e.name||'Fehler'}: ${e.message||e}\n\n${(this.state.info?.componentStack||e.stack||'').trim().split('\n').slice(0,12).join('\n')}`;
    return(
      <div className="min-h-screen overflow-y-auto px-6 py-10 safe-top safe-bot">
        <div className="max-w-sm mx-auto space-y-4">
          <div className="bebas text-3xl text-red-400 tracking-wider">ETWAS IST ABGESTÜRZT</div>
          <div className="mono text-xs text-zinc-400 leading-relaxed">
            Die App hat einen Fehler. Schick mir den Text unten, dann kann ich ihn beheben.</div>
          <pre className="bg-zinc-900 border border-zinc-700 rounded-lg p-3 mono text-[10px] text-red-300 overflow-x-auto whitespace-pre-wrap leading-relaxed">{txt}</pre>
          <button onClick={()=>{navigator.clipboard?.writeText(txt);}}
            className="w-full border border-zinc-700 text-zinc-300 mono text-xs py-2.5 rounded-xl active:bg-zinc-900">
            Fehlertext kopieren</button>
          <button onClick={()=>this.setState({err:null,info:null})}
            className="w-full bg-amber-500 text-black bebas text-lg py-3 rounded-xl tracking-widest">ZURÜCK ZUR APP</button>
          <button onClick={()=>location.reload()}
            className="w-full border border-zinc-700 text-zinc-400 mono text-xs py-2.5 rounded-xl active:bg-zinc-900">
            App neu laden</button>
        </div>
      </div>);
  }
}
ReactDOM.createRoot(document.getElementById('root'))
  .render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
