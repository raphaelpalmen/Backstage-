/* Leaflet über mehrere Quellen laden. __leafletLog hält fest, was geklappt hat. */
window.__leafletLog = [];
window.__leafletReady = (function(){
  if (typeof L !== 'undefined'){ window.__leafletLog.push('cdnjs ✓'); return Promise.resolve(true); }
  window.__leafletLog.push('cdnjs ✗');
  var SRC = [
    ['jsDelivr','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'],
    ['unpkg',   'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',           'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js']
  ];
  return new Promise(function(res){
    var done=false, finish=function(v){ if(!done){done=true;res(v);} };
    var i=0;
    var next=function(){
      if(i>=SRC.length) return finish(false);
      var e=SRC[i++], name=e[0];
      var css=document.createElement('link'); css.rel='stylesheet'; css.href=e[1]; document.head.appendChild(css);
      var s=document.createElement('script'); s.src=e[2];
      s.onload=function(){ if(typeof L!=='undefined'){window.__leafletLog.push(name+' ✓');finish(true);} else {window.__leafletLog.push(name+' ✗ (leer)');next();} };
      s.onerror=function(){ window.__leafletLog.push(name+' ✗'); next(); };
      document.head.appendChild(s);
    };
    next();
    setTimeout(function(){ if(typeof L!=='undefined'){finish(true);} else {window.__leafletLog.push('Zeitüberschreitung');finish(false);} },12000);
  });
})();
</script>

/* ACHTUNG: dieser Speicher darf NICHT "L" heißen — das ist Leaflet. */
const LS='unrealops-local-v1';
const STORE={d:{},subs:new Map(),n:0};

const _p    = p=>String(p).split('/').filter(Boolean);
const _clone= v=>v==null?null:JSON.parse(JSON.stringify(v));
const _save = ()=>{ try{ localStorage.setItem(LS,JSON.stringify(STORE.d)); }catch(e){ console.warn('localStorage voll',e); } };
const _get  = p=>{ let c=STORE.d; for(const k of _p(p)){ if(c==null||typeof c!=='object') return null; c=c[k]; } return c===undefined?null:c; };
const _dig  = ks=>{ let c=STORE.d; for(const k of ks){ if(typeof c[k]!=='object'||c[k]===null) c[k]={}; c=c[k]; } return c; };
const _notify=()=>STORE.subs.forEach(s=>s.cb(_clone(_get(s.p))));
const _set  = (p,v)=>{ const ks=_p(p),last=ks.pop(),c=_dig(ks);
  if(v===null||v===undefined) delete c[last]; else c[last]=_clone(v);
  _save(); _notify(); };
const _upd  = (p,o)=>{ const c=_dig(_p(p));
  Object.entries(o).forEach(([k,v])=>{ if(v===null||v===undefined) delete c[k]; else c[k]=_clone(v); });
  _save(); _notify(); };
const _key  = ()=>'-L'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ── Einheitliche Helfer ───────────────────────────────────────────── */
const rep = (what,p) => e => { console.error('[FB]',what,p,e);
  if(window.__fbErr) window.__fbErr(`Schreiben fehlgeschlagen (${what}): ${e.message||e}`); throw e; };
const fbSet = (p,v)=> MODE==='local' ? (_set(p,v),Promise.resolve()) : db.ref(p).set(v).catch(rep('set',p));
const fbUpd = (p,v)=> MODE==='local' ? (_upd(p,v),Promise.resolve()) : db.ref(p).update(v).catch(rep('update',p));
const fbPush= (p,v)=> { if(MODE==='local'){ const k=_key(); _set(p+'/'+k,v); return Promise.resolve(k); }
  const r=db.ref(p).push(); return r.set(v).catch(rep('push',p)).then(()=>r.key); };
const fbDel = (p)  => MODE==='local' ? (_set(p,null),Promise.resolve()) : db.ref(p).remove().catch(rep('delete',p));
const fbOn  = (p,cb,onErr)=>{
  if(MODE==='local'){ const id=++STORE.n; STORE.subs.set(id,{p,cb}); cb(_clone(_get(p))); return ()=>STORE.subs.delete(id); }
  const r=db.ref(p);
  const h=r.on('value',s=>cb(s.val()),e=>{ console.error('[FB read]',p,e);
    if(onErr) onErr(e); else if(window.__fbErr) window.__fbErr(`Lesen fehlgeschlagen: ${e.message||e}`); });
  return ()=>r.off('value',h);
};
const fbOnce= (p)=> MODE==='local' ? Promise.resolve(_clone(_get(p))) : db.ref(p).once('value').then(s=>s.val());
/* Zähler: atomar hochzählen, damit zwei Leute am Einlass sich nicht überschreiben */
const fbInc = (p,d)=> MODE==='local'

  : db.ref(p).transaction(v=>Math.max(0,(Number(v)||0)+d)).catch(rep('zählen',p));

/* Ein Veranstaltungstag läuft von 10:00 bis 10:00 am Folgetag.
   Alles vor 10:00 gehört noch zur Nacht des Vortages.            */
const NIGHT_END=10;
const toMins=t=>{if(!t||!/^\d{1,2}:\d{2}$/.test(t))return 99999;const[h,m]=t.split(':').map(Number);return(h<NIGHT_END?h+24:h)*60+m;};
/* aktuelle Uhrzeit auf dieselbe Achse legen */
const nowMins=ts=>{const d=new Date(ts);return(d.getHours()<NIGHT_END?d.getHours()+24:d.getHours())*60+d.getMinutes();};
/* "Fr 17.07" · "18.07." · "17.07.2026" → {d,mo} */
const parseDayLabel=s=>{const m=String(s||'').match(/(\d{1,2})\s*\.\s*(\d{1,2})/);return m?{d:+m[1],mo:+m[2]}:null;};
/* Datum, dem das Jetzt zugerechnet wird (nach Mitternacht noch der Vortag) */
const eventDateOf=ts=>{const x=new Date(ts);if(x.getHours()<NIGHT_END)x.setDate(x.getDate()-1);return x;};
/* Läuft dieser Tag gerade wirklich? Tag UND Monat müssen stimmen. */
const isLiveDay=(label,ts)=>{
  const p=parseDayLabel(label); if(!p) return false;
  const e=eventDateOf(ts);
  return e.getDate()===p.d && (e.getMonth()+1)===p.mo;
};
const obj2arr=o=>Object.entries(o||{}).map(([id,v])=>({id,...v}));
const uid=()=>Math.random().toString(36).slice(2,10);
const clockNow=()=>new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const mapsUrl=(a)=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a||'')}`;
const ago=ts=>{if(!ts)return'';const s=Math.floor((Date.now()-ts)/1000);
  if(s<20)return'gerade eben';if(s<60)return s+'s her';if(s<3600)return Math.floor(s/60)+' min her';return Math.floor(s/3600)+' h her';};

function LoginScreen({onOffline,onInstall}){
  const [mode,setMode]=useState('login');
  const [f,setF]=useState({name:'',email:'',password:'',invite:'',wish:''});
  const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
  const [firstEver,setFirstEver]=useState(null);
  const set=(k,v)=>{setF(p=>({...p,[k]:v}));setErr('');};

  useEffect(()=>{ fbOnce(USERS).then(d=>{
      const n=d?Object.keys(d).length:0; setFirstEver(n===0); if(n===0)setMode('register');
    }).catch(()=>setFirstEver(false)); },[]);

  const login=async()=>{
    if(!f.email||!f.password){setErr('E-Mail und Passwort eingeben.');return;}
    setBusy(true);setErr('');
    try{ await fbAuth.signInWithEmailAndPassword(f.email.trim(),f.password); }
    catch(e){ setErr(AUTH_ERRORS[e.code]||('Anmeldung fehlgeschlagen ('+(e.code||e.message)+')')); }
    finally{ setBusy(false); }
  };
  const register=async()=>{
    if(!f.name.trim()||!f.email||!f.password){setErr('Alle Felder ausfüllen.');return;}
    if(f.password.length<6){setErr('Passwort mindestens 6 Zeichen.');return;}
    const code=f.invite.trim().toUpperCase();
    const role=firstEver?'superadmin':INVITE_ROLES[code];
    /* Ohne gültigen Code wird daraus eine Anfrage, die die Leitung freigibt. */

      const cred=await fbAuth.createUserWithEmailAndPassword(f.email.trim(),f.password);

        email:f.email.trim(),role:role||null,pending:role?null:true,
        wish:role?null:(f.wish||null),active:true,createdAt:Date.now()});

/* Beim ersten Öffnen mit Startpasswort: eigenes Passwort setzen */
function SetPassword({user,onDone,onLogout}){
  const [p1,setP1]=useState('');const [p2,setP2]=useState('');
  const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
  const save=async()=>{
    if(p1.length<6){setErr('Mindestens 6 Zeichen.');return;}
    if(p1!==p2){setErr('Die beiden Eingaben stimmen nicht überein.');return;}
    setBusy(true);setErr('');
    try{
      await fbAuth.currentUser.updatePassword(p1);
      await fbUpd(`${USERS}/${user.uid}`,{mustSetPassword:null});
      onDone();
    }catch(e){
      setErr(e.code==='auth/requires-recent-login'
        ? 'Aus Sicherheitsgründen bitte einmal ab- und wieder anmelden, dann klappt es.'
        : (AUTH_ERRORS[e.code]||('Fehler: '+(e.code||e.message))));
    }finally{ setBusy(false); }
  };
  return(
    <div className="min-h-screen flex flex-col items-center justify-center px-8 safe-top safe-bot">
      <div className="w-full max-w-[300px]">
        <div className="bebas text-3xl text-white tracking-wide leading-none">Eigenes Passwort setzen</div>
        <div className="mono text-[11px] text-zinc-500 mt-2 mb-6 leading-relaxed">
          Willkommen, {user.name||user.email}. Wähl ein Passwort, das nur du kennst — das Startpasswort gilt danach nicht mehr.</div>
        <div className="space-y-2.5">
          <input type="password" value={p1} onChange={e=>{setP1(e.target.value);setErr('');}} placeholder="Neues Passwort"
            autoComplete="new-password"
            className="w-full bg-zinc-900 border border-zinc-700 text-white mono text-sm px-4 py-3.5 rounded-xl focus:border-amber-500 placeholder-zinc-700"/>
          <input type="password" value={p2} onChange={e=>{setP2(e.target.value);setErr('');}} placeholder="Nochmal zur Sicherheit"
            autoComplete="new-password" onKeyDown={e=>e.key==='Enter'&&save()}
            className="w-full bg-zinc-900 border border-zinc-700 text-white mono text-sm px-4 py-3.5 rounded-xl focus:border-amber-500 placeholder-zinc-700"/>
        </div>
        {err&&<div className="mono text-[11px] text-amber-300 mt-3 leading-relaxed">{err}</div>}
        <button onClick={save} disabled={busy}
          className={`w-full mt-4 bebas text-xl py-3.5 rounded-xl tracking-widest ${busy?'bg-zinc-800 text-zinc-600':'bg-amber-500 text-black active:scale-[.98]'}`}>
          {busy?'MOMENT…':'SPEICHERN UND LOSLEGEN'}</button>
        <button onClick={onLogout} className="w-full mt-3 mono text-[10px] text-zinc-700 active:text-zinc-400 py-2">Abmelden</button>
      </div>
    </div>
  );
}

/* ══ MAP ═════════════════════════════════════════════════════════════ */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Ist Leaflet wirklich einsatzbereit? */
const hasLeaflet=()=>typeof L!=='undefined'&&L&&typeof L.map==='function';
/* Ab wann gilt eine Ortung als eingefroren (Handy gesperrt / App im Hintergrund) */
const STALE_MS=2*60*1000;
/* Bei Bedarf zur Laufzeit nachladen — mehrere Quellen nacheinander */
let _leafletTry=null;
function loadLeaflet(){
  if(hasLeaflet())return Promise.resolve(true);
  if(_leafletTry)return _leafletTry;
  const SRC=[
    ['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'],
    ['jsDelivr','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'],
    ['unpkg','https://unpkg.com/leaflet@1.9.4/dist/leaflet.css','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'],
  ];
  _leafletTry=new Promise(res=>{
    let i=0;
    const next=()=>{
      if(hasLeaflet())return res(true);
      if(i>=SRC.length)return res(false);
      const [name,cssUrl,jsUrl]=SRC[i++];
      const css=document.createElement('link');css.rel='stylesheet';css.href=cssUrl;document.head.appendChild(css);
      const s=document.createElement('script');s.src=jsUrl;
      s.onload=()=>{ (window.__leafletLog||[]).push(name+(hasLeaflet()?' ✓':' ✗')); hasLeaflet()?res(true):next(); };
      s.onerror=()=>{ (window.__leafletLog||[]).push(name+' ✗'); next(); };
      document.head.appendChild(s);
    };
    next();
  });
  return _leafletTry;
}
const okCoord=(a,b)=>Number.isFinite(+a)&&Number.isFinite(+b)&&Math.abs(+a)<=90&&Math.abs(+b)<=180;

function MapPanel({meta,drivers}){
  const el=useRef(null),map=useRef(null),layer=useRef(null);
  const [fail,setFail]=useState('');
  /* Nur die Werte, die die Karte wirklich betreffen — verhindert Dauerneuzeichnen */
  const sig=JSON.stringify([
    meta.hotelLat,meta.hotelLng,meta.hotelName,meta.hotelAddr,
    meta.venueLat,meta.venueLng,meta.venueName,meta.venueAddr,
    drivers.map(d=>[d.id,d.active,d.lat,d.lng,d.name,d.updatedAt]),
  ]);

  const [ready,setReady]=useState(false);
  const [tick,setTick]=useState(0);          // erlaubt erneuten Versuch ohne Neuladen
  useEffect(()=>{
    let dead=false;
    const build=()=>{
      if(dead||!el.current||map.current)return true;
      try{
        const lat=Number.isFinite(+meta.venueLat)?+meta.venueLat:51.5145;
        const lng=Number.isFinite(+meta.venueLng)?+meta.venueLng:7.4610;
        map.current=L.map(el.current,{zoomControl:true,attributionControl:true}).setView([lat,lng],13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map.current);
        layer.current=L.layerGroup().addTo(map.current);
        setFail('');setReady(true);
        // mehrfach nachmessen: der Container bekommt seine Höhe erst nach dem Layout
        [60,200,600].forEach(ms=>setTimeout(()=>{try{map.current&&map.current.invalidateSize();}catch(e){}},ms));
        return true;
      }catch(e){ console.error('[Karte]',e); setFail('Karte konnte nicht aufgebaut werden: '+(e.message||e)); return false; }
    };
    /* Leaflet direkt prüfen — nicht auf ein Versprechen verlassen */
    if(hasLeaflet()){ build(); return()=>{dead=true;try{map.current&&map.current.remove();}catch(e){}map.current=null;layer.current=null;}; }
    /* sonst: warten bzw. selbst nachladen */
    loadLeaflet().then(ok=>{
      if(dead)return;
      if(ok&&hasLeaflet()) build();
      else setFail('Kartenbibliothek (Leaflet) lässt sich nicht laden. Prüf die Internetverbindung oder einen Blocker im Browser.');
    });
    return()=>{ dead=true; try{map.current&&map.current.remove();}catch(e){} map.current=null;layer.current=null; };
  },[tick]);

  useEffect(()=>{
    if(fail||!ready||!map.current||!layer.current)return;
    try{
      layer.current.clearLayers();
      const pts=[];
      const bubble=(bg,fg,txt,sub,subFg,tail)=>
        `<div style="display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%)">
           <div style="background:${bg};color:${fg};font:700 11px 'IBM Plex Mono',monospace;padding:3px 7px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.6)">${txt}</div>
           ${sub?`<div style="background:rgba(9,9,11,.9);color:${subFg};font:400 9px 'IBM Plex Mono',monospace;padding:2px 6px;border-radius:4px;margin-top:2px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis">${sub}</div>`:''}
           ${tail}
         </div>`;
      const pin=(lat,lng,html)=>{
        if(!okCoord(lat,lng))return;
        pts.push([+lat,+lng]);
        L.marker([+lat,+lng],{icon:L.divIcon({className:'',html,iconSize:[0,0]})}).addTo(layer.current);
      };
      pin(meta.hotelLat,meta.hotelLng,bubble('#fbbf24','#09090b',
        '🏨 '+esc(meta.hotelName||'Hotel'),esc(meta.hotelAddr),'#a1a1aa','<div style="width:2px;height:9px;background:#fbbf24"></div>'));
      pin(meta.venueLat,meta.venueLng,bubble('#f472b6','#09090b',
        '📍 '+esc(meta.venueName||'Venue'),esc(meta.venueAddr),'#a1a1aa','<div style="width:2px;height:9px;background:#f472b6"></div>'));
      drivers.forEach(d=>{
        if(!d.active||!okCoord(d.lat,d.lng))return;
        const age=Date.now()-(d.updatedAt||0);
        const stale=age>STALE_MS;                 // Ortung eingefroren?
        const col=stale?'#a1a1aa':'#3b82f6';
        L.circle([+d.lat,+d.lng],{radius:110,color:col,weight:1,fillColor:col,fillOpacity:stale?.06:.13}).addTo(layer.current);
        pin(d.lat,d.lng,bubble(col,'#fff',(stale?'⏸ ':'🚐 ')+esc(d.name||'Fahrer'),
          esc((stale?'zuletzt ':'')+ago(d.updatedAt)),stale?'#d4d4d8':'#93c5fd',
          `<div class="drv-pin" style="margin-top:3px;background:${col};box-shadow:0 0 0 3px ${col}55"></div>`));
      });
      if(pts.length>1)map.current.fitBounds(L.latLngBounds(pts),{padding:[55,55],maxZoom:15});
      else if(pts.length===1)map.current.setView(pts[0],14);
    }catch(e){ console.error('[Karte zeichnen]',e); setFail('Karte konnte nicht gezeichnet werden: '+(e.message||e)); }
  },[sig,fail,ready]);

  if(fail)return(
    <div className="w-full h-full flex flex-col items-center justify-center gap-3 px-6 text-center">
      <div className="text-3xl opacity-40">🗺</div>
      <div className="mono text-[11px] text-zinc-400 leading-relaxed max-w-[280px]">{fail}</div>
      <div className="mono text-[10px] text-zinc-600 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2">
        Quellen: {(window.__leafletLog||[]).join(' · ')||'—'}</div>
      <div className="flex gap-2">

/* ══ LINEUP ══════════════════════════════════════════════════════════ */
function Lineup({ev,base,editable}){
  const meta=ev.meta||{};
  const days=meta.days||[];const floors=meta.floors||[];
  const [day,setDay]=useState(days[0]);
  const [floor,setFloor]=useState('ALL');
  const [edit,setEdit]=useState(null);
  useEffect(()=>{if(!days.includes(day))setDay(days[0]);},[days.join('|')]);
  const artists=obj2arr(ev.artists).filter(a=>a.day===day&&(floor==='ALL'||a.floor===floor))
    .sort((a,b)=>toMins(a.setStart)-toMins(b.setStart));
  const st=ev.status||{};
  const keysFor=a=>{
    const k=[];
    if(obj2arr(ev.pickups).some(p=>p.artistId===a.id)||a.contactPhone)k.push('pickup_ok');
    k.push('im_club','rider_ok');
    if(a.soundcheck)k.push('soundcheck_ok');
    k.push('set_start','set_end','ausgecheckt');
    return k;
  };
  const setSt=(aid,k,v)=>fbSet(`${base}/status/${aid}/${k}`,v);
  const upd=(aid,patch)=>fbUpd(`${base}/artists/${aid}`,patch);

  return(
    <div className="pb-24">
      <div className="flex gap-2 px-4 pt-4 pb-2">
        {days.map(d=>(
          <button key={d} onClick={()=>setDay(d)}
            className={`flex-1 py-2.5 rounded-lg mono text-sm font-bold border transition-all active:scale-[.98]
              ${day===d?'bg-amber-500/10 border-amber-500/40 text-amber-400':'bg-zinc-900 border-zinc-800 text-zinc-500'}`}>{d}</button>
        ))}
      </div>
      <div className="flex gap-1.5 px-4 pb-4 overflow-x-auto">
        <button onClick={()=>setFloor('ALL')}
          className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-[11px] mono font-bold border transition-all
            ${floor==='ALL'?'text-zinc-100 border-zinc-500 bg-zinc-800':'text-zinc-600 border-zinc-800 bg-zinc-900'}`}>Alle</button>
        {floors.map(f=>{const c=facc(floors,f);
          return <button key={f} onClick={()=>setFloor(f)}
            className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-[11px] mono font-bold border transition-all
              ${floor===f?`${c.t} ${c.b} ${c.bg}`:'text-zinc-600 border-zinc-800 bg-zinc-900'}`}>{f}</button>;})}
      </div>
      <div className="px-4 space-y-2.5">
        {artists.length===0&&<Empty>Kein Line-up für {day}{floor!=='ALL'?` · ${floor}`:''}.</Empty>}
        {artists.map(a=>{
          const s=st[a.id]||{};const keys=keysFor(a);
          const pct=Math.round(keys.filter(k=>s[k]).length/keys.length*100);
          const live=s.set_start&&!s.set_end;const done=!!s.set_end;
          const c=facc(floors,a.floor);
          return(
            <div key={a.id} className={`rounded-xl border transition-all
              ${done?'border-zinc-800/50 bg-zinc-900/25 opacity-45':live?'border-emerald-500/45 bg-emerald-950/25':'border-zinc-800 bg-zinc-900/55'}`}>
              <div className="flex gap-3 px-3.5 py-3">
                <div className="w-[62px] flex-shrink-0 text-center pt-0.5">
                  {editable
                    ?<><TimeEdit value={a.setStart} onSave={v=>upd(a.id,{setStart:v})}/>
                       <div className="text-zinc-700 text-[10px] leading-tight">│</div>
                       <TimeEdit value={a.setEnd} onSave={v=>upd(a.id,{setEnd:v})} cls="text-zinc-500" size="text-xs"/></>
                    :<><div className="mono text-sm font-bold text-amber-400">{a.setStart}</div>
                       <div className="mono text-xs text-zinc-500">{a.setEnd}</div></>}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap mb-1">
                    <span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${live?'bg-emerald-400':done?'bg-zinc-700':'bg-zinc-600'}`}/>
                    <span className="text-white font-bold text-sm mono truncate">{a.name}</span>
                    {floor==='ALL'&&<span className={`text-[9px] mono px-1.5 py-0.5 rounded border ${c.t} ${c.b} ${c.bg}`}>{a.floor}</span>}
                    {a.soundcheck&&<span className="text-[9px] mono bg-violet-500/15 text-violet-300 border border-violet-500/30 px-1.5 py-0.5 rounded">SC {a.soundcheck}</span>}
                    {editable&&<button onClick={()=>setEdit(a)} className="ml-auto text-zinc-600 text-xs px-1.5 active:text-amber-400">✎</button>}
                  </div>
                  {a.notes&&<div className={`text-[11px] mono mb-2 leading-snug ${a.notes.startsWith('⚠')?'text-red-300':'text-zinc-500'}`}>{a.notes}</div>}
                  <div className="flex items-center gap-2 mb-2">
                    <div className="flex-1 h-1 bg-zinc-800 rounded-full overflow-hidden">
                      <div className="h-full rounded-full transition-all" style={{width:pct+'%',background:pct===100?'#10b981':'#f59e0b'}}/></div>
                    <span className="text-[10px] text-zinc-600 mono w-8 text-right">{pct}%</span>
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {keys.map(k=>{const lb=STATUS_ALL.find(x=>x.k===k)?.l||k;
                      return <Chip key={k} label={lb} checked={!!s[k]} onToggle={()=>setSt(a.id,k,!s[k])}/>;})}
                  </div>
                  {a.contactPhone&&(
                    <a href={`tel:${a.contactPhone}`} className="flex items-center gap-1.5 mt-2 text-[11px] mono text-zinc-500 active:text-blue-300">
                      📞 {a.contactName||'Kontakt'} · {a.contactPhone}</a>)}
                  <RiderBlock a={a} base={base} editable={editable}/>
                </div>
              </div>
            </div>
          );
        })}
        {editable&&<div className="pt-1"><AddBtn onClick={()=>setEdit({_new:true,day,floor:floor==='ALL'?floors[0]:floor,setStart:'',setEnd:'',name:''})}>Artist hinzufügen</AddBtn></div>}
      </div>
      <ArtistSheet a={edit} meta={meta} ev={ev} base={base} onClose={()=>setEdit(null)}
        onDelete={id=>{
          fbDel(`${base}/artists/${id}`);fbDel(`${base}/status/${id}`);
          fbDel(`${base}/travel/i_${id}`);fbDel(`${base}/travel/o_${id}`);
          obj2arr(ev.pickups).filter(p=>p.artistId===id).forEach(p=>fbDel(`${base}/pickups/${p.id}`));
          setEdit(null);}}/>
    </div>
  );
}

            :<div className="mono text-[11px] text-violet-200 leading-relaxed whitespace-pre-line">{a.tech}</div>}
        </div>)}

        <label className="block"><div className="text-violet-400/80 text-[10px] mono uppercase tracking-wider mb-1">🎛 Techrider</div>

          <div className="space-y-2">

              <div key={i} className="bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 space-y-2">

                    className="w-20 bg-zinc-800 border border-zinc-700 text-white mono text-sm px-2 py-2 rounded text-center focus:border-blue-500 placeholder-zinc-600"/>
                  <input value={g.label||''} onChange={e=>setGrounds(l=>l.map((x,j)=>j===i?{...x,label:e.target.value}:x))}
                    placeholder={f.name||'Bezeichnung'}
                    className="flex-1 min-w-0 bg-zinc-800 border border-zinc-700 text-white mono text-sm px-2 py-2 rounded focus:border-blue-500 placeholder-zinc-600"/>
                  <button onClick={()=>{ if(g.id)setDropped(d=>[...d,g.id]); setGrounds(l=>l.filter((_,j)=>j!==i)); }}
                    className="text-zinc-600 mono text-xs px-1.5 active:text-red-400">✕</button>
                </div>
                <div className="flex gap-2 items-center">
                  <input value={g.from||''} onChange={e=>setGrounds(l=>l.map((x,j)=>j===i?{...x,from:e.target.value}:x))}

                    className="flex-1 min-w-0 bg-zinc-800 border border-zinc-700 text-white mono text-xs px-2 py-1.5 rounded focus:border-blue-500 placeholder-zinc-600"/>
                  <span className="text-amber-500 text-xs flex-shrink-0">→</span>
                  <input value={g.to||''} onChange={e=>setGrounds(l=>l.map((x,j)=>j===i?{...x,to:e.target.value}:x))}
                    placeholder="Venue"
                    className="flex-1 min-w-0 bg-zinc-800 border border-zinc-700 text-white mono text-xs px-2 py-1.5 rounded focus:border-blue-500 placeholder-zinc-600"/>
                  <select value={g.day||f.day||''} onChange={e=>setGrounds(l=>l.map((x,j)=>j===i?{...x,day:e.target.value}:x))}
                    className="bg-zinc-800 border border-zinc-700 text-zinc-300 mono text-[10px] px-1.5 py-1.5 rounded flex-shrink-0 max-w-[90px]">

          </div>

        <button onClick={save} className="w-full bg-amber-500 text-black bebas text-xl py-3 rounded-xl tracking-widest active:scale-[.98]">SPEICHERN</button>
      </div>
    </Sheet>
  );
}

/* ══ PICKUPS ═════════════════════════════════════════════════════════ */
function Pickups({ev,base,editable,role}){
  const drivers=useDrivers();
  const meta=ev.meta||{};const days=meta.days||[];
  const [day,setDay]=useState('ALL');
  const [edit,setEdit]=useState(null);
  const dIdx=d=>{const i=days.indexOf(d);return i<0?999:i;};
  const all=obj2arr(ev.pickups).sort((a,b)=>
    (dIdx(a.day)-dIdx(b.day))||(toMins(a.time)-toMins(b.time)));
  const list=day==='ALL'?all:all.filter(p=>p.day===day);
  const open=all.filter(p=>!p.done).length;
  const upd=(id,patch)=>fbUpd(`${base}/pickups/${id}`,patch);
  return(
    <div className="pb-24 pt-4">
      <div className="px-4 flex gap-1.5 mb-3 overflow-x-auto">
        <button onClick={()=>setDay('ALL')} className={`flex-shrink-0 px-3 py-1.5 rounded-lg mono text-[11px] font-bold border ${day==='ALL'?'text-zinc-100 border-zinc-500 bg-zinc-800':'text-zinc-600 border-zinc-800 bg-zinc-900'}`}>Alle</button>
        {days.map(d=><button key={d} onClick={()=>setDay(d)} className={`flex-shrink-0 px-3 py-1.5 rounded-lg mono text-[11px] font-bold border ${day===d?'text-amber-400 border-amber-500/40 bg-amber-500/10':'text-zinc-600 border-zinc-800 bg-zinc-900'}`}>{d}</button>)}
      </div>
      <div className="px-4">
        <SectionLabel right={<span className={`mono text-[10px] px-2 py-0.5 rounded-full border ${open?'text-amber-400 border-amber-500/30 bg-amber-500/10':'text-emerald-400 border-emerald-500/30 bg-emerald-500/10'}`}>{open} offen</span>}>
          {list.length} Transfers</SectionLabel>
        <div className="space-y-2">
          {list.length===0&&<Empty>Keine Transfers.</Empty>}
          {list.map(p=>(
            <div key={p.id} className={`rounded-xl border px-3.5 py-3 transition-all
              ${p.done?'border-zinc-800/40 bg-zinc-900/25 opacity-45':'border-zinc-800 bg-zinc-900/60'}`}>
              <div className="flex items-center gap-3">
                <Check checked={!!p.done} onToggle={()=>upd(p.id,{done:!p.done,doneAt:!p.done?Date.now():null,doneBy:!p.done?role:null})}/>
                <div className="flex-1 min-w-0">
                  {editable
                    ?<TextEdit value={p.label} onSave={v=>upd(p.id,{label:v})} cls={`text-sm font-bold ${p.done?'text-zinc-600 line-through':'text-zinc-100'}`}/>
                    :<div className={`mono text-sm font-bold ${p.done?'text-zinc-600 line-through':'text-zinc-100'}`}>{p.label}</div>}
                  <div className="mono text-[10px] text-zinc-500 mt-0.5">
                    {p.day} · {p.from||'Hotel'} → {p.to||'Venue'}
                    {p.done&&p.doneAt&&<span className="text-emerald-500/70"> · ✓ {new Date(p.doneAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</span>}
                  </div>
                  <div className="mono text-[10px] mt-0.5">
                    <span className="text-zinc-600">Fahrer: </span>
                    <span className={p.assignedTo?'text-blue-300':'text-zinc-500'}>
                      {p.assignedTo?(drivers.find(d=>d.uid===p.assignedTo)?.name||'unbekannt'):'alle'}</span>
                  </div>
                </div>
                <TimeEdit value={p.time} onSave={v=>upd(p.id,{time:v})}/>
                {editable&&<button onClick={()=>setEdit(p)} className="text-zinc-600 text-xs px-1 active:text-amber-400">✎</button>}
              </div>
            </div>
          ))}
        </div>
        {editable&&<div className="pt-3"><AddBtn onClick={()=>setEdit({_new:true,day:day==='ALL'?days[0]:day,time:'',label:'',from:'Hotel',to:'Venue'})}>Pickup hinzufügen</AddBtn></div>}
      </div>
      <PickupSheet p={edit} meta={meta} onClose={()=>setEdit(null)}
        onSave={(id,d)=>{fbSet(`${base}/pickups/${id}`,d);setEdit(null);}}
        onDelete={id=>{fbDel(`${base}/pickups/${id}`);setEdit(null);}}/>
    </div>
  );
}
function PickupSheet({p,meta,onClose,onSave,onDelete}){
  const drivers=useDrivers();
  const [f,setF]=useState({});
  useEffect(()=>{if(p)setF({label:'',time:'',day:'',from:'Hotel',to:'Venue',done:false,notes:'',assignedTo:null,...p});},[p]);
  if(!p)return null;
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  return(
    <Sheet open={!!p} onClose={onClose} title={p._new?'Neuer Pickup':'Pickup bearbeiten'}
      onDelete={p._new?null:()=>confirm('Pickup löschen?')&&onDelete(p.id)}>
      <div className="space-y-3">
        <Field label="Bezeichnung" value={f.label} onChange={v=>set('label',v)} placeholder="z. B. Artist Pickup"/>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Uhrzeit" value={f.time} onChange={v=>set('time',v)} placeholder="21:15"/>
          <label className="block"><div className="text-zinc-500 text-[10px] mono uppercase tracking-wider mb-1">Tag</div>
            <select value={f.day} onChange={e=>set('day',e.target.value)}
              className="w-full bg-zinc-900 border border-zinc-700 text-zinc-100 mono text-sm px-3 py-2.5 rounded-lg focus:border-amber-500">
              {(meta.days||[]).map(d=><option key={d} value={d}>{d}</option>)}</select></label>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Von" value={f.from} onChange={v=>set('from',v)} placeholder="Hotel"/>
          <Field label="Nach" value={f.to}  onChange={v=>set('to',v)}   placeholder="Venue"/>
        </div>
        <AssignPicker value={f.assignedTo} onSet={v=>set('assignedTo',v)} drivers={drivers}/>
        <button onClick={()=>{const{id,_new,...r}=f;if(r.label?.trim())onSave(p._new?'p'+uid():p.id,r);}}
          className="w-full bg-amber-500 text-black bebas text-xl py-3 rounded-xl tracking-widest active:scale-[.98]">SPEICHERN</button>
      </div>
    </Sheet>
  );
}

/* ══ GUESTS ══════════════════════════════════════════════════════════ */
function Guests({ev,base}){
  const [which,setWhich]=useState('guestlist');
  const [q,setQ]=useState('');const [add,setAdd]=useState(false);
  const [paying,setPaying]=useState(null);
  const activeBlock=obj2arr(ev.kasse?.blocks).find(b=>!b.closedAt);
  const [nName,setNName]=useState('');const [nPlus,setNPlus]=useState('0');const [nNote,setNNote]=useState('');
  const path=`${base}/${which}`;
  const raw=obj2arr(ev[which]);
  const rows=raw.filter(g=>(g.name||'').toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=>(a.checkedIn===b.checkedIn)?(a.name||'').localeCompare(b.name||''):(a.checkedIn?1:-1));
  const inN=raw.filter(g=>g.checkedIn).length;
  const heads=raw.reduce((s,g)=>s+1+(+g.plus||0),0);
  const headsIn=raw.filter(g=>g.checkedIn).reduce((s,g)=>s+1+(+g.plus||0),0);
  const create=()=>{if(!nName.trim())return;
    fbPush(path,{name:nName.trim(),plus:+nPlus||0,note:nNote.trim(),checkedIn:false,createdAt:Date.now()});
    setNName('');setNPlus('0');setNNote('');};
  return(
    <div className="flex flex-col flex-1 min-h-0">
      <div className="flex border-b border-zinc-800 flex-shrink-0">
        {[{id:'guestlist',l:'GÄSTELISTE'},{id:'friendslist',l:'FRIENDSLIST'}].map(t=>(
          <button key={t.id} onClick={()=>{setWhich(t.id);setQ('');}}
            className={`flex-1 py-2.5 bebas text-sm tracking-wider border-b-2 transition-all
              ${which===t.id?'text-emerald-400 border-emerald-500':'text-zinc-600 border-transparent'}`}>{t.l}</button>))}
      </div>
      <div className="flex items-center gap-4 px-4 py-3 border-b border-zinc-800 flex-shrink-0">
        <div><div className="bebas text-2xl text-emerald-400 leading-none">{inN}<span className="text-zinc-700">/{raw.length}</span></div>
          <div className="mono text-[9px] text-zinc-600 uppercase tracking-wider mt-0.5">Einträge</div></div>
        <div><div className="bebas text-2xl text-zinc-300 leading-none">{headsIn}<span className="text-zinc-700">/{heads}</span></div>
          <div className="mono text-[9px] text-zinc-600 uppercase tracking-wider mt-0.5">Köpfe inkl. +X</div></div>
        <div className="flex-1 h-1.5 bg-zinc-800 rounded-full overflow-hidden ml-1">
          <div className="h-full bg-emerald-500 rounded-full transition-all" style={{width:(raw.length?inN/raw.length*100:0)+'%'}}/></div>
      </div>
      <div className="px-4 pt-3 pb-2 flex gap-2 flex-shrink-0">
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Name suchen…"
          className="flex-1 bg-zinc-900 border border-zinc-800 text-zinc-100 mono text-sm px-3 py-2.5 rounded-xl focus:border-emerald-500 placeholder-zinc-700 transition-colors"/>
        <button onClick={()=>setAdd(!add)}
          className={`px-4 rounded-xl mono text-lg font-bold active:scale-95 transition-all ${add?'bg-zinc-700 text-zinc-300':'bg-emerald-500 text-black'}`}>{add?'✕':'+'}</button>
      </div>
      {add&&(
        <div className="px-4 pb-3 flex-shrink-0 slide">
          <div className="bg-zinc-900 border border-emerald-500/30 rounded-xl p-3 space-y-2">
            <input autoFocus value={nName} onChange={e=>setNName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&create()}
              placeholder="Name" className="w-full bg-zinc-800 border border-zinc-700 text-white mono text-sm px-3 py-2 rounded-lg focus:border-emerald-500 placeholder-zinc-700"/>
            <div className="flex gap-2">
              <div className="flex items-center gap-1.5 bg-zinc-800 border border-zinc-700 rounded-lg px-2.5">
                <span className="mono text-xs text-zinc-500">+</span>
                <input value={nPlus} onChange={e=>setNPlus(e.target.value)} type="number" min="0" max="20"
                  className="w-10 text-white mono text-sm py-2 text-center"/></div>
              <input value={nNote} onChange={e=>setNNote(e.target.value)} onKeyDown={e=>e.key==='Enter'&&create()}
                placeholder="Notiz (optional)" className="flex-1 bg-zinc-800 border border-zinc-700 text-white mono text-sm px-3 py-2 rounded-lg focus:border-emerald-500 placeholder-zinc-700"/>
              <button onClick={create} className="bg-emerald-500 text-black mono text-xs font-bold px-4 rounded-lg active:scale-95">OK</button>
            </div>
          </div>
        </div>
      )}
      <div className="flex-1 overflow-y-auto px-4 safe-bot">
        {rows.length===0&&<Empty>{q?'Niemanden gefunden.':'Noch keine Einträge.\nMit + hinzufügen.'}</Empty>}
        {rows.map(g=><GuestRow key={g.id} g={g} path={path}
          isFriends={which==='friendslist'}
          onCheckIn={()=>setPaying(g)}/>)}
      </div>
      <PaySheet g={paying} price={activeBlock?.friendsPrice} open={!!paying}
        onClose={()=>setPaying(null)}
        onDone={(pay,qty,amount)=>{
          fbUpd(`${path}/${paying.id}`,{checkedIn:true,inAt:Date.now(),
            pay,qty,unitPrice:pay==='free'?0:(Number(activeBlock?.friendsPrice)||0),
            amount,blockId:activeBlock?.id||null});
          setPaying(null);
        }}/>
    </div>
  );
}
/* Bar / EC / frei beim Einchecken auf der Friendslist */
function PaySheet({g,price,open,onClose,onDone}){
  const [qty,setQty]=useState(1);
  useEffect(()=>{ if(g)setQty(1+(Number(g.plus)||0)); },[g]);
  if(!open||!g)return null;
  const p=Number(price)||0;
  const total=p*qty;
  const noPrice=!price&&price!==0;
  const Btn=({pay,label,color,sub})=>(
    <button onClick={()=>onDone(pay,qty,pay==='free'?0:total)}
      className="flex-1 rounded-xl py-3.5 active:scale-[.97] transition-transform"
      style={{background:color,color:'#09090b'}}>
      <span className="block bebas text-xl tracking-wide leading-none">{label}</span>
      <span className="block mono text-[10px] font-bold mt-0.5 opacity-70">{sub}</span>
    </button>);
  return(
    <Sheet open={open} onClose={onClose} title={g.name||'Gast'}>
      <div className="space-y-4">
        {noPrice&&(
          <div className="rounded-xl border border-amber-500/40 bg-amber-500/10 px-3.5 py-2.5 mono text-[11px] text-amber-200 leading-relaxed">
            Die Kasse ist noch nicht geöffnet — es ist kein Friendslist-Preis hinterlegt.
            Du kannst trotzdem als „frei" einchecken.</div>)}

        <div>
          <div className="mono text-[10px] text-zinc-500 uppercase tracking-wider mb-2">Wie viele Personen?</div>
          <div className="flex items-center gap-3">
            <button onClick={()=>setQty(n=>Math.max(1,n-1))}
              className="w-14 h-14 flex-shrink-0 rounded-xl bg-zinc-800 border border-zinc-700 text-zinc-200 text-2xl leading-none active:bg-zinc-700">−</button>
            <div className="flex-1 min-w-0 text-center">
              <div className="bebas text-4xl text-white leading-none">{qty}</div>
              {(Number(g.plus)||0)>0&&<div className="mono text-[9px] text-zinc-600 mt-0.5">eingetragen: 1 +{g.plus}</div>}
            </div>
            <button onClick={()=>setQty(n=>n+1)}
              className="w-14 h-14 flex-shrink-0 rounded-xl bg-zinc-800 border border-zinc-700 text-zinc-200 text-2xl leading-none active:bg-zinc-700">+</button>
          </div>
        </div>

        {!noPrice&&(
          <div className="rounded-xl border border-zinc-800 bg-zinc-900/70 px-4 py-3 flex items-baseline justify-between">
            <span className="mono text-[11px] text-zinc-400">{qty} × {eur(p)}</span>
            <span className="bebas text-3xl text-amber-400 leading-none">{eur(total)}</span>
          </div>)}

        <div>
          <div className="mono text-[10px] text-zinc-500 uppercase tracking-wider mb-2">Wie bezahlt?</div>
          <div className="flex gap-2">
            <Btn pay="bar" label="BAR" color="#34d399" sub={noPrice?'':eur(total)}/>
            <Btn pay="ec"  label="EC"  color="#60a5fa" sub={noPrice?'':eur(total)}/>
          </div>
          <button onClick={()=>onDone('free',qty,0)}
            className="w-full mt-2 border border-zinc-700 text-zinc-400 mono text-xs py-2.5 rounded-xl active:bg-zinc-900">
            Frei / Gast des Hauses</button>
        </div>
      </div>
    </Sheet>
  );
}
const PAYTAG={bar:{l:'BAR',c:'#34d399'},ec:{l:'EC',c:'#60a5fa'},free:{l:'FREI',c:'#71717a'}};
function GuestRow({g,path,isFriends,onCheckIn}){
  const [ed,setEd]=useState(false);
  const [n,setN]=useState(g.name);const [p,setP]=useState(String(g.plus||0));const [nt,setNt]=useState(g.note||'');
  useEffect(()=>{setN(g.name);setP(String(g.plus||0));setNt(g.note||'');},[g.name,g.plus,g.note]);
  const save=()=>{fbUpd(`${path}/${g.id}`,{name:n,plus:+p||0,note:nt});setEd(false);};
  const toggle=()=>{
    if(g.checkedIn) fbUpd(`${path}/${g.id}`,{checkedIn:false,inAt:null,pay:null,qty:null,unitPrice:null,amount:null,blockId:null});
    else if(isFriends) onCheckIn();
    else fbUpd(`${path}/${g.id}`,{checkedIn:true,inAt:Date.now()});
  };
  const tag=g.checkedIn&&g.pay?PAYTAG[g.pay]:null;
  return(
    <div className={`flex items-center gap-3 py-2.5 border-b border-zinc-800/60 transition-all ${g.checkedIn?'opacity-45':''}`}>
      <Check checked={!!g.checkedIn} onToggle={toggle} size={32}/>
      <div className="flex-1 min-w-0">
        {ed?(
          <div className="space-y-1.5">
            <div className="flex gap-1.5">
              <input value={n} onChange={e=>setN(e.target.value)} onKeyDown={e=>e.key==='Enter'&&save()}
                className="flex-1 bg-zinc-800 border border-amber-500 text-white mono text-sm px-2 py-1.5 rounded"/>
              <input value={p} onChange={e=>setP(e.target.value)} type="number" min="0"
                className="w-12 bg-zinc-800 border border-zinc-700 text-white mono text-sm px-1 py-1.5 rounded text-center"/>
            </div>
            <div className="flex gap-1.5">
              <input value={nt} onChange={e=>setNt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&save()} placeholder="Notiz"
                className="flex-1 bg-zinc-800 border border-zinc-700 text-white mono text-xs px-2 py-1.5 rounded placeholder-zinc-700"/>
              <button onClick={save} className="bg-emerald-500 text-black mono text-xs font-bold px-3 rounded">✓</button>
            </div>
          </div>
        ):(
          <>
            <div className="flex items-center gap-1.5">
              <span className={`mono text-sm font-bold truncate ${g.checkedIn?'text-zinc-500 line-through':'text-zinc-100'}`}>{g.name}</span>
              {g.plus>0&&<span className="mono text-[11px] text-amber-500/80 flex-shrink-0">+{g.plus}</span>}
              {tag&&<span className="mono text-[8px] font-bold px-1.5 py-0.5 rounded flex-shrink-0"
                style={{color:tag.c,background:tag.c+'22',border:'1px solid '+tag.c+'55'}}>{tag.l}</span>}
            </div>
            {g.note&&<div className="mono text-[10px] text-zinc-600 truncate">{g.note}</div>}
            {g.checkedIn&&g.inAt&&(
              <div className="mono text-[9px] text-emerald-600">
                ✓ {new Date(g.inAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
                {g.pay&&g.pay!=='free'&&<span className="text-zinc-500"> · {g.qty}× · {eur(g.amount)}</span>}
                {g.pay==='free'&&<span className="text-zinc-500"> · {g.qty}× frei</span>}
              </div>)}
          </>
        )}
      </div>
      <button onClick={()=>setEd(!ed)} className="text-zinc-700 text-xs px-1.5 py-1 active:text-amber-400">✎</button>
      <button onClick={()=>confirm(`"${g.name}" löschen?`)&&fbDel(`${path}/${g.id}`)} className="text-zinc-700 text-xs px-1.5 py-1 active:text-red-400">✕</button>
    </div>
  );
}

/* ══ FAHRER ══════════════════════════════════════════════════════════ */
function FahrerPanel({ev,base,driverId,account}){
  const meta=ev.meta||{};
  const me=(ev.drivers||{})[driverId]||{};
  const [name,setName]=useState(me.name||localStorage.getItem('uo-drivername')||'');
  const [on,setOn]=useState(!!me.active);
  const [err,setErr]=useState('');
  const [awake,setAwake]=useState(false);
  const [fixes,setFixes]=useState(0);
  const [lastFix,setLastFix]=useState(null);
  const [,tick]=useState(0);
  const watch=useRef(null),wake=useRef(null);
  useEffect(()=>{if(me.name&&!name)setName(me.name);},[me.name]);
  useEffect(()=>{const t=setInterval(()=>tick(n=>n+1),10000);return()=>clearInterval(t);},[]);
  useEffect(()=>()=>{
    if(watch.current!=null)navigator.geolocation.clearWatch(watch.current);
    try{ wake.current&&wake.current.release(); }catch(e){}
  },[]);
  /* Nach dem Zurückholen aus dem Hintergrund die Bildschirmsperre neu anfordern */
  useEffect(()=>{
    const onVis=()=>{ if(document.visibilityState==='visible'&&on&&!wake.current)lockScreen(); };
    document.addEventListener('visibilitychange',onVis);
    return()=>document.removeEventListener('visibilitychange',onVis);
  },[on]);
  const start=async()=>{
    if(!navigator.geolocation){setErr('Gerät unterstützt kein GPS');return;}
    setErr('');
    watch.current=navigator.geolocation.watchPosition(
      pos=>{ setFixes(n=>n+1); setLastFix(Date.now());
        fbSet(`${base}/drivers/${driverId}`,{name:name.trim()||'Fahrer',active:true,
          lat:pos.coords.latitude,lng:pos.coords.longitude,
          acc:Math.round(pos.coords.accuracy||0),updatedAt:Date.now()}); },
      e=>setErr(e.code===1?'Standortfreigabe verweigert — in den Einstellungen des Browsers erlauben'
        :e.code===3?'Kein GPS-Empfang — versuche es weiter':'Standort nicht verfügbar'),
      {enableHighAccuracy:true,maximumAge:8000,timeout:20000});
    setOn(true);
    lockScreen();
  };
  /* Display wachhalten — sonst pausiert der Browser die Standortabfrage */
  const lockScreen=async()=>{
    try{
      if('wakeLock' in navigator){
        wake.current=await navigator.wakeLock.request('screen');
        setAwake(true);
        wake.current.addEventListener('release',()=>setAwake(false));
      }
    }catch(e){ console.warn('WakeLock',e); setAwake(false); }
  };
  const stop=()=>{
    if(watch.current!=null){navigator.geolocation.clearWatch(watch.current);watch.current=null;}
    try{ wake.current&&wake.current.release(); }catch(e){}
    wake.current=null;setAwake(false);
    fbUpd(`${base}/drivers/${driverId}`,{active:false,updatedAt:Date.now()});setOn(false);
  };
  const days=meta.days||[];
  const dIdx=d=>{const i=days.indexOf(d);return i<0?999:i;};
  /* Nur was mir zugeteilt ist — oder niemandem */
  const myUid=account?.uid||driverId;
  const mine=x=>!x.assignedTo||x.assignedTo===myUid;
  const [onlyMine,setOnlyMine]=useState(true);
  const allP=obj2arr(ev.pickups).sort((a,b)=>
    (dIdx(a.day)-dIdx(b.day))||(toMins(a.time)-toMins(b.time)));
  const list=onlyMine?allP.filter(mine):allP;
  const hidden=allP.length-allP.filter(mine).length;
  const next=list.find(p=>!p.done);
  return(
    <div className="pb-24 pt-4 px-4">
      <div className={`rounded-xl border px-4 py-4 mb-4 transition-all ${on?'border-blue-500/45 bg-blue-950/30':'border-zinc-800 bg-zinc-900/60'}`}>
        <div className="flex items-center gap-3">
          <div className="flex-1 min-w-0">
            <div className={`mono text-sm font-bold ${on?'text-blue-300':'text-zinc-300'}`}>{on?'📍 Standort wird geteilt':'Standort teilen'}</div>
            <div className="mono text-[11px] text-zinc-500 mt-0.5">{on?'Leitung sieht dich live auf der Karte':'Leitung sieht deinen Standort aktuell nicht'}</div>
          </div>
          <button onClick={on?stop:start} className={`relative w-12 h-7 rounded-full transition-colors flex-shrink-0 ${on?'bg-blue-500':'bg-zinc-700'}`}>
            <span className={`absolute top-1 w-5 h-5 bg-white rounded-full shadow transition-all ${on?'left-6':'left-1'}`}/></button>
        </div>
        <input value={name} placeholder="Dein Name (für die Leitung)"
          onChange={e=>{setName(e.target.value);localStorage.setItem('uo-drivername',e.target.value);}}
          onBlur={()=>fbUpd(`${base}/drivers/${driverId}`,{name:name.trim()||'Fahrer'})}
          className="w-full mt-3 bg-zinc-900 border border-zinc-700 text-zinc-100 mono text-xs px-3 py-2 rounded-lg focus:border-blue-500 placeholder-zinc-700"/>
        {err&&<div className="mono text-[11px] text-red-400 mt-2">{err}</div>}
        {on&&(
          <div className="mt-3 pt-3 border-t border-blue-500/20 space-y-1.5">
            <div className="flex items-center gap-2">
              <span className={`w-1.5 h-1.5 rounded-full ${lastFix&&Date.now()-lastFix<90000?'bg-emerald-400':'bg-amber-400'}`}/>
              <span className="mono text-[10px] text-zinc-400">
                {lastFix?`Letzte Ortung ${ago(lastFix)} · ${fixes} Aktualisierungen`:'warte auf erste Ortung…'}</span>
            </div>
            {me.lat!=null&&(
              <div className="mono text-[10px] text-blue-400/70">{me.lat.toFixed(5)}, {me.lng.toFixed(5)} · ±{me.acc}m</div>)}
            <div className="flex items-center gap-2">
              <span className={`w-1.5 h-1.5 rounded-full ${awake?'bg-emerald-400':'bg-zinc-600'}`}/>
              <span className="mono text-[10px] text-zinc-500">
                {awake?'Display bleibt an, solange die App offen ist'
                      :'Display-Sperre nicht möglich — bitte manuell offen lassen'}</span>
            </div>
            <div className="mono text-[10px] text-amber-300/80 leading-relaxed pt-1">
              ⚠️ Der Standort läuft nur, solange die App im Vordergrund ist. Sperrst du das Handy
              oder wechselst die App, pausiert die Ortung, bis du zurückkommst.
            </div>
          </div>)}
      </div>
      {next&&(
        <div className="rounded-xl border border-amber-500/40 bg-amber-500/[.07] px-4 py-3 mb-4">
          <div className="mono text-[9px] text-amber-500/80 uppercase tracking-[.18em]">Nächster Transfer</div>
          <div className="flex items-baseline gap-2.5 mt-1">
            <span className="bebas text-3xl text-amber-400 leading-none">{next.time}</span>
            <span className="mono text-sm text-zinc-100 font-bold truncate">{next.label}</span></div>
          <div className="mono text-[11px] text-zinc-500 mt-0.5">{next.day} · {next.from} → {next.to}</div>
        </div>
      )}
      {hidden>0&&(
        <div className="flex gap-2 mb-3">
          <button onClick={()=>setOnlyMine(true)}
            className={`flex-1 py-2 rounded-lg mono text-[11px] border ${onlyMine?'bg-amber-500/10 border-amber-500/40 text-amber-400':'bg-zinc-900 border-zinc-800 text-zinc-500'}`}>
            meine Fahrten</button>
          <button onClick={()=>setOnlyMine(false)}
            className={`flex-1 py-2 rounded-lg mono text-[11px] border ${!onlyMine?'bg-zinc-800 border-zinc-600 text-zinc-200':'bg-zinc-900 border-zinc-800 text-zinc-500'}`}>
            alle ({allP.length})</button>
        </div>)}
      <SectionLabel right={<span className="mono text-[10px] text-zinc-600">{list.filter(p=>!p.done).length} offen</span>}>
        Transfers{onlyMine&&hidden>0?` · ${hidden} für andere ausgeblendet`:''}</SectionLabel>
      <div className="space-y-2 mb-6">
        {list.length===0&&<Empty>Keine Transfers eingetragen.</Empty>}
        {list.map(p=>(
          <div key={p.id} className={`rounded-xl border px-3.5 py-3 flex items-center gap-3 transition-all
            ${p.done?'border-zinc-800/40 bg-zinc-900/25 opacity-45':'border-zinc-800 bg-zinc-900/60'}`}>
            <Check checked={!!p.done} onToggle={()=>fbUpd(`${base}/pickups/${p.id}`,{done:!p.done,doneAt:!p.done?Date.now():null,doneBy:'fahrer'})}/>
            <div className="flex-1 min-w-0">
              <div className={`mono text-sm font-bold ${p.done?'text-zinc-600 line-through':'text-zinc-100'}`}>{p.label}</div>
              <div className="mono text-[10px] text-zinc-500">{p.day} · {p.from} → {p.to}</div>
            </div>
            <TimeEdit value={p.time} onSave={v=>fbUpd(`${base}/pickups/${p.id}`,{time:v})}/>
          </div>
        ))}
      </div>
      {/* An- und Abreisen sind auch Fahrten */}
      {(()=>{
        const tr=obj2arr(ev.travel).filter(t=>travelBy(t)==='own').filter(t=>!onlyMine||mine(t))
          .sort((a,b)=>(a.day||'').localeCompare(b.day||'')||toMins(a.time)-toMins(b.time));
        if(!tr.length)return null;
        return(
          <div className="mb-6">
            <SectionLabel right={<span className="mono text-[10px] text-zinc-600">{tr.filter(t=>!t.done).length} offen</span>}>
              An- &amp; Abreisen, die wir fahren</SectionLabel>
            <div className="space-y-2">
              {tr.map(t=>(
                <div key={t.id} className={`rounded-xl border px-3.5 py-3 flex items-start gap-3 transition-all
                  ${t.done?'border-zinc-800/40 bg-zinc-900/25 opacity-45':'border-blue-500/25 bg-blue-950/15'}`}>
                  <Check checked={!!t.done} onToggle={()=>fbUpd(`${base}/travel/${t.id}`,{done:!t.done,doneAt:!t.done?Date.now():null})}/>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-1.5 flex-wrap">
                      <span className={`mono text-sm font-bold ${t.done?'text-zinc-600 line-through':'text-zinc-100'}`}>{t.artist}</span>
                      <span className="mono text-[9px] px-1.5 py-0.5 rounded border border-blue-500/40 bg-blue-500/10 text-blue-300">

                      <span className="mono text-[10px] text-zinc-600">{t.day}</span>

      <SectionLabel>Locations</SectionLabel>
      <div className="space-y-2">
        {[{i:'🏨',t:'HOTEL',n:meta.hotelName,a:meta.hotelAddr},{i:'📍',t:'VENUE',n:meta.venueName,a:meta.venueAddr}].map(x=>(

/* ══ EINKAUFSLISTE ═══════════════════════════════════════════════════ */
const parseRider=txt=>(txt||'').split('\n').flatMap(l=>l.split('·')).map(s=>s.trim()).filter(Boolean)
  .map(line=>{const m=line.match(/^(\d+)\s*[x×]\s*(.+)$/i);
    return m?{qty:parseInt(m[1]),name:m[2].trim()}:{qty:1,name:line};});
const CATS=[
  {id:'alk',  l:'Alkohol',        ic:'🥃', re:/vodka|wodka|sekt|champagn|prosecco|bier|corona|gin\b|whisky|tequila|don julio|moët|moet|belvedere|absolut|grey goose|sparkling wine|roku|suntory|premium vodka/i},
  {id:'drink',l:'Getränke',       ic:'🥤', re:/wasser|water|mate|red bull|energy|cola|fanta|powerade|juice|saft|säfte|limonade|lemonade|ginger|capri|volvic|charitea|coconut|vitamin|shot|zitronensaft|lime juice|soft drink|fiji/i},
  {id:'tab',  l:'Tabak',          ic:'🚬', re:/zigaretten|marlboro|camel|pall mall|vogue|r1 blue|papes|ocb|weed/i},
  {id:'food', l:'Essen & Snacks', ic:'🍓', re:/früchte|frucht|banane|mango|snack|protein|haribo|sweets|nüsse|kaugummi|orbit|erdbeer|trauben|blaubeer|limette|zitrone|bars/i},
  {id:'mat',  l:'Material',       ic:'🧺', re:/handtuch|handtücher|ventilator|fans|power strip|mic\b|xlr|drink ticket|glas/i},
  {id:'rest', l:'Sonstiges',      ic:'📦', re:/.*/},
];
const catOf=n=>(CATS.find(c=>c.re.test(n))||CATS[CATS.length-1]).id;
const normKey=n=>n.toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-zäöüß0-9 ]/g,'').replace(/\s+/g,' ').trim();

function Shopping({ev,base}){
  const [extraTxt,setExtraTxt]=useState('');
  const [hideDone,setHideDone]=useState(false);
  const bought=ev.bought||{};
  const artists=obj2arr(ev.artists);
  const agg=useMemo(()=>{
    const map={};
    artists.forEach(a=>parseRider(a.rider).forEach(it=>{
      const k=normKey(it.name);if(!k)return;
      if(!map[k])map[k]={key:k,name:it.name,qty:0,who:[],cat:catOf(it.name)};
      map[k].qty+=it.qty;
      if(it.name.length>map[k].name.length)map[k].name=it.name;
      if(!map[k].who.includes(a.name))map[k].who.push(a.name);
    }));
    return Object.values(map).sort((a,b)=>b.qty-a.qty||a.name.localeCompare(b.name));
  },[JSON.stringify(artists.map(a=>[a.name,a.rider]))]);
  const extras=obj2arr(ev.shopping);
  const total=agg.length+extras.length;
  const doneN=agg.filter(i=>bought[i.key]).length+extras.filter(e=>e.done).length;
  const byCat={};agg.forEach(i=>(byCat[i.cat]=byCat[i.cat]||[]).push(i));
  const addExtra=()=>{if(!extraTxt.trim())return;
    const p=parseRider(extraTxt)[0];
    fbPush(`${base}/shopping`,{name:p.name,qty:p.qty,done:false,createdAt:Date.now()});setExtraTxt('');};

  return(
    <div className="pb-24 pt-4">
      <div className="px-4">
        <div className="bg-zinc-900/70 border border-zinc-800 rounded-xl px-4 py-3 mb-4 flex items-center gap-4">
          <div><div className="bebas text-3xl text-emerald-400 leading-none">{doneN}<span className="text-zinc-700">/{total}</span></div>
            <div className="mono text-[9px] text-zinc-600 uppercase tracking-wider mt-0.5">besorgt</div></div>
          <div className="flex-1 h-1.5 bg-zinc-800 rounded-full overflow-hidden">
            <div className="h-full bg-emerald-500 rounded-full transition-all" style={{width:(total?doneN/total*100:0)+'%'}}/></div>
          <button onClick={()=>setHideDone(!hideDone)}
            className={`mono text-[10px] px-2.5 py-1.5 rounded-lg border transition-all ${hideDone?'text-amber-400 border-amber-500/40 bg-amber-500/10':'text-zinc-500 border-zinc-700'}`}>
            {hideDone?'alle':'offen'}</button>
        </div>

        {total===0&&<Empty>Keine Rider-Positionen gefunden.{'\n'}Trage Rider bei den Artists ein — sie erscheinen hier automatisch.</Empty>}

        {CATS.filter(c=>byCat[c.id]?.length).map(c=>{
          const items=byCat[c.id].filter(i=>!hideDone||!bought[i.key]);
          if(!items.length)return null;
          return(
            <div key={c.id} className="mb-5">
              <SectionLabel right={<span className="mono text-[10px] text-zinc-700">{byCat[c.id].length}</span>}>{c.ic} {c.l}</SectionLabel>
              <div className="space-y-1.5">
                {items.map(i=>(
                  <button key={i.key} onClick={()=>fbSet(`${base}/bought/${i.key}`,!bought[i.key])}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border text-left transition-all active:scale-[.99]
                      ${bought[i.key]?'border-zinc-800/40 bg-zinc-900/25 opacity-45':'border-zinc-800 bg-zinc-900/55'}`}>
                    <span className={`w-6 h-6 rounded-md border flex items-center justify-center flex-shrink-0
                      ${bought[i.key]?'bg-emerald-500 border-emerald-500':'border-zinc-600 bg-zinc-800'}`}>
                      {bought[i.key]&&<span className="text-black text-[11px] font-black">✓</span>}</span>
                    <span className="bebas text-xl text-amber-400 w-9 flex-shrink-0 leading-none">{i.qty}×</span>
                    <span className="flex-1 min-w-0">
                      <span className={`block mono text-[12px] font-semibold ${bought[i.key]?'text-zinc-600 line-through':'text-zinc-100'}`}>{i.name}</span>
                      <span className="block mono text-[9px] text-zinc-600 truncate">{i.who.join(', ')}</span></span>
                  </button>))}
              </div>
            </div>);
        })}

        <div className="mt-2">
          <SectionLabel>➕ Zusätzlich besorgen</SectionLabel>
          <div className="space-y-1.5 mb-2">
            {extras.filter(e=>!hideDone||!e.done).map(e=>(
              <div key={e.id} className={`flex items-center gap-3 px-3 py-2.5 rounded-xl border transition-all
                ${e.done?'border-zinc-800/40 bg-zinc-900/25 opacity-45':'border-zinc-800 bg-zinc-900/55'}`}>
                <Check checked={!!e.done} onToggle={()=>fbUpd(`${base}/shopping/${e.id}`,{done:!e.done})} size={24}/>
                <span className="bebas text-xl text-amber-400 w-9 flex-shrink-0 leading-none">{e.qty}×</span>
                <TextEdit value={e.name} onSave={v=>fbUpd(`${base}/shopping/${e.id}`,{name:v})}
                  cls={`flex-1 text-[12px] font-semibold ${e.done?'text-zinc-600 line-through':'text-zinc-100'}`}/>
                <button onClick={()=>fbDel(`${base}/shopping/${e.id}`)} className="text-zinc-700 text-xs px-1 active:text-red-400">✕</button>
              </div>))}
          </div>
          <div className="flex gap-2">
            <input value={extraTxt} onChange={e=>setExtraTxt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addExtra()}
              placeholder="z. B. 20x Becher"
              className="flex-1 bg-zinc-900 border border-zinc-800 text-zinc-100 mono text-sm px-3 py-2.5 rounded-xl focus:border-amber-500 placeholder-zinc-700"/>
            <button onClick={addExtra} className="bg-amber-500 text-black mono text-lg font-bold px-4 rounded-xl active:scale-95">+</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══ RASTER · alle Floors parallel, Zeitachse senkrecht ══════════════ */
const PX_PER_MIN=1.15;                      // Höhe einer Minute
function Grid({ev,base}){
  const meta=ev.meta||{};const days=meta.days||[];const floors=meta.floors||[];
  const [day,setDay]=useState(()=>days.find(x=>isLiveDay(x,Date.now()))||days[0]);
  const [sel,setSel]=useState(null);
  const [now,setNow]=useState(Date.now());
  const scroller=useRef(null);const didScroll=useRef(false);
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),30000);return()=>clearInterval(t);},[]);
  useEffect(()=>{if(!days.includes(day))setDay(days.find(x=>isLiveDay(x,Date.now()))||days[0]);},[days.join('|')]);
  const st=ev.status||{};

  const sets=obj2arr(ev.artists).filter(a=>a.day===day&&a.setStart&&a.setEnd);
  const empty=sets.length===0;

  // Zeitfenster bestimmen (volle Stunden)
  let lo=0,hi=60;
  if(!empty){
    lo=Math.min(...sets.map(s=>toMins(s.setStart)));
    hi=Math.max(...sets.map(s=>{const e=toMins(s.setEnd);return e<=toMins(s.setStart)?e+1440:e;}));
    lo=Math.floor(lo/60)*60; hi=Math.ceil(hi/60)*60;
  }
  const H=(hi-lo)*PX_PER_MIN;
  const hours=[];for(let m=lo;m<=hi;m+=60)hours.push(m);
  const label=m=>String(Math.floor((m%1440)/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

  const nowM=nowMins(now);
  const isToday=isLiveDay(day,now);
  const nowY=(nowM-lo)*PX_PER_MIN;
  const nowVisible=!empty&&isToday&&nowM>=lo&&nowM<=hi;
  const liveDay=days.find(x=>isLiveDay(x,now));   // welcher Tag läuft gerade?

  useEffect(()=>{                                    // beim Öffnen zur aktuellen Zeit springen
    if(nowVisible&&scroller.current&&!didScroll.current){
      didScroll.current=true;
      scroller.current.scrollTop=Math.max(0,nowY-160);
    }
  },[nowVisible,nowY]);

  if(empty)return(
    <div className="pt-0">
      <DaySwitch days={days} day={day} setDay={setDay} liveDay={liveDay}/>
      <Empty>Kein Line-up für {day}.</Empty></div>);

  return(
    <div className="flex flex-col" style={{height:'calc(100dvh - 190px)'}}>
      <DaySwitch days={days} day={day} setDay={setDay} liveDay={liveDay}/>
      {/* Kopfzeile mit Floornamen */}
      <div className="flex px-4 gap-1.5 pb-1.5 flex-shrink-0">
        <div className="w-11 flex-shrink-0"/>
        {floors.map(f=>{const c=facc(floors,f);
          return <div key={f} className={`flex-1 min-w-0 text-center mono text-[9px] font-bold py-1 rounded-md border ${c.t} ${c.b} ${c.bg}`}>
            <span className="block truncate px-1">{f.replace(/^Floor\s*/,'')}</span></div>;})}
      </div>
      {/* Raster */}
      <div ref={scroller} className="flex-1 overflow-y-auto px-4 pb-6">
        <div className="relative flex gap-1.5" style={{height:H}}>
          {/* Zeitachse */}
          <div className="w-11 flex-shrink-0 relative">
            {hours.map(m=>(
              <div key={m} className="absolute left-0 mono text-[9px] text-zinc-600"
                style={{top:(m-lo)*PX_PER_MIN-5}}>{label(m)}</div>))}
          </div>
          {/* Stundenlinien */}
          {hours.map(m=>(
            <div key={'l'+m} className="absolute left-11 right-0 border-t border-zinc-800/70 pointer-events-none"
              style={{top:(m-lo)*PX_PER_MIN}}/>))}
          {/* Floorspalten */}
          {floors.map(f=>{
            const col=sets.filter(a=>a.floor===f);
            const c=facc(floors,f);
            return(
              <div key={f} className="flex-1 min-w-0 relative">
                {col.map(a=>{
                  const s0=toMins(a.setStart);
                  let s1=toMins(a.setEnd); if(s1<=s0)s1+=1440;
                  const top=(s0-lo)*PX_PER_MIN, h=Math.max(24,(s1-s0)*PX_PER_MIN);
                  const s=st[a.id]||{};
                  const live=isToday&&nowM>=s0&&nowM<s1;
                  const done=!!s.set_end;
                  return(
                    <button key={a.id} onClick={()=>setSel(a)}
                      className={`absolute left-0 right-0 rounded-lg border px-1.5 py-1 text-left overflow-hidden transition-all active:scale-[.98]
                        ${live?'border-emerald-400 bg-emerald-500/20':done?'border-zinc-800 bg-zinc-900/40 opacity-45':`${c.b} ${c.bg}`}`}
                      style={{top,height:h-3,
                        boxShadow:live?'0 0 14px rgba(16,185,129,.35)':'none',
                        zIndex:live?20:5}}>
                      <span className={`block mono text-[10px] font-bold leading-tight truncate ${live?'text-emerald-200':done?'text-zinc-600':'text-zinc-100'}`}>{a.name}</span>
                      {h>38&&<span className={`block mono text-[8px] leading-tight ${live?'text-emerald-300/80':'text-zinc-500'}`}>{a.setStart}–{a.setEnd}</span>}
                      {h>56&&a.soundcheck&&<span className="block mono text-[8px] text-violet-300/80 leading-tight">SC {a.soundcheck}</span>}
                      {h>56&&live&&<span className="block mono text-[8px] text-emerald-400 font-bold leading-tight mt-0.5">▶ LÄUFT</span>}
                    </button>);
                })}
              </div>);
          })}
          {/* Leuchtender Jetzt-Strich über alle Floors */}
          {nowVisible&&(
            <div className="absolute left-0 right-0 pointer-events-none" style={{top:nowY,zIndex:40}}>
              <div className="relative flex items-center">
                <span className="mono text-[9px] font-bold text-red-400 bg-zinc-950 pr-1 -ml-0.5"
                  style={{textShadow:'0 0 8px rgba(239,68,68,.9)'}}>{clockNow()}</span>
                <span className="flex-1 h-px bg-red-500" style={{boxShadow:'0 0 8px 1px rgba(239,68,68,.85)'}}/>
                <span className="w-1.5 h-1.5 rounded-full bg-red-500 -ml-0.5" style={{boxShadow:'0 0 8px 2px rgba(239,68,68,.9)'}}/>
              </div>
            </div>)}
        </div>
      </div>
      <SetSheet a={sel} floors={floors} onClose={()=>setSel(null)}/>
    </div>
  );
}
function DaySwitch({days,day,setDay,liveDay}){
  return(
    <div className="px-4 pt-4 pb-2.5 flex gap-2 flex-shrink-0">
      {days.map(x=>(
        <button key={x} onClick={()=>setDay(x)}
          className={`relative flex-1 py-2.5 rounded-lg mono text-sm font-bold border transition-all
            ${day===x?'bg-amber-500/10 border-amber-500/40 text-amber-400':'bg-zinc-900 border-zinc-800 text-zinc-500'}`}>
          {x}
          {liveDay===x&&<span className="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-red-500"
            style={{boxShadow:'0 0 6px 1px rgba(239,68,68,.9)'}}/>}
        </button>))}
    </div>);
}
/* gemeinsame Set-Detailansicht für Raster und Ablauf */
function SetSheet({a,floors,onClose}){
  if(!a)return null;
  const c=facc(floors,a.floor);
  return(
    <Sheet open={!!a} onClose={onClose} title={a.name||''}>
      <div className="space-y-4">
        <div className="flex gap-2 flex-wrap">
          <span className="mono text-xs bg-zinc-900 border border-zinc-700 px-2.5 py-1.5 rounded-lg text-amber-400">{a.setStart} – {a.setEnd}</span>
          <span className={`mono text-xs px-2.5 py-1.5 rounded-lg border ${c.t} ${c.b} ${c.bg}`}>{a.floor}</span>
          {a.soundcheck&&<span className="mono text-xs bg-violet-500/10 border border-violet-500/30 text-violet-300 px-2.5 py-1.5 rounded-lg">SC {a.soundcheck}</span>}
        </div>
        {a.notes&&<div className="mono text-xs text-zinc-400 leading-relaxed bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2.5">{a.notes}</div>}
        {a.contactPhone&&(
          <a href={`tel:${a.contactPhone}`} className="flex items-center gap-2 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2.5 mono text-xs text-blue-300">
            📞 {a.contactName} · {a.contactPhone}</a>)}
        {a.tech&&<div><div className="mono text-[10px] text-violet-400/80 uppercase tracking-wider mb-1.5">🎛 Techrider</div>
          <div className="mono text-xs text-violet-200 leading-relaxed bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2.5 whitespace-pre-line">{a.tech}</div></div>}
        {a.rider&&<div><div className="mono text-[10px] text-amber-500/80 uppercase tracking-wider mb-1.5">🍾 Rider</div>
          <div className="bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2.5 space-y-1">
            {parseRider(a.rider).map((it,i)=>(
              <div key={i} className="flex gap-2 mono text-xs text-zinc-300">
                {it.qty>1&&<span className="text-amber-500 font-bold w-7">{it.qty}×</span>}<span>{it.name}</span></div>))}</div></div>}
      </div>
    </Sheet>
  );
}

/* ══ ABLAUF · durchlaufender Timetable ═══════════════════════════════ */
function Runsheet({ev,base}){
  const meta=ev.meta||{};const days=meta.days||[];const floors=meta.floors||[];
  const [day,setDay]=useState(()=>days.find(x=>isLiveDay(x,Date.now()))||days[0]);
  const [show,setShow]=useState({set:true,pick:true,trav:true});
  const [sel,setSel]=useState(null);
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),30000);return()=>clearInterval(t);},[]);
  useEffect(()=>{if(!days.includes(day))setDay(days.find(x=>isLiveDay(x,Date.now()))||days[0]);},[days.join('|')]);
  const st=ev.status||{};

  const items=[];
  if(show.set)obj2arr(ev.artists).filter(a=>a.day===day).forEach(a=>{
    items.push({k:'set',id:a.id,t:a.setStart,end:a.setEnd,title:a.name,sub:a.floor,a});
    if(a.soundcheck)items.push({k:'sc',id:a.id+'-sc',t:a.soundcheck,title:`Soundcheck · ${a.name}`,sub:a.floor,a});
  });
  if(show.pick)obj2arr(ev.pickups).filter(p=>p.day===day).forEach(p=>
    items.push({k:'pick',id:p.id,t:p.time,title:p.label,sub:`${p.from} → ${p.to}`,done:p.done}));
  if(show.trav)obj2arr(ev.travel).forEach(tr=>{
    const dd=(day.match(/(\d{2}\.\d{2})/)||[])[1];
    if(dd&&tr.day===dd)items.push({k:tr.dir==='in'?'in':'out',id:tr.id,t:tr.time,
      title:`${tr.dir==='in'?'Ankunft':'Abfahrt'} · ${tr.artist}`,sub:`${tr.from} → ${tr.to}`,done:tr.done});});
  items.sort((a,b)=>toMins(a.t)-toMins(b.t));

  const nowM=nowMins(now);
  const isToday=isLiveDay(day,now);
  const liveDay=days.find(x=>isLiveDay(x,now));
  const nextIdx=items.findIndex(i=>toMins(i.t)>=nowM);
  const KIND={
    set: {ic:'🎧',c:'#fbbf24',l:'SET'},
    sc:  {ic:'🔊',c:'#a78bfa',l:'SOUNDCHECK'},
    pick:{ic:'🚐',c:'#60a5fa',l:'PICKUP'},
    in:  {ic:'↓', c:'#34d399',l:'ANKUNFT'},
    out: {ic:'↑', c:'#f472b6',l:'ABFAHRT'},
  };
  const F=[{id:'set',l:'Sets'},{id:'pick',l:'Pickups'},{id:'trav',l:'An/Abreise'}];

  return(
    <div className="pb-24 pt-4">
      <div className="-mt-4 mb-0.5"><DaySwitch days={days} day={day} setDay={setDay} liveDay={liveDay}/></div>
      <div className="px-4 flex gap-1.5 mb-4">
        {F.map(f=><button key={f.id} onClick={()=>setShow(s=>({...s,[f.id]:!s[f.id]}))}
          className={`flex-1 py-1.5 rounded-lg mono text-[10px] font-bold border transition-all
            ${show[f.id]?'text-zinc-100 border-zinc-500 bg-zinc-800':'text-zinc-600 border-zinc-800 bg-zinc-900 line-through'}`}>{f.l}</button>)}
      </div>
      <div className="px-4">
        {items.length===0&&<Empty>Nichts geplant für {day}.</Empty>}
        <div className="relative">
          <div className="absolute left-[52px] top-2 bottom-2 w-px bg-zinc-800"/>
          {items.map((i,idx)=>{
            const K=KIND[i.k];
            const live=i.k==='set'&&isToday&&toMins(i.t)<=nowM&&toMins(i.end)>nowM;
            const past=isToday&&toMins(i.t)<nowM;
            const s=i.a?(st[i.a.id]||{}):{};
            return(
              <React.Fragment key={i.id+idx}>
                {isToday&&idx===nextIdx&&(
                  <div className="flex items-center gap-2 my-2 pl-1">
                    <span className="mono text-[9px] text-red-400 font-bold w-[46px] text-right">{clockNow()}</span>
                    <span className="w-2 h-2 rounded-full bg-red-500 flex-shrink-0" style={{boxShadow:'0 0 8px #ef4444'}}/>
                    <span className="flex-1 h-px bg-red-500/50"/>
                    <span className="mono text-[9px] text-red-400 font-bold">JETZT</span>
                  </div>)}
                <button onClick={()=>i.a&&setSel(i.a)}
                  className={`w-full flex gap-3 items-start py-1.5 text-left ${past&&!live?'opacity-40':''}`}>
                  <span className="w-[46px] flex-shrink-0 text-right pt-0.5">
                    <span className={`mono text-xs font-bold ${live?'text-emerald-400':'text-zinc-300'}`}>{i.t||'—'}</span>
                    {i.end&&<span className="block mono text-[9px] text-zinc-600">{i.end}</span>}</span>
                  <span className="relative flex-shrink-0 mt-1" style={{width:12}}>
                    <span className="block w-2.5 h-2.5 rounded-full border-2 border-zinc-950"
                      style={{background:live?'#10b981':K.c,marginLeft:-1,boxShadow:live?'0 0 10px #10b981':'none'}}/></span>
                  <span className={`flex-1 min-w-0 rounded-lg border px-3 py-2 transition-all
                    ${live?'border-emerald-500/50 bg-emerald-950/25':i.done?'border-zinc-800/40 bg-zinc-900/20':'border-zinc-800 bg-zinc-900/50'}`}>
                    <span className="flex items-center gap-1.5 flex-wrap">
                      <span className="mono text-[8px] px-1.5 py-0.5 rounded" style={{color:K.c,background:K.c+'1f'}}>{K.ic} {K.l}</span>
                      {live&&<span className="mono text-[8px] px-1.5 py-0.5 rounded bg-emerald-500 text-black font-bold">LÄUFT</span>}
                      {i.done&&<span className="mono text-[8px] text-emerald-500">✓</span>}
                    </span>
                    <span className={`block mono text-[13px] font-bold mt-1 truncate ${i.done?'text-zinc-600 line-through':'text-zinc-100'}`}>{i.title}</span>
                    <span className="block mono text-[10px] text-zinc-500 truncate">{i.sub}</span>
                    {i.k==='set'&&i.a?.tech&&<span className="block mono text-[9px] text-violet-400/70 truncate mt-0.5">🎛 {i.a.tech}</span>}
                    {i.k==='set'&&s.im_club&&<span className="block mono text-[9px] text-emerald-500/80 mt-0.5">✓ im Club</span>}
                  </span>
                </button>
              </React.Fragment>);
          })}
        </div>
      </div>
      <Sheet open={!!sel} onClose={()=>setSel(null)} title={sel?.name||''}>
        {sel&&(
          <div className="space-y-4">
            <div className="flex gap-2 flex-wrap">
              <span className="mono text-xs bg-zinc-900 border border-zinc-700 px-2.5 py-1.5 rounded-lg text-amber-400">{sel.setStart} – {sel.setEnd}</span>
              <span className={`mono text-xs px-2.5 py-1.5 rounded-lg border ${facc(floors,sel.floor).t} ${facc(floors,sel.floor).b} ${facc(floors,sel.floor).bg}`}>{sel.floor}</span>
              {sel.soundcheck&&<span className="mono text-xs bg-violet-500/10 border border-violet-500/30 text-violet-300 px-2.5 py-1.5 rounded-lg">SC {sel.soundcheck}</span>}
            </div>
            {sel.notes&&<div className="mono text-xs text-zinc-400 leading-relaxed bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2.5">{sel.notes}</div>}
            {sel.contactPhone&&(
              <a href={`tel:${sel.contactPhone}`} className="flex items-center gap-2 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2.5 mono text-xs text-blue-300">
                📞 {sel.contactName} · {sel.contactPhone}</a>)}
            {sel.tech&&<div><div className="mono text-[10px] text-violet-400/80 uppercase tracking-wider mb-1.5">🎛 Techrider</div>
              <div className="mono text-xs text-violet-200 leading-relaxed bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2.5 whitespace-pre-line">{sel.tech}</div></div>}
            {sel.rider&&<div><div className="mono text-[10px] text-amber-500/80 uppercase tracking-wider mb-1.5">🍾 Rider</div>
              <div className="bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2.5 space-y-1">
                {parseRider(sel.rider).map((it,i)=>(
                  <div key={i} className="flex gap-2 mono text-xs text-zinc-300">
                    {it.qty>1&&<span className="text-amber-500 font-bold w-7">{it.qty}×</span>}<span>{it.name}</span></div>))}</div></div>}
          </div>)}
      </Sheet>
    </div>
  );
}

/* ══ ZUTEILUNG AN FAHRER ═════════════════════════════════════════════ */
/* Alle Konten mit Fahrer-Rolle — für die Zuteilung von Fahrten */
function useDrivers(){
  const [list,setList]=useState([]);
  useEffect(()=>fbOn(USERS,d=>{
    setList(obj2arr(d).filter(u=>userRoles(u).includes('fahrer'))
      .map(u=>({uid:u.uid||u.id,name:u.name||u.email||'Fahrer'}))
      .sort((a,b)=>a.name.localeCompare(b.name)));
  },()=>setList([])),[]);
  return list;
}
function AssignPicker({value,onSet,drivers,compact}){

    <select value={value||''} onChange={e=>onSet(e.target.value||null)}

      <option value="">niemand</option>

  return(
    <label className="block">
      <div className="text-zinc-500 text-[10px] mono uppercase tracking-wider mb-1">Zugeteilt an</div>

        className="w-full bg-zinc-900 border border-zinc-700 text-zinc-100 mono text-sm px-3 py-2.5 rounded-lg focus:border-amber-500">
        <option value="">— alle Fahrer sehen es —</option>
        {drivers.map(d=><option key={d.uid} value={d.uid}>{d.name}</option>)}

      <div className="mono text-[9px] text-zinc-600 mt-1 leading-relaxed">
